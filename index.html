<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام طلبات الفعاليات والمبادرات</title>
<style>
/* الخط الموحّد: IBM Plex Sans Arabic (يُحمَّل من Google Fonts) */
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    /* هوية موحّدة: عنابي + أبيض (مع الكحلي والذهبي كلمسات ثانوية) */
    /* ══════════ الهوية: فحمي هادئ + ذهبي (مطابقة للنظام المرجعي) ══════════ */
    --side:#1A333D; --side2:#2D5D57; --side-ink:#F5F0E8;
    --gold:#2E7069; --gold-l:#E1EFEC; --gold-d:#275F59;
    --ok:#388467; --ok-l:#E3F1EA;
    --warn:#C68135; --warn-l:#F8E8D3;
    --dan:#CF443A; --dan-l:#FBE7E5;
    --info-c:#3E7894; --info-l:#E4EDF2;
    --r:10px; --surface:#FFFFFF; --line2:#EFF0F3; --ink2:#5B626C; --ink3:#8A919B;
    --accent-grad:linear-gradient(135deg,#0B3B6B,#1B5FA6);
    --brass-700:#275F59; --brass-600:#2E7069; --brass:#2E7069; --brass-300:#DD964B; --brass-100:#E1EFEC;
    --limestone:#F8F6F1; --limestone-card:#FFFFFF; --limestone-hover:#F5F6F8;
    --green:#256B4E; --green-bg:#E4F1EA;
    --maroon-s:#A82820; --maroon-bg:#FAE7E5;
    /* أسماء متوافقة مع المكوّنات القائمة */
    --deep-teal:#23262B; --hero-teal:#2C3036; --primary-teal:#2E7069; --primary-teal-dark:#275F59;
    --light-teal:#E1EFEC; --copper:#DD964B; --copper-light:#F8E8D3;
    --page-background:#F8F6F1; --card-background:#FFFFFF; --card-hover:#F0ECE6;
    --main-text:#1C323B; --heading-text:#1C323B; --muted-text:#6E7A7E; --soft-text:#8A9599;
    --border-c:#DED9D0; --border-light:#EAE5DC;
    --success:#388467; --success-bg:#E3F1EA;
    --warning:#C68135; --warning-bg:#F8E8D3;
    --danger:#CF443A;  --danger-bg:#FBE7E5;
    --info:#3E7894;    --info-bg:#E4EDF2;
    --shadow-sm:0 5px 18px rgba(35,53,56,.05);
    --shadow-md:0 14px 32px rgba(35,53,56,.08);
    --shadow-lg:0 22px 50px rgba(35,53,56,.13);
    /* الأسماء القديمة مربوطة بهوية مدار حتى تتحدّث كل المكونات تلقائيًا */
    --brand-950:#1A333D; --brand-900:#2D5D57; --brand-800:#275F59; --brand-700:#2E7069;
    --brand-600:#3E988E; --brand-500:#3E988E; --brand-400:#8FBDB7; --brand-300:#DD964B;
    --brand-100:#E1EFEC; --brand-50:#F1F7F5;
    --sand-100:#F0ECE6; --sand-200:#DED9D0; --sand-50:#FFFFFF;
    --cyan-700:#2A5C8A; --cyan-600:#2A5C8A; --cyan-100:#E5EDF5;
    --gold-700:#275F59; --gold-600:#2E7069; --gold-100:#E1EFEC;
    --red-700:#A82820; --red-600:#A82820; --red-100:#FAE7E5;
    --maroon-950:#1A333D; --maroon-900:#2D5D57; --maroon-800:#2E7069; --maroon-700:#275F59; --maroon-600:#3E988E;
    --maroon-100:#E1EFEC; --maroon-50:#F1F7F5; --gold-d:#275F59; --red:#A82820;
    --ink:#1C323B; --muted:#6E7A7E; --line:#DED9D0; --line-strong:#D2CDC4;
    --white:#FFFFFF; --page:#F8F6F1;
    --font-body:'IBM Plex Sans Arabic','Tajawal',sans-serif;
    --font-head:'IBM Plex Sans Arabic','Tajawal',sans-serif;
    --radius:12px; --shadow:0 1px 2px rgba(11,31,51,.06),0 4px 16px rgba(11,31,51,.08);
  }
  h1,h2,h3,h4{font-family:var(--font-head); color:var(--maroon-800);}
  button{font-family:var(--font-body);}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:var(--font-body); font-size:13.5px; font-weight:400; line-height:1.7; font-variant-numeric:lining-nums tabular-nums; font-feature-settings:"lnum"; background:var(--page); color:var(--ink); min-height:100vh;}
  #app{display:flex; min-height:100vh;}
  #sidebar{width:250px; flex:0 0 250px; background:linear-gradient(180deg,#0E2A47 0%,#124C6B 60%,#12857F 100%); color:var(--white);
    display:flex; flex-direction:column; position:sticky; top:0; height:100vh;}
  .brand{display:flex; align-items:center; gap:10px; padding:20px 16px; border-bottom:1px solid rgba(255,255,255,.12);}
  .brand img{width:42px;height:42px;object-fit:contain;}
  .brand .logo-placeholder{width:42px;height:42px;border-radius:8px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:18px;}
  .brand-name{font-family:var(--font-head);font-weight:700;font-style:italic;font-size:15px;line-height:1.3;}
  .brand-sub{font-size:11px;opacity:.75;margin-top:2px;}
  nav.mainnav{flex:1; padding:14px 10px; display:flex; flex-direction:column; gap:4px; overflow-y:auto;}
  nav.mainnav button{all:unset; cursor:pointer; display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px; font-size:14px; font-weight:400; color:rgba(255,255,255,.88); transition:background .15s;}
  nav.mainnav button .ic{font-size:17px; width:20px; text-align:center;}
  nav.mainnav button:hover{background:rgba(255,255,255,.08);}
  nav.mainnav button.active{background:var(--maroon-700); color:#fff; font-weight:700;}
  .sidebar-foot{padding:14px; font-size:11px; opacity:.85; border-top:1px solid rgba(255,255,255,.12); display:flex; flex-direction:column; gap:8px;}
  .sidebar-foot button{all:unset; cursor:pointer; background:rgba(255,255,255,.12); color:#fff; padding:7px 10px; border-radius:6px; font-size:12px; text-align:center;}
  .sidebar-foot button:hover{background:rgba(255,255,255,.22);}
  #main{flex:1; display:flex; flex-direction:column; min-width:0;}
  header.topbar{background:var(--white); border-bottom:2px solid var(--maroon-800); padding:16px 26px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:5; box-shadow:var(--shadow);}
  header.topbar h1{font-family:var(--font-head); font-style:italic; font-weight:700; color:var(--maroon-800); font-size:21px; margin:0;}
  header.topbar .sub{font-size:12.5px;color:#4A5C6E;margin-top:3px;}
  .content{padding:24px 26px 60px; flex:1;}
  .grid > .card{height:100%;}
  .card{background:var(--white); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:0 14px 14px; margin-bottom:14px; overflow:hidden;}
  .card h2{font-family:var(--font-head); font-weight:700; color:#fff; background:var(--maroon-800); font-size:17px; margin:0 -14px 12px -14px; padding:10px 14px; border-radius:0; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; border-bottom:none;}
  .form-table{width:100%; border-collapse:collapse; margin:0 -14px; width:calc(100% + 28px);}
  .form-table thead th{background:linear-gradient(90deg,var(--brand-800),var(--brand-700)); color:#fff; font-family:var(--font-head); font-weight:700; font-size:16px; padding:9px 14px; text-align:right;}
  .form-table tbody td{border:1px solid #E2E8F0; padding:8px 10px; vertical-align:top;}
  .form-table tbody td label{display:block; font-size:14px; font-weight:700; color:#13314F; margin-bottom:4px;}
  .form-table input, .form-table select, .form-table textarea{font-size:14px; font-weight:400; color:#13314F; border-color:#E2E8F0;}
  .form-table input:focus, .form-table select:focus, .form-table textarea:focus{border-color:#13314F; box-shadow:0 0 0 3px rgba(11,31,51,.12);}
  .form-table .checkbox-chip, .form-table .presenter-chip{font-size:14px; color:#13314F;}
  .form-table .helper{font-size:12px; font-weight:400; color:#7C8B9A;}
  .form-table.compact tbody td{padding:4px 6px; white-space:nowrap;}
  .form-table.compact tbody td label{font-size:14px; margin-bottom:2px;}
  .form-table .auto-w{width:auto; min-width:0; max-width:100%;}
  .form-table .auto-w.num{width:84px;}
  /* ===== بوابة الدخول: حدود ذهبية مضيئة وخلفية زرقاء فاتحة ===== */
  /* ══════════ شاشة الدخول — مطابقة للنظام المرجعي ══════════ */
  .lgw{min-height:100vh; min-height:100dvh; width:100%; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:16px; padding:22px 16px; position:relative; overflow:hidden;
    background:#0B1B2E;
    background-image:radial-gradient(1100px 620px at 78% -12%,rgba(27,95,166,.55),transparent 60%),
      radial-gradient(760px 520px at 6% 106%,rgba(184,145,47,.30),transparent 62%),
      linear-gradient(168deg,#0B1B2E 0%,#0B3B6B 58%,#09263F 100%);}
  .lgw:before{content:""; position:absolute; inset:0; background-image:
    linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
    background-size:52px 52px; -webkit-mask-image:radial-gradient(circle at 50% 40%,#000,transparent 72%);
    mask-image:radial-gradient(circle at 50% 40%,#000,transparent 72%);}
  .lgcard{position:relative; width:100%; max-width:430px; background:rgba(255,255,255,.98); border-radius:20px;
    box-shadow:0 26px 64px rgba(3,14,28,.44),0 2px 0 rgba(255,255,255,.6) inset; padding:26px 24px 22px;
    border:1px solid rgba(255,255,255,.5); animation:lgIn .42s cubic-bezier(.22,1,.36,1) both;}
  @keyframes lgIn{from{opacity:0; transform:translateY(16px) scale(.985);} to{opacity:1; transform:none;}}
  .lgbrand{text-align:center; margin-bottom:18px;}
  .lglogo{width:74px; height:74px; margin:0 auto 12px; border-radius:20px; display:grid; place-items:center; overflow:hidden; padding:0;
    background:linear-gradient(145deg,#0B3B6B,#1B5FA6); box-shadow:0 10px 22px rgba(11,59,107,.34);}
  .lglogo .lu{width:42px; height:42px; color:#1A333D;}
  .lgbrand h1{font-size:19px; margin:0 0 4px; font-weight:800; color:#0B2540; letter-spacing:-.2px; line-height:1.45;}
  .lgbrand p{margin:0; color:#6B7683; font-size:12.5px;}
  .lgf{margin-bottom:13px;}
  .lgf label{display:block; font-size:12.5px; font-weight:700; color:#41505F; margin-bottom:6px;}
  .lgin{position:relative; display:flex; align-items:center;}
  .lgw .lgin input[type]{width:100%; padding:13px 48px 13px 46px; border:1.5px solid #DBE1E8; border-radius:12px;
    background:#F9FAFC; font-size:15px; text-align:right; direction:rtl; box-sizing:border-box;}
  .lgw .lgin input[type]:focus{background:#fff; border-color:#1B5FA6; box-shadow:0 0 0 4px rgba(27,95,166,.13); outline:none;}
  .lgw .lgin .ic{position:absolute; right:14px; z-index:2; top:50%; transform:translateY(-50%); color:#94A2B1;
    line-height:1; pointer-events:none; width:20px; display:flex; justify-content:center;}
  .lgw .lgin .eye{position:absolute; left:8px; z-index:2; top:50%; transform:translateY(-50%); background:none;
    border:0; cursor:pointer; color:#5B6A78; padding:6px 8px; border-radius:8px; line-height:1;}
  .lgw .lgin .eye:hover{background:#EEF1F5;}
  .lgrow{display:flex; align-items:center; justify-content:space-between; gap:10px; margin:4px 0 18px; flex-wrap:wrap;}
  .lgrow label{display:flex; align-items:center; gap:7px; font-size:13px; color:#41505F; cursor:pointer;}
  .lgrow label input{width:auto;}
  .lgrow a{font-size:13px; color:#1B5FA6; font-weight:700; cursor:pointer;}
  .lgbtn{width:100%; border:0; border-radius:12px; padding:14px; font-size:15.5px; font-weight:800; color:#fff;
    cursor:pointer; background:linear-gradient(135deg,#0B3B6B,#1B5FA6); box-shadow:0 10px 22px rgba(11,59,107,.32);
    transition:filter .2s ease, transform .12s ease;}
  .lgbtn:hover{filter:brightness(1.07);}
  .lgbtn:active{transform:translateY(1px);}
  .lghint{margin-top:16px; background:#F2F6FA; border:1px solid #DCE6F0; border-radius:11px; padding:10px 13px;
    font-size:12.5px; color:#3C5570; line-height:1.8;}
  .lgerr{display:none; margin-bottom:14px; background:#FAE7E5; border:1px solid #F0C9C6; border-radius:11px;
    padding:10px 13px; font-size:12.5px; font-weight:700; color:#A82820;}
  @media(max-width:420px){
    .lgcard{padding:20px 16px 18px; border-radius:16px;}
    .lgbrand h1{font-size:17px;} .lglogo{width:54px; height:54px;}
    .lgw .lgin input[type]{padding:12px 44px 12px 42px;}
  }
  @media(max-height:640px){.lgw{justify-content:flex-start;}}

  .gate-card.gate-login{background:#EAF3FC !important; border:2px solid #D4AF37 !important;
    box-shadow:0 0 0 3px rgba(212,175,55,.25), 0 0 22px 4px rgba(212,175,55,.45) !important;}
  .gate-card.gate-login h1{color:var(--maroon-800);}
  /* بوابة الدخول: اسم المستخدم وكلمة المرور بحجم 20 */
  .gate-card.gate-login .field label{font-size:20px; font-weight:700; color:var(--maroon-800); margin-bottom:6px;}
  .gate-card.gate-login input{font-size:20px; padding:11px 13px; min-height:48px;}
  .gate-card.gate-login .btn{font-size:20px; padding:11px 18px;}

  /* ===== مربع معلومات المستخدم وحالة المزامنة ===== */
  .userbox{margin:10px 6px 4px; background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.18);
    border-radius:9px; overflow:hidden; font-size:11.5px;}
  .userbox .row{display:flex; justify-content:space-between; gap:8px; padding:5px 9px; color:#fff;
    border-bottom:1px solid rgba(255,255,255,.12);}
  .userbox .row:last-child{border-bottom:none;}
  .userbox .k{opacity:.75;}
  .userbox .v{font-weight:700;}
  .sync-dot{width:9px; height:9px; border-radius:50%; display:inline-block; margin-inline-end:5px; vertical-align:middle;}
  .sync-ok{background:#35C46A; box-shadow:0 0 6px #35C46A;}
  .sync-bad{background:#E5484D; box-shadow:0 0 6px #E5484D;}

  /* ===== انطواء القائمة الجانبية ===== */
  #sidebar{transition:width .18s ease, flex-basis .18s ease;}
  body.nav-collapsed #sidebar{width:64px; flex:0 0 64px;}
  body.nav-collapsed #sidebar .nav-text,
  body.nav-collapsed #sidebar .userbox,
  body.nav-collapsed #sidebar .brand-text{display:none;}
  body.nav-collapsed nav.mainnav button{justify-content:center; padding:10px 0;}
  #navToggle{all:unset; cursor:pointer; display:flex; align-items:center; justify-content:center;
    width:30px; height:30px; border-radius:8px; background:rgba(255,255,255,.12); color:#fff; font-size:15px;}
  #navToggle:hover{background:rgba(255,255,255,.22);}
  nav.mainnav button{position:relative;}
  body.nav-collapsed nav.mainnav button::after{content:attr(data-label); position:absolute; right:calc(100% + 8px);
    top:50%; transform:translateY(-50%); background:#222; color:#fff; padding:4px 9px; border-radius:6px;
    font-size:12px; white-space:nowrap; opacity:0; pointer-events:none; transition:opacity .12s; z-index:50;}
  body.nav-collapsed nav.mainnav button:hover::after{opacity:1;}

  /* ===== عناوين المربعات: منتصف الحافة بشكل مقصوص ===== */
  .card.notched{position:relative; padding-top:26px; overflow:visible;}
  .card.notched > h2.notch-title{position:absolute; top:-14px; left:50%; transform:translateX(-50%);
    margin:0; padding:5px 26px; background:var(--white); color:var(--maroon-800); font-family:var(--font-head);
    font-weight:700; font-size:16px; white-space:nowrap; border:1px solid var(--line);
    border-radius:8px; box-shadow:var(--shadow); display:inline-flex; align-items:center; gap:8px;}

  .no-date-hint .date-hint{display:none !important;}
  /* ===== صفحات طلبات الفعاليات: حجم خط 13 ===== */
  .orders-page, .orders-page input, .orders-page select, .orders-page textarea,
  .orders-page table, .orders-page label{font-size:13px;}
  .orders-page .btn, .orders-page .tab-btn{font-size:12px;}
  .orders-page .form-table thead th{font-size:15px;}
  .orders-page h2, .orders-page h3{font-size:17px;}
  .orders-page .form-table tbody td label{font-size:13px;}
  .orders-page .helper{font-size:11.5px;}

  /* ===== أزرار أيقونية فقط مع تلميح ===== */
  .orders-page .icon-btn.rect{position:relative; font-size:0; padding:0 9px; min-width:34px;}
  .orders-page .icon-btn.rect::first-line{font-size:14px;}
  .orders-page .icon-btn.rect{font-size:14px;}
  .icon-btn[data-tip]{position:relative;}
  .icon-btn[data-tip]::after{content:attr(data-tip); position:absolute; bottom:calc(100% + 6px); right:50%;
    transform:translateX(50%); background:#222; color:#fff; padding:3px 8px; border-radius:6px; font-size:11px;
    white-space:nowrap; opacity:0; pointer-events:none; transition:opacity .12s; z-index:60;}
  .icon-btn[data-tip]:hover::after{opacity:1;}

  /* ===== حدود زرقاء فاتحة وتوهج خفيف لمربعات نموذج الفعالية ===== */
  .glow-card{border:1px solid var(--line) !important;
    box-shadow:0 1px 2px rgba(18,36,43,.05) !important;}
  .glow-card .form-table tbody td{border-color:var(--line);}
  .glow-card input, .glow-card select, .glow-card textarea{border-color:var(--line-strong);}
  .glow-card input:focus, .glow-card select:focus, .glow-card textarea:focus{
    border-color:var(--brand-700); box-shadow:0 0 0 3px rgba(25,168,121,.16);}

  /* ===== توحيد ارتفاع الأدوات في الإداريات اليومية ===== */
  .adm-tools .icon-btn.rect, .adm-tools select, .adm-tools .btn{height:36px; box-sizing:border-box; display:inline-flex; align-items:center;}

  /* ===== تصغير أيقونات الجدول ===== */
  .orders-page table .icon-btn{width:26px; height:26px; font-size:13px; padding:0; line-height:1;}

  /* ══════════ نظام التنقل الأفقي العلوي ══════════ */
  /* #app له أولوية معرّف، لذا نستخدم #app.topnav-layout حتى يُطبَّق display:block فعليًا
     وإلا يبقى المحتوى عنصر flex فيظهر ضيقًا/منزاحًا بدل أخذ عرض الصفحة كاملًا */
  #app.topnav-layout{display:block; width:100%; max-width:100%; min-height:100vh;}
  #app.topnav-layout > .content{display:block; width:100%; max-width:100%; flex:none;}
  #topHeader{position:sticky; top:0; z-index:60; background:var(--maroon-900); color:#fff;
    box-shadow:0 2px 10px rgba(94,11,38,.22);}
  .th-row1{display:flex; align-items:center; gap:14px; padding:8px 14px; border-bottom:1px solid rgba(255,255,255,.14);}
  .th-brand{display:flex; align-items:center; gap:9px; min-width:0;}
  .th-brand #logoSlot img{height:38px; width:auto; display:block;}
  .th-brand .logo-placeholder{font-size:20px;}
  .th-brand .brand-name{font-size:20px; font-weight:700; color:#fff; line-height:1.2; white-space:nowrap;}
  .th-brand .brand-sub{font-size:13px; color:rgba(255,255,255,.72); line-height:1.25;}
  .th-title{margin:0 auto; font-size:20px; font-weight:700; color:#fff; white-space:nowrap;}
  .th-right{display:flex; align-items:center; gap:8px; margin-inline-start:auto;}
  .th-user{font-size:20px; font-weight:700; color:#fff; white-space:nowrap;}
  .th-sync{display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:700;
    background:rgba(255,255,255,.14); border-radius:20px; padding:3px 10px; white-space:nowrap;}
  .th-sync.ok{color:#CFF6DF;} .th-sync.bad{color:#FFD9D9;}
  .th-logout{all:unset; cursor:pointer; width:28px; height:28px; border-radius:7px; display:flex;
    align-items:center; justify-content:center; background:rgba(255,255,255,.14); color:#fff; font-size:14px;}
  .th-logout:hover{background:#fff; color:var(--maroon-900);}

  /* القائمة الرئيسية الأفقية */
  .th-main{display:flex; align-items:stretch; gap:2px; padding:0 10px; overflow-x:auto; -webkit-overflow-scrolling:touch;}
  .th-main::-webkit-scrollbar{height:0;}
  .nv-item{all:unset; cursor:pointer; display:inline-flex; align-items:center; gap:7px; white-space:nowrap;
    padding:9px 14px; font-size:20px; font-weight:700; color:rgba(255,255,255,.85);
    border-radius:9px 9px 0 0; transition:background .12s,color .12s; position:relative;}
  .nv-item:hover{background:rgba(255,255,255,.13); color:#fff;}
  .nv-item.active{background:#fff; color:var(--maroon-900);}
  .nv-ic{font-size:20px; line-height:1;}
  .nv-badge{background:var(--gold); color:#fff; border-radius:20px; padding:0 6px; font-size:10px; font-weight:700;}

  /* الأوراق الفرعية — امتداد للقائمة الرئيسية */
  .th-sub{display:none; align-items:center; gap:4px; padding:6px 12px; background:#fff;
    border-bottom:2px solid var(--maroon-800); overflow-x:auto;}
  .th-sub::-webkit-scrollbar{height:0;}
  .sv-item{all:unset; cursor:pointer; display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
    padding:6px 13px; font-size:20px; font-weight:700; color:var(--maroon-800);
    border:1px solid var(--maroon-100); border-radius:8px; background:var(--maroon-50); transition:.12s;}
  .sv-item:hover{background:var(--maroon-100);}
  .sv-item.active{background:var(--maroon-800); color:#fff; border-color:var(--maroon-800);}
  .sv-ic{font-size:20px; line-height:1;}

  /* المحتوى: عرض كامل بفراغات أقل */
  .topnav-layout .content{max-width:100%; width:100%; padding:12px 14px; margin:0; box-sizing:border-box;}
  .topnav-layout .content > .card,
  .topnav-layout .content > .grid,
  .topnav-layout .content > .tabs{width:100%; max-width:100%; box-sizing:border-box;}
  #orderSubContent, #distSubContent, #qa_sub, #reportContent{display:block; width:100%; max-width:100%;}
  /* إخفاء الأوراق المكررة داخل الصفحات (انتقلت للشريط العلوي) */
  .page-tabs-moved{display:none !important;}

  @media (max-width:860px){
    .th-title{display:none;}
    .th-main{padding:0 6px;}
    .nv-item{padding:8px 10px; font-size:16px;}
    .nv-tx{display:none;}
    #topHeader.mob-open .nv-tx{display:inline;}
    .th-brand .brand-sub{display:none;}
  }

  /* ══ أقسام نموذج الفعالية: العناوين والمدخلات بحجم 18 ══ */
  /* ══ حقول بتسمية مقصوصة داخل حدّ المربع (Notched labels) ══ */
  /* ══ صفحة طلب فعالية فقط: حقول تاريخ متوسطة ومربعات مرنة ══ */
  /* ══ تقويم إتاحة مقدمي الفعاليات ══ */
  .cal-tb{border-collapse:separate; border-spacing:2px; font-size:11px; width:auto; min-width:100%;}
  .cal-tb .cal-nm{position:sticky; right:0; z-index:2; background:#fff; text-align:right;
    min-width:150px; max-width:150px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    font-size:12px; font-weight:700; color:var(--maroon-800); padding:4px 8px;
    border:1px solid var(--line) !important; border-radius:6px;}
  .cal-tb .cal-ct{float:left; background:#F1EFE8; color:#555; border-radius:20px; padding:0 7px; font-size:10px; font-weight:700;}
  .cal-tb .cal-d{background:#F5F3F0 !important; color:#666 !important; width:26px; min-width:26px;
    padding:2px 0 !important; border-radius:5px; text-align:center; line-height:1.05;}
  .cal-tb .cal-d b{display:block; font-size:10px; font-weight:700;}
  .cal-tb .cal-d i{display:block; font-style:normal; font-size:10px; opacity:.75;}
  /* الجمعة والسبت: إجازة مقدمي الفعاليات */
  .cal-tb .cal-d.off{background:var(--cyan-100) !important; color:var(--cyan-700) !important;}
  .cal-c.off{background:var(--cyan-100); color:var(--cyan-700); border:1px solid #9FD3E4;}
  .cal-c{width:24px; min-width:24px; height:24px; padding:0 !important; text-align:center;
    font-size:10px; font-weight:700; border-radius:5px; cursor:default;}
  .cal-c.free{background:var(--brand-100); color:var(--brand-800); border:1px solid var(--brand-300);}
  .cal-c.busy{background:var(--red-100); color:var(--red-700); border:1px solid #FDA29B;}
  .cal-tb tbody tr:hover .cal-c{filter:brightness(.97);}
  /* ══ تضارب داخل تقويم الإتاحة ══ */
  .cal-c.clash{background:#C0334D !important; color:#fff !important; font-weight:800;
    border:1px solid #9E2840; cursor:pointer; animation:clashPulse 1.6s ease-in-out infinite;}
  .cal-c.clash:hover{background:#9E2840 !important;}
  .cal-tb .cal-cl{float:left; margin-inline-end:4px; background:#C0334D; color:#fff;
    border-radius:20px; padding:0 6px; font-size:10px; font-weight:800;}
  .cal-tb tr.cal-row-clash .cal-nm{border-color:#C0334D !important; background:#FFF5F5 !important;}
  .clash-tbl,
  .content .tbl-scroll table.clash-tbl{width:100% !important; min-width:100% !important;
    border-collapse:collapse; font-size:12.5px; table-layout:fixed;}
  .clash-tbl th{background:#FBE7E5; color:#8E2437; font-weight:800; padding:7px 9px;
    border:1px solid #F0C9C6; text-align:right;}
  .clash-tbl td{padding:6px 9px; border:1px solid var(--line); vertical-align:top;}
  .clash-tbl tbody tr:nth-child(even){background:#FCFAF8;}
  /* ══════════════════════════════════════════════════════════════
     مكوّن الأيقونة الموحّد — حاوية واحدة تُعاد في كل النظام
     بدل تنسيق مستقل لكل أيقونة. الدلالة اللونية ثابتة:
     أخضر نجاح · كهرماني تنبيه · أحمر خطر · أزرق معلومة · تركوازي عادي.
     ══════════════════════════════════════════════════════════════ */
  .icn{ width:52px; height:52px; border-radius:16px; flex:none;
    display:inline-flex; align-items:center; justify-content:center;
    background:var(--icn-bg,var(--ds-teal-l)); color:var(--icn-fg,var(--ds-teal));
    transition:transform 220ms ease-out, background-color 220ms ease-out,
               box-shadow 220ms ease-out; }
  .icn .lu{ width:24px; height:24px; }
  .icn-sm{ width:40px; height:40px; border-radius:13px; }
  .icn-sm .lu{ width:20px; height:20px; }
  /* الارتفاع عند المرور على البطاقة الحاضنة أو على الأيقونة نفسها */
  .card:hover > .icn, .kpi:hover .icn, .dcard:hover .icn,
  .stat-card:hover .icn, .att:hover .icn, .icn:hover{
    transform:translateY(-2px) scale(1.06);
    box-shadow:0 8px 20px color-mix(in srgb, var(--icn-fg,var(--ds-teal)) 24%, transparent); }
  .icn:active{ transform:scale(.94); }
  .icn-ok  { --icn-bg:var(--ds-ok-l);   --icn-fg:var(--ds-ok); }
  .icn-warn{ --icn-bg:var(--ds-warn-l); --icn-fg:var(--ds-warn); }
  .icn-dan { --icn-bg:var(--ds-dan-l);  --icn-fg:var(--ds-dan); }
  .icn-info{ --icn-bg:var(--ds-info-l); --icn-fg:var(--ds-info); }
  .icn-gold{ --icn-bg:var(--ds-gold-l); --icn-fg:var(--ds-gold-d); }

  /* البطاقات القائمة ترث السلوك نفسه بلا إعادة كتابة */
  .kpi-ic, .stat-icon, .att-ic{
    transition:transform 220ms ease-out, background-color 220ms ease-out,
               box-shadow 220ms ease-out; }
  .kpi:hover .kpi-ic, .stat-card:hover .stat-icon, .att:hover .att-ic{
    transform:translateY(-2px) scale(1.06); }
  .kpi:hover .kpi-ic{ box-shadow:0 8px 20px color-mix(in srgb, var(--kc,var(--ds-teal)) 26%, transparent); }
  .att:hover .att-ic{ box-shadow:0 8px 18px color-mix(in srgb, var(--ac,var(--ds-warn)) 24%, transparent); }
  .kpi-ic:active, .stat-icon:active, .att-ic:active{ transform:scale(.94); }

  /* أيقونات القائمة الجانبية: محايدة ← لون الهوية عند المرور ← أوضح عند النشاط */
  #sideNav .sn-item .lu{ width:20px; height:20px; color:#9DB2C7;
    transition:color 200ms ease, transform 200ms ease; }
  #sideNav .sn-item:hover .lu{ color:var(--ds-teal-2); }
  #sideNav .sn-item.active .lu{ color:var(--ds-gold); transform:scale(1.04); }

  /* تلميح عربي لأي أيقونة إجراء */
  [data-tip]{ position:relative; }
  .row-acts button[data-tip]::after, .icn[data-tip]::after{
    content:attr(data-tip); position:absolute; bottom:calc(100% + 7px); right:50%;
    transform:translateX(50%); background:var(--ds-navy); color:#fff;
    font-size:11px; font-weight:600; white-space:nowrap; padding:4px 9px;
    border-radius:7px; opacity:0; pointer-events:none; z-index:50;
    transition:opacity .18s ease; box-shadow:var(--ds-sh-2); }
  .row-acts button[data-tip]:hover::after, .row-acts button[data-tip]:focus-visible::after,
  .icn[data-tip]:hover::after{ opacity:1; }

  @media (prefers-reduced-motion: reduce){
    .icn, .kpi-ic, .stat-icon, .att-ic{ transition:none !important; }
    .card:hover > .icn, .kpi:hover .kpi-ic, .att:hover .att-ic,
    .stat-card:hover .stat-icon, .icn:hover{ transform:none !important; }
  }

  /* ══ القرار الجماعي في مركز التشغيل ══ */
  .ops-bulk{display:flex; align-items:center; gap:9px; flex-wrap:wrap;
    background:var(--ds-bg); border:1px solid var(--ds-line); border-radius:10px;
    padding:8px 11px; margin-bottom:11px;}
  .ops-all{display:inline-flex; align-items:center; gap:7px; cursor:pointer;
    font-size:12.5px; font-weight:700; color:var(--ds-ink); margin:0;}
  .ops-all input{width:15px !important; height:15px !important; min-height:0 !important;
    min-width:0 !important; margin:0 !important; flex:none; accent-color:var(--ds-teal); cursor:pointer;}
  .ops-sel{font-size:12px; color:var(--ds-teal-d); background:var(--ds-teal-l);
    border-radius:20px; padding:2px 9px; font-weight:700;}
  .ops-bulk-acts{display:flex; align-items:center; gap:6px; flex-wrap:wrap;
    margin-inline-start:auto;}
  .ops-bulk-acts select{min-height:32px !important; height:32px; font-size:12px;
    padding:0 9px; width:auto !important; min-width:150px; border-radius:8px;}
  .ops-bulk-acts .btn{min-height:32px; font-size:12px;}
  /* مربع الاختيار داخل البطاقة */
  .ops-card{position:relative;}
  .ops-pick{position:absolute; inset-inline-start:9px; top:9px; z-index:2; margin:0;
    display:flex; align-items:center; justify-content:center;}
  .ops-pick input{width:16px !important; height:16px !important; min-height:0 !important;
    min-width:0 !important; margin:0 !important; accent-color:var(--ds-teal); cursor:pointer;}
  .ops-card.can-pick .ops-open{padding-inline-start:34px;}
  .ops-card.picked{border-color:var(--ds-teal) !important;
    box-shadow:0 0 0 2px var(--ds-teal-l), var(--ds-sh-2) !important;}

  /* ══ توحيد الحركة مع لوحة التحكم: المدّة والانحناء نفسهما ══ */
  .fade-up{ animation-duration:var(--ds-dur) !important;
    animation-timing-function:var(--ds-ease) !important; }
  .delay-1{animation-delay:45ms !important;}
  .delay-2{animation-delay:90ms !important;}
  .delay-3{animation-delay:135ms !important;}
  .delay-4{animation-delay:180ms !important;}
  .card-hover{ transition:transform var(--ds-dur) var(--ds-ease),
    box-shadow var(--ds-dur) var(--ds-ease), background-color .2s ease !important; }
  .card-hover:hover{ transform:translateY(-3px); box-shadow:var(--ds-sh-3) !important; }
  .ops-card{ transition:transform var(--ds-dur) var(--ds-ease),
    box-shadow var(--ds-dur) var(--ds-ease), border-color .2s ease !important; }
  .ops-card:hover{ box-shadow:var(--ds-sh-2) !important; border-color:var(--ds-teal) !important; }
  .ops-col{ box-shadow:var(--ds-sh-1); border-color:var(--ds-line) !important;
    border-radius:var(--ds-r-lg) !important; }
  .ops-col-title{ color:var(--ds-ink) !important; font-weight:800 !important; }
  .ops-count{ background:var(--ds-teal-l) !important; color:var(--ds-teal-d) !important; }
  .stat-card{ border-radius:var(--ds-r-lg) !important; box-shadow:var(--ds-sh-1); }
  @media (prefers-reduced-motion: reduce){
    .fade-up{ animation:none !important; }
    .card-hover:hover, .ops-card:hover{ transform:none !important; }
  }

  /* ══ شريط تعذّر الاتصال بقاعدة البيانات ══ */
  .db-down{display:flex; align-items:center; gap:11px; flex-wrap:wrap;
    background:#FBE7E5; border:2px solid #C0334D; border-radius:12px;
    padding:11px 14px; margin-bottom:14px; color:#8E2437;}
  .db-down .lu{flex:none;}
  .db-down-tx{display:flex; flex-direction:column; gap:2px; min-width:200px;}
  .db-down-tx b{font-size:13.5px; font-weight:800;}
  .db-down-tx i{font-style:normal; font-size:12px; opacity:.9;}
  .db-down-btns{margin-inline-start:auto; display:inline-flex; gap:7px; flex-wrap:wrap;}
  @media print{ .db-down{display:none !important;} }

  /* ══ لوحة اختيار مقدّمي المبادرة في جدول المقدّمين ══ */
  .sc-trbtn{display:inline-flex; align-items:center; gap:7px; min-height:34px;
    padding:0 11px; border:1px solid var(--line); border-radius:9px; background:#fff;
    cursor:pointer; font-family:inherit; font-size:12.5px; color:var(--ink); max-width:260px;}
  .sc-trbtn:hover{border-color:var(--gold);}
  .sc-trbtn span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .sc-trbtn b{margin-inline-start:auto; background:var(--brand-100,#E8F1EC); color:var(--brand-800,#1F6B4C);
    border-radius:20px; padding:1px 8px; font-size:11.5px;}
  /* ⚠ مربعات الاختيار داخل اللوحة كانت ترث تنسيق حقول النموذج
     (عرض كامل وارتفاع 42px) فيصير كل سطر 85px ولا تُرى القائمة.
     نستخدم المعرّف # لنتجاوز تلك القواعد بثقة. */
  .sc-trwrap{position:relative;}
  #sc_trPanel{position:fixed; z-index:9999;
    width:270px; max-height:min(300px, 60vh); overflow-y:auto; overflow-x:hidden;
    background:#fff; border:1px solid var(--line); border-radius:10px;
    box-shadow:0 10px 26px rgba(0,0,0,.16); padding:6px;}
  #sc_trPanel label{display:flex !important; align-items:center; gap:7px;
    margin:0 !important; padding:5px 8px; border-radius:7px; cursor:pointer;
    font-size:12.5px; font-weight:400; line-height:1.3; min-height:0 !important;
    width:auto !important; color:var(--ink);}
  #sc_trPanel input[type=checkbox]{
    width:15px !important; min-width:15px !important; max-width:15px !important;
    height:15px !important; min-height:15px !important; flex:none !important;
    margin:0 !important; padding:0 !important; accent-color:var(--brand-700,#1F6B4C);
    border-radius:3px !important; box-shadow:none !important; cursor:pointer;}
  #sc_trPanel .sc-trall{background:#F4F1EC; font-weight:800 !important; margin-bottom:5px !important;}
  #sc_trPanel .sc-trlist{display:flex; flex-direction:column; gap:2px;}
  #sc_trPanel .sc-trrow:hover{background:#FAF8F5;}
  #sc_trPanel .sc-trrow.on{background:#EAF7F1; box-shadow:inset 0 0 0 1px #A9DCC6;}
  #sc_trPanel .sc-trnm{flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  #sc_trPanel .sc-trph{font-size:10.5px; color:var(--muted); direction:ltr; flex:none;}

  /* ══ خلية فترة التاريخ في جداول الشاشة — مطابقة لنمط الطباعة ══ */
  .prd1{display:block; text-align:center; direction:ltr; font-size:12.5px;}
  .prd2{display:inline-flex; flex-direction:column; gap:2px; align-items:center;}
  .prd2 .p2{display:flex; flex-direction:row; align-items:baseline; gap:5px;}
  .prd2 .p2 b{font-size:10px; font-weight:700; color:var(--muted,#8A7A6A);}
  .prd2 .p2 i{font-style:normal; font-size:12.5px; direction:ltr; white-space:nowrap;}

  /* ══ شريط تنبيه التضارب أعلى صفحة طلب فعالية ══ */
  #ordClashBar{margin-bottom:10px;}
  .ord-clash{border:2px solid #C0334D; border-radius:12px; overflow:hidden;
    background:#FFF7F7; box-shadow:0 2px 10px rgba(192,51,77,.13);}
  .ord-clash-h{display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    background:#C0334D; color:#fff; padding:8px 13px; font-size:13.5px;}
  .ord-clash-h b{font-weight:800;}
  .ord-clash-h i{margin-inline-start:auto; font-style:normal; font-size:12px; opacity:.92;}
  .ord-clash-b{display:flex; flex-direction:column; gap:6px; padding:9px 11px;}
  .ord-clash-ev{all:unset; cursor:pointer; display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    border:1px solid #F0C9C6; border-radius:9px; background:#fff; padding:7px 11px;
    font-size:12.5px; color:#8E2437; transition:background .18s, border-color .18s;}
  .ord-clash-ev:hover{background:#FBE7E5; border-color:#C0334D;}
  .ord-clash-ev b{font-weight:800; white-space:nowrap;}
  .ord-clash-ev .oc-when{background:#FBE7E5; border-radius:6px; padding:1px 8px;
    font-weight:700; white-space:nowrap; font-size:12px;}
  .ord-clash-ev .oc-what{color:#5B4A4E; font-size:12px;}
  .ord-clash-ev.soft{border-color:#E8D46A; color:#6B5300; background:#FFFDF2;}
  .ord-clash-ev.soft:hover{background:#FFF7CC; border-color:#D9BE33;}
  .ord-clash-ev.soft .oc-when{background:#FFF1A8;}
  .ord-clash-f{padding:6px 13px 9px; font-size:11.5px; color:#8E6B70;}
  .ord-ok{display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    background:#EAF7F1; border:1px solid #A9DCC6; border-radius:10px;
    padding:7px 12px; font-size:12.5px; color:#1F6B4C;}
  .ord-ok .lu{flex:none;}
  @media print{ #ordClashBar{display:none !important;} }
  .ok-bar{display:flex; align-items:center; gap:9px; flex-wrap:wrap;
    background:#EAF7F1; border:1px solid #A9DCC6; border-radius:10px;
    padding:9px 12px; margin-bottom:11px; font-size:12.5px; color:#1F6B4C;}
  .ok-bar .lu{flex:none;}

  /* ══════════ قائمة أيقونات تتوسع عند المرور ══════════ */
  #sideNav{background:var(--side) !important;
    transition:width .28s cubic-bezier(.22,1,.36,1), flex-basis .28s cubic-bezier(.22,1,.36,1);}
  #sideNav .sn-brand, #sideNav .sn-user{border-bottom-color:#33373E !important;}
  #sideNav:hover, body.nav-open #sideNav{width:270px; flex-basis:270px;}
  #sideNav:hover .nav-text, #sideNav:hover .sn-name, #sideNav:hover .sn-sub,
  #sideNav:hover .sn-uname, #sideNav:hover .sn-role{opacity:1; max-width:180px;}
  #sideNav:hover .sn-item::after, #sideNav:hover .sn-logout::after{display:none;}
  .sn-item{border-radius:9px !important; margin:0 10px !important; padding:10px 0 !important;
    padding-inline-start:16px !important; border:none !important; overflow:hidden;}
  .sn-item::before{content:''; position:absolute; inset:0; border-radius:10px;
    background:#2D5D57; opacity:0; transition:opacity .22s ease; z-index:-1;}
  .sn-item.active{background:transparent !important; box-shadow:none !important;
    margin-inline-end:10px !important; padding-inline-end:0 !important; color:#fff !important;}
  .sn-item.active::before{opacity:1;}
  .sn-item.active .lu{color:#DD964B;}
  .sn-item:hover:not(.active){background:var(--side2) !important;}
  .sn-ic{position:relative; z-index:1;}
  .nav-text{position:relative; z-index:1;}
  .sn-brand, .sn-user{border-bottom-color:rgba(255,255,255,.09);}
  .sn-brand .logo-placeholder{color:#DD964B;}
  .sn-role{color:#DD964B !important;}
  /* الخروج بلمسة حمراء واضحة */
  .sn-logout{border-radius:12px !important; margin:8px 10px 16px !important; border-top:none !important;
    padding-inline-start:16px !important; transition:background .28s ease, color .28s ease;}
  .sn-logout:hover{background:rgba(168,40,32,.22) !important; color:#FFD9D6 !important;}
  .sn-logout:hover .lu{color:#F09189;}

  /* ══════════ بطاقات إحصائية متدرجة ══════════ */
  .stat-card{position:relative; overflow:hidden; border:none !important;
    background:var(--card-background); box-shadow:0 2px 8px rgba(23,26,58,.05), 0 12px 28px rgba(23,26,58,.05) !important;}
  .stat-card::before{content:''; position:absolute; inset-block-start:0; inset-inline:0; height:4px;}
  .stat-card:nth-child(1)::before{background:var(--gold);}
  .stat-card:nth-child(2)::before{background:var(--info-c);}
  .stat-card:nth-child(3)::before{background:var(--ok);}
  .stat-card:nth-child(4)::before{background:var(--warn);}
  .stat-icon{border-radius:12px !important; width:40px !important; height:40px !important;}
  .stat-icon-teal{background:var(--gold-l) !important; color:var(--gold-d) !important;}
  .stat-icon-amber{background:var(--info-l) !important; color:var(--info-c) !important;}
  .stat-icon-blue{background:var(--ok-l) !important; color:var(--ok) !important;}
  .stat-icon-green{background:var(--warn-l) !important; color:var(--warn) !important;}
  .stat-value{font-size:28px !important; color:var(--ink) !important; font-weight:800;}
  .stat-card:hover{transform:translateY(-4px); box-shadow:0 6px 16px rgba(23,26,58,.09), 0 20px 40px rgba(23,26,58,.10) !important;}

  /* الأزرار والترويسة */
  .btn-primary{background:var(--gold) !important; color:#231C08 !important; border:none; box-shadow:0 3px 10px rgba(184,145,47,.28);}
  .btn-primary:hover{background:var(--gold-d) !important; color:#fff !important; box-shadow:0 6px 16px rgba(184,145,47,.34);}
  .welcome-card{background:#1A333D !important;}
  .ops-hero{background:#1A333D !important;}
  .drawer-head{background:var(--side) !important;}
  .form-table thead th{background:var(--side) !important; color:#fff !important;}
  .sv-item.active{background:var(--gold) !important; color:#231C08 !important; border-color:transparent !important;}
  .tab-btn.active{background:var(--gold) !important; color:#231C08 !important; box-shadow:0 3px 10px rgba(184,145,47,.26) !important;}

  /* ══════════ الوضع الليلي ══════════ */
  body.dark{
    --page-background:#16181C; --card-background:#1E2126; --card-hover:#25292F;
    --main-text:#E8EAEE; --heading-text:#F4F5F7; --muted-text:#A3A9B2; --soft-text:#8A919B;
    --border-c:#31353C; --border-light:#2A2E34;
    --side:#16181C; --side2:#25292F;
    --brass-100:#3A3324; --green-bg:#16302A; --maroon-bg:#33201F; --info-bg:#1C2A36;
    --light-teal:#3A3324; --copper-light:#3A3324; --gold-l:#3A3324;
    --success-bg:#16302A; --warning-bg:#332B14; --danger-bg:#33201F; --ok-l:#16302A; --warn-l:#332B14; --dan-l:#33201F; --info-l:#1C2A36;
    --brand-100:#3A3324; --brand-50:#2A2820;
    --maroon-100:#3A3324; --maroon-50:#2A2820;
    --ink:#E8EAEE; --muted:#A3A9B2; --line:#31353C; --line-strong:#3D424A; --surface:#1E2126; --line2:#2A2E34;
    --white:#1E2126; --page:#16181C;
    --sand-100:#1B2F40; --sand-50:#152634;
    background:var(--page-background); color:var(--main-text);
  }
  body.dark .content .card, body.dark .panel, body.dark .stat-card, body.dark .ops-col{
    background:var(--card-background); border-color:var(--border-c);}
  body.dark #topHeader{background:rgba(30,33,38,.90); border-bottom-color:var(--border-c);}
  body.dark thead th{background:#25292F !important; color:var(--muted-text) !important;}
  body.dark tbody td{color:var(--main-text);}
  body.dark tbody tr:hover{background:#25292F;}
  body.dark input, body.dark select, body.dark textarea{
    background:#25292F; color:var(--main-text); border-color:var(--border-c);}
  body.dark .insight-strip{background:#1E2126; border-color:var(--border-c);}
  body.dark .date-tile{background:#25292F; color:var(--gold);}
  body.dark .activity-row:hover{background:#25292F;}
  body.dark .ops-card{background:#25292F; border-color:var(--border-c);}
  body.dark .ops-next{background:#2A2E34; border-top-color:var(--border-c);}
  #themeToggle{all:unset; cursor:pointer; display:inline-flex; align-items:center; justify-content:center;
    width:34px; height:34px; border-radius:9px; background:var(--navy-50); color:var(--navy-700);
    transition:background .25s ease, transform .25s ease;}
  #themeToggle:hover{background:var(--navy-100); transform:translateY(-2px);}
  body.dark #themeToggle{background:#25292F; color:var(--gold);}

  /* ══════════ الحركات ══════════ */
  @keyframes fade-up{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);}}
  .fade-up{animation:fade-up .28s cubic-bezier(.22,1,.36,1) both;}
  @keyframes modal-enter{from{opacity:0; transform:translateY(12px) scale(.98);} to{opacity:1; transform:none;}}
  .modal-enter{animation:modal-enter .26s cubic-bezier(.22,1,.36,1) both;}
  @keyframes drawer-in{from{transform:translateY(-100%); opacity:.6;} to{transform:translateY(0); opacity:1;}}

  /* ══════════ لوح طلب الفعالية المنزلق من اليسار ══════════ */
  .drawer-scrim{position:fixed; inset:0; z-index:80; background:rgba(12,30,51,.42);
    backdrop-filter:blur(3px); animation:fade-in .25s ease-out both;}
  .drawer-panel{position:fixed; inset-inline:0; inset-block-start:0; z-index:81;
    height:min(88vh, 100%); background:var(--page-background); box-shadow:var(--shadow-lg);
    display:flex; flex-direction:column; animation:drawer-in .32s cubic-bezier(.22,1,.36,1) both;
    border-block-end:1px solid var(--border-c); border-radius:0 0 16px 16px;
    /* خط أصغر ليتسع التنسيق */
    font-size:12.5px;}
  .drawer-panel .form-table tbody td label{font-size:11px !important;}
  .drawer-panel input, .drawer-panel select, .drawer-panel textarea{font-size:12.5px !important; min-height:36px;}
  .drawer-panel .form-table thead th{font-size:13px !important;}
  .drawer-panel .btn{font-size:11.5px;}
  .drawer-head{display:flex; align-items:center; gap:12px; padding:10px 20px; background:var(--navy-900);
    color:#fff; box-shadow:0 2px 10px rgba(12,30,51,.18);}
  .drawer-head h2{margin:0; font-family:var(--font-head); font-size:16px; font-weight:700; color:#fff;
    background:transparent; padding:0; border:none; flex:1;}
  .drawer-head .dh-sub{font-size:11.5px; color:rgba(255,255,255,.62); margin-top:2px;}
  .drawer-close{all:unset; cursor:pointer; display:inline-flex; align-items:center; justify-content:center;
    width:34px; height:34px; border-radius:9px; background:rgba(255,255,255,.12); color:#fff;
    transition:background .25s ease, transform .25s ease;}
  .drawer-close:hover{background:var(--brass); transform:translateY(-2px);}
  .drawer-body{flex:1; overflow-y:auto; padding:12px 12px 24px;}
  @media (max-width:760px){ .drawer-panel{height:100vh; border-radius:0;} .drawer-body{padding:14px;} }

  /* ══════════ مركز التشغيل ══════════ */
  .ops-hero{background:var(--deep-teal); color:#fff; border-radius:14px; padding:24px 26px; margin-bottom:18px;
    box-shadow:var(--shadow-md); position:relative; overflow:hidden;}
  .ops-hero::after{content:''; position:absolute; inset-block:-50%; inset-inline-start:-40px; width:200px;
    border-radius:50%; border:1px solid rgba(228,170,99,.28); transform:rotate(20deg) scaleX(.5);}
  .ops-hero h2{font-family:var(--font-head); font-size:24px; font-weight:600; color:#F1EEE5; margin:0 0 6px;
    background:transparent; padding:0; border:none;}
  .ops-hero-sub{font-size:13.5px; color:#B2C9C0; margin:0;}
  .ops-hero-hint{font-size:12px; color:#E4AA63; margin:8px 0 0; font-weight:600;}

  .ops-board{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; align-items:start;}
  .ops-col{background:var(--card-background); border:1px solid var(--border-c); border-radius:13px; padding:16px;
    box-shadow:var(--shadow-sm);}
  .ops-col-head{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .ops-col-title{font-family:var(--font-head); font-size:15px; font-weight:600; color:var(--heading-text);}
  .ops-count{background:#E2F0EB; color:#327B74; border-radius:999px; padding:2px 10px; font-size:11px; font-weight:700;}
  .ops-col-hint{font-size:11px; color:var(--muted-text); margin:4px 0 12px;}
  .ops-col-body{display:flex; flex-direction:column; gap:9px;}

  .ops-card{border:1px solid var(--border-light); border-radius:11px; background:#fff; overflow:hidden;
    transition:transform .25s ease, box-shadow .25s ease, border-color .25s ease;}
  .ops-card:hover{transform:translateY(-3px); box-shadow:var(--shadow-sm); border-color:#D8D2C4;}
  .ops-open{all:unset; cursor:pointer; display:flex; flex-direction:column; width:100%; box-sizing:border-box;
    padding:12px 13px; text-align:right;}
  .ops-title{font-size:13px; font-weight:600; color:#27494A; line-height:1.5;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .ops-meta{font-size:11px; color:#8A9690; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .ops-next{all:unset; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px;
    width:100%; box-sizing:border-box; padding:9px; border-top:1px solid var(--border-light);
    background:#F4F1E9; color:#327B74; font-size:11.5px; font-weight:600;
    transition:background .2s ease, color .2s ease;}
  .ops-next:hover{background:#E2F0EB; color:#286964;}
  .ops-next .lu{transition:transform .2s ease;}
  .ops-next:hover .lu{transform:translateX(-3px);}
  .ops-chip{all:unset; cursor:pointer; border:1px solid #E5D6C4; border-radius:999px; background:#fff;
    padding:7px 14px; font-size:12px; color:#A96936; transition:background .2s ease, transform .2s ease;}
  .ops-chip:hover{background:#FBEFDD; transform:translateY(-1px);}
  @media (max-width:1100px){ .ops-board{grid-template-columns:1fr;} }

  /* ══════════ لوحة المتابعة — مدار ══════════ */
  .welcome-motif{position:absolute; left:7%; top:25px; height:180px; width:180px; opacity:.75; pointer-events:none;}
  .welcome-motif span{position:absolute; display:block; border:1px solid rgba(228,170,99,.55); border-radius:50%;}
  .welcome-motif span:nth-child(1){inset:35px 0; transform:rotate(-20deg);}
  .welcome-motif span:nth-child(2){inset:0 35px; transform:rotate(-20deg);}
  .welcome-motif span:nth-child(3){left:83px; top:83px; width:13px; height:13px; border:none;
    background:#E4AA63; box-shadow:0 0 0 8px rgba(228,170,99,.12);}
  .welcome-motif span:nth-child(4){left:22px; top:48px; width:5px; height:5px; border:none; background:#93C3AD;}

  .stat-card,.panel{border:1px solid var(--line); border-radius:var(--r); background:var(--card-background); box-shadow:var(--shadow-sm);}
  .stat-card{padding:18px;}
  .panel{padding:23px;}
  .card-hover{transition:transform .25s ease, box-shadow .25s ease, background-color .25s ease;}
  .card-hover:hover{transform:translateY(-3px); box-shadow:var(--shadow-md); background:var(--card-hover);}
  .stat-icon{display:grid; width:35px; height:35px; place-items:center; border-radius:9px;}
  .stat-icon-teal{background:#E2F0EB; color:#327B74;}
  .stat-icon-amber{background:#F8ECD9; color:#BD7A3D;}
  .stat-icon-blue{background:#E5EDF0; color:#557988;}
  .stat-icon-green{background:#E5F0E5; color:#57836F;}
  .stat-label{margin-top:20px; font-size:12px; line-height:1.6; color:#798681;}
  .stat-value{font-family:var(--font-head); font-size:27px; font-weight:600; color:#214445; line-height:1.1;}
  .stat-note{font-size:10px; color:#568178; margin-bottom:3px;}

  .panel-heading{display:flex; align-items:flex-start; justify-content:space-between; gap:12px;}
  .section-eyebrow{color:#4C8178; font-size:10px; font-weight:700; letter-spacing:.06em;}
  .panel-title{margin-top:4px; color:var(--heading-text); font-family:var(--font-head); font-size:17px; font-weight:600;}
  .text-link{all:unset; cursor:pointer; display:inline-flex; align-items:center; gap:5px; color:#327B74; font-size:12px; font-weight:600;}
  .text-link:hover{color:#286964;}
  .text-link .lu{transition:transform .2s ease;}
  .text-link:hover .lu{transform:translateX(-3px);}

  .activity-row{all:unset; cursor:pointer; display:flex; width:100%; box-sizing:border-box; align-items:center;
    gap:12px; border-radius:9px; padding:11px 7px; text-align:right; transition:background .2s ease;}
  .activity-row:hover{background:#F4F1E9;}
  .request-mark{display:grid; width:34px; height:34px; flex:0 0 auto; place-items:center; border-radius:9px;}
  .mark-teal{background:#E0EFEB; color:#307A73;}
  .mark-amber{background:#F7EBD8; color:#BE7C3F;}
  .mark-slate{background:#E7EDEF; color:#5B7983;}
  .ar-title{display:block; font-size:13.5px; font-weight:600; color:#27494A; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .activity-row:hover .ar-title{color:#327B74;}
  .ar-sub{display:block; margin-top:3px; font-size:11px; color:#8A9690; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .ar-chev{color:#B2B9B3; transition:transform .2s ease, color .2s ease; flex:none;}
  .activity-row:hover .ar-chev{transform:translateX(-4px); color:#327B74;}

  .status-badge{display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:5px 9px; font-size:10px; white-space:nowrap;}
  .status-badge::before{content:''; width:6px; height:6px; border-radius:50%; background:currentColor;}
  .status-new{background:#FBEFDD; color:#A96936;}
  .status-review{background:#E1F0EC; color:#31756E;}
  .status-approved{background:#E5F0E5; color:#527A67;}
  .status-late{background:#F8E6E3; color:#A65F57;}

  .calendar-row{position:relative; display:flex; align-items:center; gap:12px;}
  .date-tile{display:flex; width:48px; height:49px; flex:0 0 auto; flex-direction:column; align-items:center;
    justify-content:center; border-radius:9px; background:#F1EEE6; color:#3C6C68;}
  .date-tile strong{font-family:var(--font-head); font-size:16px; line-height:1.1;}
  .date-tile span{color:#8A9690; font-size:9px;}
  .calendar-line{align-self:stretch; width:3px; border-radius:4px; background:#D6E7DF;}
  .line-1{background:#EAD4AE;} .line-2{background:#CEDEE7;}

  .insight-strip{display:flex; align-items:center; gap:14px; border:1px solid #DDDCCF; border-radius:12px;
    background:#F1EEE5; padding:16px 18px;}
  .insight-icon{display:grid; width:40px; height:40px; flex:0 0 auto; place-items:center; border-radius:10px;
    background:#DFECE5; color:#327B74;}
  .secondary-button{all:unset; cursor:pointer; display:inline-flex; align-items:center; justify-content:center;
    gap:8px; border:1px solid #DCDED5; border-radius:8px; background:#FBFAF7; color:#32736E;
    padding:10px 15px; font-size:12px; font-weight:600; transition:transform .2s ease, background .2s ease;}
  .secondary-button:hover{background:#E9F1EC; transform:translateY(-1px);}
  .delay-1{animation-delay:70ms;} .delay-2{animation-delay:140ms;}
  .delay-3{animation-delay:210ms;} .delay-4{animation-delay:280ms;}

  /* ══════════ شعار مدار — مداران متقاطعان ونقطة نحاسية (CSS فقط) ══════════ */
  .madar-logo{position:relative; width:var(--lg-size,40px); height:var(--lg-size,40px); flex:none; display:inline-block;}
  .madar-logo i{position:absolute; inset:0; border-radius:50%; border:2px solid transparent;}
  .madar-logo i:nth-child(1){border-color:var(--copper); transform:rotate(-28deg) scaleX(.52);}
  .madar-logo i:nth-child(2){border-color:#85B8AA;  transform:rotate(32deg)  scaleX(.52);}
  .madar-logo b{position:absolute; top:50%; left:50%; width:22%; height:22%; margin:-11% 0 0 -11%;
    border-radius:50%; background:var(--copper); box-shadow:0 0 0 3px rgba(228,170,99,.22);}

  /* ══════════ البطاقة الترحيبية ══════════ */
  .welcome-card{background:var(--hero-teal); color:#fff; border-radius:14px; padding:26px 28px;
    margin-bottom:18px; box-shadow:var(--shadow-md); position:relative; overflow:hidden;}
  .welcome-card::after{content:''; position:absolute; inset-block:-40%; inset-inline-start:-60px;
    width:230px; border-radius:50%; border:2px solid rgba(228,170,99,.20); transform:rotate(24deg) scaleX(.5);}
  .welcome-card h2{font-family:var(--font-head); font-size:28px; font-weight:700; color:#fff; margin:0 0 6px;
    background:transparent; padding:0; border:none;}
  .welcome-card .wc-sub{font-size:14px; color:rgba(255,255,255,.86); margin-bottom:4px;}
  .welcome-card .wc-hint{font-size:12.5px; color:rgba(255,255,255,.66);}
  .welcome-card .wc-btn{all:unset; cursor:pointer; display:inline-flex; align-items:center; gap:8px;
    margin-top:16px; padding:10px 18px; border-radius:8px; background:var(--copper); color:#3C2708;
    font-size:12px; font-weight:600; transition:transform .2s, background-color .2s, box-shadow .2s;}
  .welcome-card .wc-btn:hover{transform:translateY(-2px); background:#EFBB78; box-shadow:0 8px 20px rgba(228,170,99,.28);}

  /* ══════════ أشكال وظلال مدار ══════════ */
  .content .card{background:var(--surface,#fff); border:1px solid var(--line); border-radius:var(--r);
    box-shadow:0 1px 2px rgba(20,25,35,.06),0 6px 18px rgba(20,25,35,.05);}
  .content .card:hover{border-color:#D8D2C4; box-shadow:var(--shadow-md);}
  .btn, .icon-btn, .lg-btn{border-radius:8px;}
  input,select,textarea{border-radius:8px;}
  .badge{border-radius:9999px;}
  .btn-primary{background:var(--primary-teal); color:#fff;}
  .btn-primary:hover{background:var(--primary-teal-dark);}
  input:focus,select:focus,textarea:focus{border-color:var(--primary-teal);
    box-shadow:0 0 0 3px rgba(50,123,116,.15);}

  /* حركات مدار */
  @keyframes rise-in{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
  @keyframes fade-in{from{opacity:0;} to{opacity:1;}}
  .animate-rise-in{animation:rise-in .45s cubic-bezier(.22,1,.36,1) both;}
  .animate-fade-in{animation:fade-in .3s ease-out both;}

  /* ══════════════════════════════════════════════════════════════
     نظام الحركة — يطابق مواصفات framer-motion المطلوبة
     (منفَّذ بـCSS لأن النظام ملف واحد بلا React أو أدوات بناء)
     ══════════════════════════════════════════════════════════════ */
  :root{
    --ease-standard:cubic-bezier(0.22, 1, 0.36, 1);
    --dur-fast:250ms; --dur-normal:280ms; --dur-page:300ms;
  }
  /* أيقونات Lucide */
  .lu{flex:none; vertical-align:-2px;}
  .sn-ic .lu{width:18px; height:18px;}
  .btn .lu, .icon-btn .lu{width:17px; height:17px;}
  .stat-box .lu, .kpi .lu{width:14px; height:14px;}
  /* اللون فقط يتغيّر في الحالة النشطة — الشكل ثابت */
  .sn-item .lu{color:rgba(255,255,255,.55); transition:color var(--dur-normal) var(--ease-standard);}
  .sn-item:hover .lu{color:#fff;}
  .sn-item.active .lu{color:var(--brand-300);}

  /* انتقال الصفحة: شفافية + إزاحة رأسية + ضبابية خفيفة */
  .sidenav-layout .content{animation:pageEnter var(--dur-page) var(--ease-standard) both;}
  @keyframes pageEnter{
    from{opacity:0; transform:translateY(8px); filter:blur(3px);}
    to{opacity:1; transform:none; filter:blur(0);}
  }
  /* صفحة طلب الفعالية: تلاشٍ هادئ بلا حركة نزول */
  body.page-neworder .content{animation:fadeOnly .22s ease-out both;}
  @keyframes fadeOnly{from{opacity:0;} to{opacity:1;}}
  /* ظهور متدرّج للبطاقات والقوائم */
  .content > .card, .content > .grid > .card, .stat-grid > *, .sn-list > .sn-item{
    animation:itemEnter var(--dur-page) var(--ease-standard) both;}
  .content > .card:nth-child(1), .stat-grid > *:nth-child(1), .sn-list > .sn-item:nth-child(1){animation-delay:70ms;}
  .content > .card:nth-child(2), .stat-grid > *:nth-child(2), .sn-list > .sn-item:nth-child(2){animation-delay:140ms;}
  .content > .card:nth-child(3), .stat-grid > *:nth-child(3), .sn-list > .sn-item:nth-child(3){animation-delay:210ms;}
  .content > .card:nth-child(4), .stat-grid > *:nth-child(4), .sn-list > .sn-item:nth-child(4){animation-delay:280ms;}
  .content > .card:nth-child(5), .stat-grid > *:nth-child(5), .sn-list > .sn-item:nth-child(5){animation-delay:280ms;}
  .content > .card:nth-child(n+6), .stat-grid > *:nth-child(n+6), .sn-list > .sn-item:nth-child(n+6){animation-delay:280ms;}
  @keyframes itemEnter{
    from{opacity:0; transform:translateY(6px);}
    to{opacity:1; transform:none;}
  }

  /* الأزرار: ترتفع 1px عند المرور وتعود عند الضغط */
  .btn, .icon-btn, .tab-btn, .sv-item, .lg-btn{
    transition:background var(--dur-fast) var(--ease-standard),
               border-color var(--dur-fast) var(--ease-standard),
               color var(--dur-fast) var(--ease-standard),
               transform var(--dur-fast) var(--ease-standard),
               box-shadow var(--dur-fast) var(--ease-standard);}
  .btn:hover, .icon-btn:hover, .tab-btn:hover, .sv-item:hover, .lg-btn:hover{transform:translateY(-2px);}
  .btn:active, .icon-btn:active, .tab-btn:active, .sv-item:active, .lg-btn:active{transform:translateY(0);}
  .btn:disabled, .icon-btn:disabled{transform:none; opacity:.55;}

  /* البطاقات: ترتفع 3px عند المرور */
  .content .card, .stat-box{
    transition:border-color var(--dur-normal) var(--ease-standard),
               box-shadow var(--dur-normal) var(--ease-standard),
               transform var(--dur-normal) var(--ease-standard);}
  .content .card:hover, .stat-box:hover{transform:translateY(-3px);}

  /* احترام تفضيل تقليل الحركة */
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration:1ms !important; animation-iteration-count:1 !important;
      transition-duration:1ms !important; scroll-behavior:auto !important;}
    .content .card:hover, .stat-box:hover, .btn:hover, .icon-btn:hover{transform:none !important;}
  }

  /* ══════════════════════════════════════════════════════════════════
     هوية «Modern Government Dashboard» — مقصورة على .page-neworder .content وحده
     كحلي ملكي + أزرق إداري + ذهبي. لا تؤثر على أي صفحة أخرى.
     ══════════════════════════════════════════════════════════════════ */
  body.page-neworder .content{
    --gv-navy:#0B1F3A; --gv-blue:#1D4E89; --gv-gold:#C8A24A; --gv-gold-l:#E7D3A2;
    --gv-white:#FFFFFF; --gv-grey:#F5F7FA; --gv-line:#E5E7EB; --gv-ink:#0B1F3A; --gv-mute:#5B6B7F;
    background:var(--gv-grey) !important; border:none !important;
    border-radius:0 0 18px 18px !important;
    box-shadow:0 24px 64px rgba(11,31,58,.28) !important;
    font-family:'DIN Next Arabic','IBM Plex Sans Arabic','Tajawal',sans-serif; color:var(--gv-ink);}
  /* الترويسة */
  .page-neworder .content .gv-head{background:var(--gv-navy) !important; border-bottom:3px solid var(--gv-gold);

  .page-neworder .content .gv-head .dh-sub{color:var(--gv-gold-l) !important; font-size:12.5px;}
  .page-neworder .content .drawer-close{background:rgba(255,255,255,.14) !important; color:#fff !important;}
  .page-neworder .content .drawer-close:hover{background:var(--gv-gold) !important; color:var(--gv-navy) !important;}
  /* شريط التقدّم ونسبة الاكتمال */
  .gv-progress{display:flex; align-items:center; gap:12px; background:var(--gv-white);
    border-radius:16px; padding:12px 16px; margin-bottom:12px;
    box-shadow:0 1px 3px rgba(11,31,58,.06), 0 6px 18px rgba(11,31,58,.05);}
  .gv-bar{flex:1; height:8px; border-radius:999px; background:var(--gv-line); overflow:hidden;}
  .gv-bar > i{display:block; height:100%; border-radius:999px;
    background:linear-gradient(90deg,var(--gv-blue),var(--gv-gold)); transition:width .35s cubic-bezier(.22,1,.36,1);}
  .gv-pct{font-size:15px; font-weight:700; color:var(--gv-navy); min-width:46px; text-align:left; direction:ltr;}
  .gv-pct-lb{font-size:12px; font-weight:600; color:var(--gv-mute); white-space:nowrap;}
  /* البطاقات */
  .page-neworder .content .card, .page-neworder .content .glow-card{
    background:var(--gv-white) !important; border:1px solid var(--gv-line) !important;
    border-radius:16px !important; box-shadow:0 1px 3px rgba(11,31,58,.06), 0 6px 18px rgba(11,31,58,.05) !important;
    padding:18px !important; margin-bottom:12px; overflow:visible;}
  /* عناوين الأقسام: أيقونة ذهبية + نص كحلي */
  .page-neworder .content .form-table thead th{background:transparent !important; color:var(--gv-navy) !important;
    border:none !important; border-bottom:1px solid var(--gv-line) !important;

  .page-neworder .content .form-table thead th > span,
  .page-neworder .content .form-table thead th .th-bar > span{

    display:inline-flex; align-items:center; gap:10px;}
  .page-neworder .content .form-table thead th .lu{

  /* الحقول */
  .page-neworder .content .fbox{background:var(--gv-white) !important; border:1px solid var(--gv-line) !important;
    border-radius:12px !important; padding:9px 12px !important; transition:border-color .2s, box-shadow .2s;}
  .page-neworder .content .fbox:focus-within{border-color:var(--gv-blue) !important; box-shadow:0 0 0 3px rgba(29,78,137,.12) !important;}
  .page-neworder .content .fbox > label{display:flex; align-items:center; gap:6px; margin:0 0 5px !important;

  .page-neworder .content .fbox > label .lu{color:var(--gv-gold);}
  .page-neworder .content .fbox input, .page-neworder .content .fbox select, .page-neworder .content .fbox textarea{
    border:none !important; background:transparent !important; box-shadow:none !important;
    padding:0 !important; min-height:26px !important; font-size:14px; font-weight:600; color:var(--gv-ink);}
  .page-neworder .content .fgrid, .page-neworder .content .fgrid.tight{
    display:grid !important; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)) !important; gap:11px !important;}
  .page-neworder .content .fbox.w-grow{grid-column:1 / -1;}
  .page-neworder .content .fbox.w-date, .page-neworder .content .fbox.w-days, .page-neworder .content .fbox.w-time,
  .page-neworder .content .fbox.w-num4, .page-neworder .content .fbox.w-num5, .page-neworder .content .fbox.w-sel{width:auto;}
  /* الأزرار */
  .page-neworder .content .btn{min-height:44px; border-radius:12px; font-size:13px; font-weight:700;}
  .page-neworder .content .btn-primary{background:var(--gv-gold) !important; color:var(--gv-navy) !important;
    border:none !important; box-shadow:0 4px 12px rgba(200,162,74,.28) !important;}
  .page-neworder .content .btn-primary:hover{background:#B8912F !important; color:#fff !important;}
  .page-neworder .content .btn-outline{background:var(--gv-navy) !important; color:#fff !important; border:none !important;}

  .page-neworder .content .pill-opt{border-radius:12px; border-color:var(--gv-line);}
  .page-neworder .content .pill-opt:hover{border-color:var(--gv-gold);}
  .page-neworder .content .pill-opt:has(input:checked){background:rgba(200,162,74,.12) !important;
    border-color:var(--gv-gold) !important; color:var(--gv-navy) !important;}
  .page-neworder .content .pill-opt:has(input:checked) .dot{background:var(--gv-gold); border-color:var(--gv-gold);}
  .page-neworder .content .ms-wrap{border-color:var(--gv-line); border-radius:12px;}
  .page-neworder .content .ms-wrap.open{border-color:var(--gv-gold); box-shadow:none;}
  .page-neworder .content .ms-wrap.open .ms-head{background:rgba(200,162,74,.12); color:var(--gv-navy);}
  .page-neworder .content .ms-ic{color:var(--gv-gold);}
  .page-neworder .content .acc-card.sub.open .acc-head{background:rgba(200,162,74,.12); color:var(--gv-navy);}
  .page-neworder .content .acc-n.on, .page-neworder .content .ms-n.on{background:var(--gv-gold); color:var(--gv-navy);}
  /* الملخّص الذكي */
  .gv-summary{position:sticky; top:0; background:var(--gv-navy); color:#fff; border-radius:12px;

    display:flex; align-items:center; gap:7px;}

    border-bottom:1px solid rgba(255,255,255,.09);}
  .gv-srow:last-child{border-bottom:none;}
  .gv-srow .lu{color:var(--gv-gold); flex:none; width:13px; height:13px;}
  .gv-sk{font-size:10px; color:rgba(255,255,255,.55); display:block; line-height:1.2;}
  .gv-sv{font-size:12px; font-weight:600; color:#fff; display:block; line-height:1.35;

  @media (max-width:1100px){ .gv-layout{grid-template-columns:1fr;} .gv-summary{position:static;} }
  @media (max-width:700px){
    .page-neworder .content .fgrid, .page-neworder .content .fgrid.tight{grid-template-columns:1fr !important;}
  }

  /* ══════════ لوح طلب فعالية: خلفية بيضاء/بنية فاتحة وإطار فسفوري ══════════ */
  /* ══════════ قيمة التاريخ بعد منتقي التاريخ ══════════ */
  .rp-date .dwrap > input[type="date"], .fbox .dwrap > input[type="date"],
  .sec-card .dwrap > input[type="date"]{padding-inline-start:0 !important; padding-inline-end:26px !important;}
  .rp-date .dview, .fbox .dview, .sec-card .dview{
    padding-inline-start:0; padding-inline-end:28px; justify-content:flex-end; direction:ltr;}
  /* قائمة مقدّمي الفعالية بعرض المحتوى */
  .pick-row .ms-wrap .ms-head{min-height:30px !important; padding:4px 9px !important; font-size:11.5px !important;}
  .pick-row .ms-head .ms-ic .lu{width:14px; height:14px;}
  .pick-row .ms-head .ms-chev .lu{width:13px; height:13px;}
  .ms-head .ms-n{min-width:18px !important; padding:0 6px !important; font-size:10px !important;}
  .ms-label{font-size:11.5px;}

  /* ══════════ أحجام الحقول بالمقاسات المطلوبة ══════════ */
  /* صفوف نافذة العرض فقط */
  .ro-row{display:flex; align-items:flex-start; gap:9px; padding:9px 0;
    border-bottom:1px solid var(--border-light);}
  .ro-row:last-child{border-bottom:none;}
  .ro-ic{color:var(--gold); flex:none; margin-top:1px;}
  .ro-k{flex:0 0 130px; font-size:12px; color:var(--muted-text);}
  .ro-v{flex:1; min-width:0; font-size:13px; font-weight:600; color:var(--ink); word-break:break-word;}

  /* ══════════ عناوين الأقسام: عنوان كبير ووصف تحته ══════════ */
  .glow-card .form-table thead th{
    background:transparent !important; border:none !important;
    padding:0 0 13px !important; text-align:right;}
  .glow-card .form-table thead th .th-bar,
  .glow-card .form-table thead th > div{
    display:flex; align-items:flex-start; justify-content:space-between; gap:14px; flex-wrap:wrap;}
  .sec-title{display:block; font-family:var(--font-head);
    font-size:17px; font-weight:700; color:var(--heading-text); line-height:1.35;}
  .sec-title i{display:block; margin-top:3px; font-style:normal;
    font-size:11.5px; font-weight:400; color:var(--muted-text); line-height:1.5;}
  .glow-card{padding:16px !important; border-radius:12px !important; margin-bottom:10px;
    background:#fff !important; border:1px solid var(--border-c) !important;
    box-shadow:0 2px 5px rgba(18,36,43,.06) !important;}
  .glow-card:hover{transform:none !important;}
  /* أزرار الإضافة المصغّرة بجوار العنوان */
  .glow-card .plus-btn.mini{align-self:center;}
  .glow-card .th-actions{align-self:center;}

  /* ══════════ التسمية فوق المربع والمدخل يملؤه ══════════ */
  .fbox{height:auto; min-height:0; padding:0 !important; border:none !important;
    background:transparent !important; box-shadow:none !important;
    display:flex; flex-direction:column !important; align-items:stretch; gap:4px;}
  .fbox:focus-within{box-shadow:none !important; border:none !important;}
  .fbox > label{flex:0 0 auto; margin:0 !important; font-size:11.5px !important; gap:5px !important;
    line-height:1.2; color:var(--muted-text); white-space:nowrap; display:inline-flex; align-items:center;}
  .fbox > label .lu{opacity:.85;}
  .fbox input, .fbox select, .fbox textarea{
    width:100% !important; min-width:0; box-sizing:border-box;
    height:38px !important; min-height:38px !important; line-height:38px !important;
    padding:0 10px !important; font-size:13px !important; font-weight:700;
    border:1px solid var(--line) !important; border-radius:9px !important; background:#fff !important;
    text-align:right !important; direction:rtl;}
  .fbox input[type="number"], .fbox input.num{text-align:right !important; direction:ltr;}
  .fbox input:focus, .fbox select:focus, .fbox textarea:focus{
    border-color:var(--gold) !important; box-shadow:0 0 0 3px rgba(46,112,105,.12) !important;}
  /* الحقول النصية والقوائم تبقى بمحاذاة عربية */
  .fbox select, .fbox input[type="text"]{text-align:right; direction:rtl;}
  .fbox .dwrap, .fbox .twrap{width:100%; min-width:0; height:38px; position:relative;}
  .fbox .dview, .fbox .tview{height:38px; line-height:38px; padding:0 10px !important;
    padding-inline-end:24px !important; justify-content:flex-end; text-align:right; direction:ltr;}
  .fbox .dwrap > input[type="date"], .fbox .twrap > input[type="time"]{
    padding:0 10px !important; padding-inline-end:26px !important;}
  /* مربع الملاحظات وحده عمودي */
  .fbox:has(textarea){height:auto; min-height:74px; flex-direction:column !important;
    align-items:stretch; padding:8px 11px !important; gap:5px;}
  .fbox:has(textarea) > label{margin-bottom:0 !important;}
  .fbox textarea{height:auto !important; min-height:44px !important; line-height:1.5 !important;
    text-align:right; direction:rtl;}
  /* المربعات متلاصقة بلا فواصل */
  .fgrid, .fgrid.tight{gap:0 !important; margin-bottom:0 !important;}
  .fgrid.tight > .fbox{margin:0 !important;}
  .fgrid.tight{display:flex !important; flex-wrap:wrap;}
  .fgrid.tight > .fbox{margin:0;}
  .fgrid.tight > .fbox:first-child{border-start-end-radius:9px; border-end-end-radius:9px;}
  .fgrid.tight > .fbox:last-child{border-inline-start-width:1px;
    border-start-start-radius:9px; border-end-start-radius:9px;}
  /* الصفوف متلاصقة رأسيًا بلا فراغ */
  .fgrid.tight > .fbox{margin-block:-0.5px;}
  .glow-card .form-table.compact tbody tr + tr td{padding-top:0 !important;}
  .glow-card .form-table tbody tr td{border:none !important;}
  /* العروض معرّفة في نهاية الملف (نِسَب كقسم بيانات التنفيذ) */
  /* الصف يملأ العرض بالتساوي بلا فراغ متبقٍ */
  .fgrid.tight{align-items:stretch;}
  /* التاريخ والوقت: المدخلات تبدأ من أقصى اليمين */
  .fbox .dwrap, .fbox .twrap{width:100%;}
  .fbox .dwrap > input[type="date"], .fbox .twrap > input[type="time"]{
    padding:0 !important; direction:rtl; text-align:right;}
  .fbox .dview, .fbox.w-time .tview{
    inset:0; display:flex; align-items:center; justify-content:flex-start;
    padding-inline-start:0 !important; padding-inline-end:26px !important;
    direction:ltr; text-align:right;}
  .fbox input[type="date"]::-webkit-calendar-picker-indicator,
  .fbox input[type="time"]::-webkit-calendar-picker-indicator{margin:0; padding:0;}
  /* قسم بيانات التنفيذ بنفس الارتفاع */
  /* حقول قسم بيانات التنفيذ بنفس النمط والارتفاع */
  .glow-card .form-table.compact tbody td{padding:0 !important;}
  .glow-card .form-table tbody td{padding:8px 10px !important; vertical-align:top;}
  .glow-card .form-table tbody td select,
  .glow-card .form-table tbody td input,
  .glow-card .form-table tbody td textarea{
    height:38px !important; min-height:38px !important; padding:0 11px !important;
    font-size:13.5px !important; font-weight:600; border-radius:9px !important;
    border:1px solid var(--line) !important; background:#fff !important;}
  .glow-card .form-table tbody td textarea{height:auto !important; min-height:44px !important;
    padding:9px 11px !important; line-height:1.5;}
  .glow-card .form-table tbody td select:focus,
  .glow-card .form-table tbody td input:focus,
  .glow-card .form-table tbody td textarea:focus{
    border-color:var(--gold) !important; box-shadow:0 0 0 3px rgba(46,112,105,.12) !important;}
  .glow-card .form-table tbody td > label{font-size:11.5px !important; margin-bottom:4px !important;
    color:var(--muted-text) !important; line-height:1.2;}
  /* القوائم المنسدلة وحبّات الاختيار بنفس الارتفاع */
  .glow-card .ms-head{min-height:38px !important; padding:0 11px !important; border-radius:9px;}
  .glow-card .pill-opt{min-height:38px; border-radius:9px;}
  .glow-card .trn-card{min-height:44px; border-radius:9px;}
  @media (max-width:900px){
    .fbox.w-title{width:100% !important; flex:0 0 100% !important;}
    #f_periodWrap.fbox{width:50% !important; flex:0 0 50%;}
    .fbox.w-date, .fbox.w-time{width:50% !important; flex:0 0 50%;}
  }
  @media (max-width:600px){
    .fgrid.tight > .fbox{width:100% !important; flex:0 0 100% !important; max-width:none;
