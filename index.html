    #f_periodWrap.fbox, .fbox.w-date, .fbox.w-time,
    .fbox.w-num4, .fbox.w-days, .fbox.w-num5, .fbox.w-sel{width:100% !important; flex:0 0 100% !important;}
    .fbox{min-height:60px;}
  }

  /* ══════════ فواصل ورقية متداخلة (File Tabs) ══════════ */
  .ftabs{display:flex; align-items:flex-end; gap:0; padding:0 6px; margin:14px 0 0; position:relative; z-index:2;}
  .ftab{all:unset; cursor:pointer; position:relative; display:inline-flex; align-items:center; gap:7px;
    padding:9px 20px 11px; margin-inline-start:-12px; border-radius:12px 12px 0 0;
    background:#C4A88C; border:1px solid #B29578; border-bottom:none;
    font-size:12.5px; font-weight:700; color:#4A3527; white-space:nowrap;
    box-shadow:0 -2px 6px rgba(0,0,0,.10);
    transition:background .2s var(--ease-standard), color .2s, transform .2s;}
  .ftab:first-child{margin-inline-start:0;}
  .ftab:hover{background:#D6BFA8; color:#3E2C22; z-index:3;}
  .ftab .lu{opacity:.9;}
  /* الفاصل النشط يبرز للمقدمة */
  .ftab.active{background:#fff !important; color:var(--gold-d); z-index:5;
    border-color:var(--line); font-weight:700; transform:translateY(1px);
    box-shadow:0 -4px 12px rgba(11,31,58,.09);}
  .ftab.active::after{content:''; position:absolute; inset-inline:0; bottom:-1px; height:2px; background:#fff;}
  .ftab.active .lu{opacity:1; color:var(--gold);}
  /* جسم الفواصل يتصل بها */
  .ftab-body{position:relative; z-index:1; margin-top:-1px;}
  .ftab-body > .card, .ftab-body > .grid > .card{border-top-left-radius:0 !important; border-top-right-radius:0 !important;}
  @media (max-width:820px){
    .ftabs{overflow-x:auto; padding-bottom:1px;}
    .ftab{padding:8px 14px 10px; margin-inline-start:-8px; font-size:11.5px;}
    .ftab span{display:none;}
    .ftab{padding:10px 14px;}
  }

  /* ══════════ حقول التاريخ: خط أصغر ومنتقي داخل المربع ══════════ */
  .fbox .dwrap{position:relative; overflow:hidden;}
  .fbox .dwrap > input[type="date"]{font-size:12px !important; padding:0 !important;
    width:100% !important; box-sizing:border-box;}
  .fbox .dview{font-size:12px !important; font-weight:700;
    padding-inline-end:20px !important; overflow:hidden; text-overflow:ellipsis;}
  /* أيقونة المنتقي داخل حدود المربع لا خارجها */
  .fbox input[type="date"]::-webkit-calendar-picker-indicator,
  .fbox input[type="time"]::-webkit-calendar-picker-indicator{
    margin:0 !important; padding:0 !important; width:15px; height:15px;
    position:absolute; inset-inline-start:2px; top:50%; transform:translateY(-50%);
    cursor:pointer; opacity:.6;}
  .fbox input[type="date"]::-webkit-calendar-picker-indicator:hover,
  .fbox input[type="time"]::-webkit-calendar-picker-indicator:hover{opacity:1;}
  .fbox .twrap{position:relative; overflow:hidden;}
  .fbox .tview{font-size:12px !important; font-weight:700; padding-inline-end:20px !important;}
  /* عرض القسم كامل الصفحة */
  .ftab-body{width:100%;}
  .ftab-body > .card, .ftab-body > .grid{width:100%; box-sizing:border-box;}

  /* ══════════ شريط إجراءات ثابت أسفل الصفحة ══════════ */
  body.page-neworder .save-bar{position:sticky; bottom:0; z-index:20;
    background:rgba(255,255,255,.94); backdrop-filter:blur(10px);
    border-top:1px solid var(--line); border-radius:12px;
    padding:10px 12px; margin:0 -2px; box-shadow:0 -4px 18px rgba(11,31,58,.07);}
  body.page-neworder .save-bar .btn{min-height:40px;}
  /* الحقل المطلوب الفارغ يُلمّح إليه بلطف */
  .fbox:has(input:required:invalid), .fbox:has(select:required:invalid){
    border-color:#E5C08C !important;}
  .fbox:has(input:required:invalid) > label,
  .fbox:has(select:required:invalid) > label{color:#B07A12;}
  /* توهج موحّد عند التركيز */
  .fbox:focus-within{border-color:var(--gold) !important;
    box-shadow:0 0 0 3px rgba(46,112,105,.12) !important; z-index:2; position:relative;}
  /* حقل الساعات المحسوب يتميّز */
  .fbox.w-num5{background:var(--gold-l) !important;}
  .fbox.w-num5 input{color:var(--gold-d) !important; font-weight:800;}

  /* ══════════ مربعات أيام التنفيذ ══════════ */
  .day-chips{display:flex; flex-wrap:wrap; gap:5px; justify-content:center; margin-top:9px;
    padding-top:8px; border-top:1px solid var(--border-light);}
  .day-chip{all:unset; cursor:pointer; display:grid; place-items:center;
    min-width:26px; height:26px; padding:0 6px; border-radius:7px;
    background:var(--gold-l); color:var(--gold-d); border:1px solid transparent;
    font-size:12px; font-weight:800; font-family:'IBM Plex Sans Arabic',sans-serif; direction:ltr;
    transition:background .18s, color .18s, transform .18s;}
  .day-chip:hover{background:var(--gold); color:#fff; transform:translateY(-2px);}

  /* ══════════ عناوين الأقسام خارج المربع ══════════ */
  .ftab-body .glow-card{padding-top:0 !important; background:#fff;}
  .ftab-body .glow-card > table > thead > tr > th{
    background:transparent !important; color:var(--heading-text) !important;
    border:none !important; border-bottom:1px solid var(--border-light) !important;
    padding:14px 4px 12px !important; margin:0 !important; text-align:right;}
  .ftab-body .glow-card > table > thead > tr > th > span,
  .ftab-body .glow-card > table > thead > tr > th > div > span:first-child{
    color:var(--heading-text) !important; font-size:15px !important; font-weight:700;
    display:inline-flex; align-items:center; gap:9px;}
  .ftab-body .glow-card > table > thead > tr > th .lu{
    width:30px; height:30px; padding:7px; box-sizing:border-box; flex:none;
    color:var(--gold-d); background:var(--gold-l); border-radius:9px;}

  /* ══════════ صفوف اختيار مضغوطة: مربع + نص في سطر واحد ══════════ */
  .opt-row{display:inline-flex; align-items:center; gap:7px; width:auto; max-width:100%;
    padding:5px 9px; cursor:pointer; border:1px solid var(--line); border-radius:8px;
    background:#fff; font-size:12.5px; line-height:1.3; box-sizing:border-box;
    transition:border-color .18s, background .18s;}
  .opt-row input{position:absolute; opacity:0; width:0; height:0;}
  .opt-box{width:16px; height:16px; flex:none; border-radius:4px; border:1.5px solid var(--line-strong);
    display:grid; place-items:center; background:#fff; transition:background .18s, border-color .18s;}
  .opt-box .lu{width:11px; height:11px; color:#fff; opacity:0; transition:opacity .18s;}
  .opt-txt{min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--ink);}
  .opt-txt b{font-weight:700; direction:ltr; display:inline-block; color:var(--muted-text);}
  /* محدَّد: خلفية بيضاء وإطار ملوّن فقط */
  .opt-row.on{background:#fff; border-color:var(--gold); box-shadow:0 0 0 1px var(--gold) inset;}
  .opt-row.on .opt-box{background:var(--gold); border-color:var(--gold);}
  .opt-row.on .opt-box .lu{opacity:1;}
  .opt-row:hover{border-color:var(--gold);}
  /* الإتاحة: أخضر متاح، أحمر مشغول */
  .opt-row.is-free{border-color:#9CC7B1;}
  .opt-row.is-busy{border-color:#E4A8A2; background:#FEF8F7;}
  .opt-row.is-busy .opt-txt{color:var(--muted-text);}
  .opt-tag{flex:none; border-radius:999px; padding:1px 7px; font-size:10px; font-weight:700;}
  .opt-tag.free{background:var(--success-bg,#E3F1EA); color:var(--success,#388467);}
  .opt-tag.busy{background:var(--danger-bg,#FBE7E5); color:var(--danger,#CF443A);}
  /* الحاويات: تدفق مرن بعرض المحتوى */
  .ms-wrap.open #trainerChipList{display:flex !important; flex-wrap:wrap; gap:6px; padding:9px;}
  .acc-card.sub.open .acc-body{display:flex !important; flex-wrap:wrap; gap:6px; padding:8px 10px;
    max-width:100%; opacity:1;}
  /* رأس القائمة بعرض المحتوى */
  .ms-head{width:auto !important; min-width:0;}
  .ms-wrap{display:inline-block; width:auto !important; max-width:100%;}
  .pick-one .ms-wrap, .pick-row .ms-wrap{display:block; width:100% !important;}
  .acc-card.sub .acc-head{justify-content:flex-start !important; gap:8px;}
  .acc-card.sub .acc-t{flex:0 1 auto;}
  .acc-card.sub .acc-n{margin-inline-start:6px;}
  .acc-card.sub .acc-chev{transform:rotate(-90deg);}
  .acc-card.sub.open .acc-chev{transform:rotate(0deg);}

  /* ══════════ بطاقات مقدّمي الفعالية ══════════ */
  .trn-card{display:flex; align-items:center; gap:10px; padding:10px 12px; cursor:pointer;
    border:1.5px solid var(--line); border-radius:12px; background:#fff; box-sizing:border-box;
    transition:border-color .2s ease, background .2s ease, box-shadow .2s ease;}
  .trn-card:hover{border-color:var(--gold);}
  .trn-card input{position:absolute; opacity:0; width:0; height:0;}
  .trn-dot{width:22px; height:22px; flex:none; border-radius:50%; border:1.5px solid var(--line);
    display:grid; place-items:center; transition:background .2s, border-color .2s;}
  .trn-dot .lu{width:13px; height:13px; color:#fff; opacity:0; transition:opacity .2s;}
  .trn-card.on{border-color:var(--gold); background:var(--gold-l); box-shadow:0 2px 8px rgba(46,112,105,.10);}
  .trn-card.on .trn-dot{background:var(--gold); border-color:var(--gold);}
  .trn-card.on .trn-dot .lu{opacity:1;}
  .trn-body{flex:1; min-width:0; display:flex; flex-direction:column; line-height:1.3;}
  .trn-name{font-size:13px; font-weight:700; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .trn-phone{font-size:11px; color:var(--muted-text); direction:ltr; text-align:right;}
  .trn-tag{flex:none; display:inline-flex; align-items:center; gap:4px; border-radius:999px;
    padding:3px 9px; font-size:10.5px; font-weight:700; white-space:nowrap;}
  .trn-tag.free{background:var(--success-bg,#E3F1EA); color:var(--success,#388467);}
  .trn-tag.busy{background:var(--danger-bg,#FBE7E5); color:var(--danger,#CF443A);}
  .trn-card.is-busy{background:#FDF7F6;}
  .trn-card.is-busy .trn-name{color:var(--muted-text);}

  /* عرض الوقت بأرقام إنجليزية فوق حقل المتصفح */
  .twrap{position:relative; display:block; width:100%;}
  .twrap > input[type="time"]{color:transparent !important; position:relative; z-index:3;
    background-color:transparent; width:100%; cursor:pointer;}
  .twrap > input[type="time"]::-webkit-datetime-edit{color:transparent;}
  /* أيقونة المنتقي تبقى ظاهرة وقابلة للنقر فوق طبقة العرض */
  .twrap > input[type="time"]::-webkit-calendar-picker-indicator{
    opacity:1; position:relative; z-index:5; cursor:pointer; margin:0; padding:0 2px;}
  .tview{position:absolute; inset:0; display:flex; align-items:center; justify-content:flex-start;
    padding-inline-end:24px; direction:ltr; text-align:left; pointer-events:none; z-index:1;
    font-size:13px; font-weight:600; color:var(--main-text); white-space:nowrap;}
  .tview.empty{color:#9aa3ad; font-weight:400;}

  /* ══════════ تبويبات وترويسة بأسلوب النموذج المرجعي ══════════ */
  .pg-head{display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:18px; flex-wrap:wrap;}
  .pg-eyebrow{display:block; margin-bottom:5px; color:var(--gold); font-size:12px; font-weight:700;}
  .pg-head h1{margin:0; font-size:30px; font-weight:700; line-height:1.35; color:var(--heading-text);}
  .pg-head p{margin:6px 0 0; color:var(--muted-text); font-size:14px; max-width:640px;}
  .pg-actions{display:flex; gap:8px; flex-wrap:wrap;}
  /* شريط تبويبات بحبّة منزلقة */
  .seg{display:inline-flex; gap:4px; padding:5px; border-radius:999px; background:var(--sand-100);
    border:1px solid var(--border-c);}
  .seg button{all:unset; cursor:pointer; padding:8px 18px; border-radius:999px; font-size:13px;
    font-weight:600; color:var(--muted-text); transition:background .22s var(--ease-standard), color .22s;}
  .seg button:hover{color:var(--ink);}
  .seg button.active{background:var(--surface,#fff); color:var(--gold-d);
    box-shadow:0 2px 6px rgba(28,50,59,.07);}
  /* لوح جانبي لأنواع التقارير */
  .rep-layout{display:grid; grid-template-columns:250px minmax(0,1fr); gap:16px; align-items:start;}
  .rep-nav{background:var(--surface,#fff); border:1px solid var(--border-c); border-radius:16px; padding:12px;}
  .rep-nav-title{font-size:12px; font-weight:700; color:var(--muted-text); padding:4px 8px 10px;}
  .rep-nav button{all:unset; cursor:pointer; display:flex; align-items:center; justify-content:space-between;
    width:100%; box-sizing:border-box; padding:11px 12px; border-radius:10px; font-size:13px;
    font-weight:600; color:var(--main-text); transition:background .2s ease, color .2s ease;}
  .rep-nav button:hover{background:var(--card-hover);}
  .rep-nav button.active{background:var(--gold-l); color:var(--gold-d); font-weight:700;}
  .rep-nav .lu{color:var(--soft-text);}
  .rep-nav button.active .lu{color:var(--gold);}
  @media (max-width:900px){ .rep-layout{grid-template-columns:1fr;} }

  /* ══════════ جداول أكثر إحكامًا ══════════ */
  /* ══════════ أعمدة متقاربة تنتهي عند آخر مدخل ══════════ */
  .orders-page table, .content .tbl-scroll table{width:auto !important; min-width:0 !important;}
  .orders-page table th, .orders-page table td{white-space:nowrap; width:1%;}
  /* شريط البحث والتصفية في سطر واحد */
  .orders-page .tabs{display:flex; align-items:center; gap:7px; flex-wrap:nowrap; overflow-x:auto;}
  .orders-page .tabs > *{flex:none;}
  .orders-page .tabs select{min-height:32px; font-size:12px; padding-block:0;}
  .orders-page .tabs .icon-btn{width:28px; height:28px; padding:0;}
  /* مربعا المنجز/غير المنجز مضغوطان */
  .fs-flags{display:inline-flex; gap:8px; align-items:center; margin:0 0 8px;}
  .fs-flags .pill-opt{padding:6px 11px; font-size:12px;}
  .fs-flags .pill-opt .dot{width:18px; height:18px;}
  /* حقول التاريخ في التقارير بعرض المحتوى */
  .rp-dates{display:inline-flex !important; gap:8px; flex-wrap:wrap;}
  .rp-date{width:150px;}
  .rp-date input{min-height:36px; font-size:12.5px;}
  /* قائمة المقدّمين بعرض المحتوى */
  .ms-wrap{max-width:100%;}
  .pick-row .ms-wrap .ms-head{min-height:34px; padding:6px 10px; font-size:12px;}
  .pick-row .ms-wrap{width:100%;}
  .ms-label{max-width:100%;}
  .ms-head .ms-n{min-width:20px; padding:0 7px; font-size:10.5px;}

  .orders-page table input[type="checkbox"],
  .content table input[type="checkbox"]{width:15px !important; height:15px !important;
    min-height:15px !important; accent-color:var(--gold); cursor:pointer; margin:0;}
  .orders-page table td, .content table td{padding-block:6px !important; line-height:1.5;}
  .orders-page table th, .content table th{padding-block:7px !important;}
  .orders-page table td:first-child, .content table td:first-child{width:32px; text-align:center;}
  /* شريط الأدوات في سطر واحد */
  .table-toolbar{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .table-toolbar select{min-height:32px; padding-block:0; font-size:12px;}
  .table-toolbar .icon-btn{width:30px; height:30px; padding:0;}

  /* ══════════ مربعات اختيار بأسلوب الحبّة (كالنموذج المرجعي) ══════════ */
  .pill-opt{display:inline-flex; align-items:center; gap:9px; padding:11px 15px;
    border:1.5px solid var(--border-c); border-radius:12px; background:var(--surface,#fff);
    font-size:13px; font-weight:600; color:var(--main-text); cursor:pointer;
    transition:border-color .2s ease, background .2s ease, color .2s ease;}
  .pill-opt:hover{border-color:var(--gold);}
  .pill-opt input{position:absolute; opacity:0; width:0; height:0;}
  .pill-opt .dot{width:22px; height:22px; flex:none; border-radius:50%; border:1.5px solid var(--border-c);
    display:grid; place-items:center; transition:background .2s ease, border-color .2s ease;}
  .pill-opt .dot .lu{width:13px; height:13px; color:#fff; opacity:0; transition:opacity .2s ease;}
  .pill-opt:has(input:checked){border-color:var(--gold); background:var(--gold-l); color:var(--gold-d);}
  .pill-opt:has(input:checked) .dot{background:var(--gold); border-color:var(--gold);}
  .pill-opt:has(input:checked) .dot .lu{opacity:1;}

  /* ══════════ أقسام مرقّمة (كالنموذج المرجعي) ══════════ */
  /* نتيجة التقرير بجوار الخيارات على الشاشات الواسعة */
  /* خيارات التقرير فوق والنتائج أسفلها بعرض كامل — مساحة أكبر للنتائج */
  .rep-split{display:block;}
  .rep-split > .card:first-child{margin-bottom:12px;}
  .rep-split > .card:first-child .fgrid{display:flex !important; flex-wrap:wrap;
    align-items:flex-end; gap:10px 12px !important; max-width:none !important;}
  .rep-split > .card:first-child .fgrid > .fbox{flex:0 0 auto; width:180px;}
  .rep-split > #qr_result{width:100%;}
  .sec-card .fbox{padding:8px 11px;}
  .sec-card .fbox input, .sec-card .fbox select{min-height:26px; font-size:13.5px;}
  .sec-card .fbox > label{font-size:12px; margin-bottom:5px;}

  /* ══════════ قوائم الإعدادات: أسطر ضيقة وأيقونات أقصى اليسار ══════════ */
  .settings-page .list-row, .set-list-row{display:flex; align-items:center; gap:8px;
    padding:4px 8px !important; min-height:30px; border-bottom:1px solid var(--border-light);}
  .settings-page .list-row:last-child{border-bottom:none;}
  .settings-page .list-row > span:first-child, .set-list-row > span:first-child{flex:1; min-width:0;
    font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .settings-page .list-row .icon-btn, .set-list-row .icon-btn{width:24px !important; height:24px !important;
    padding:0 !important; margin-inline-start:auto;}
  .settings-page .list-row .icon-btn + .icon-btn, .set-list-row .icon-btn + .icon-btn{margin-inline-start:3px;}
  .settings-page input[type="checkbox"], .set-table input[type="checkbox"]{
    width:13px !important; height:13px !important; min-height:13px !important; accent-color:var(--gold);}
  /* جدول الإعدادات مضغوط */
  .set-table{width:100%; border-collapse:collapse; font-size:12px;}
  .set-table th{background:var(--sand-100) !important; padding:6px 8px !important; font-size:11.5px;
    white-space:nowrap; color:var(--muted-text) !important;}
  .set-table{table-layout:auto; width:auto; min-width:0;}
  .set-table th, .set-table td{width:1%; white-space:nowrap;}
  .set-table td{padding:3px 7px !important; border-top:1px solid var(--border-light); line-height:1.45;}
  .set-table th{padding:5px 7px !important;}
  .set-table td .icon-btn{width:22px !important; height:22px !important; margin:0 1px;}
  .set-table tbody tr:hover{background:var(--card-hover);}
  .set-table .icon-btn{width:24px !important; height:24px !important; padding:0 !important;}
  .set-table .helper{font-size:11px;}

  .sec-card{background:var(--surface,#fff); border:1px solid var(--border-c); border-radius:16px;
    padding:20px; margin-bottom:14px;}
  .sec-hd{display:flex; align-items:flex-start; gap:12px; margin-bottom:16px; flex-direction:row-reverse;
    justify-content:flex-end; text-align:right;}
  .sec-no{width:38px; height:38px; flex:none; border-radius:50%; background:var(--gold); color:#fff;
    display:grid; place-items:center; font-size:15px; font-weight:700;}
  .sec-hd h3{margin:0; font-size:17px; font-weight:700; color:var(--heading-text);}
  .sec-hd p{margin:3px 0 0; font-size:12.5px; color:var(--muted-text);}

  /* أرقام الطلبات والمعرّفات بخط أحادي */
  .badge, .num-f, .stat-value, .kpi-v,
  .fbox input[type="number"], .fbox input.num{font-family:'IBM Plex Sans Arabic',sans-serif; font-weight:700;}
  /* شاشة الدخول بهوية مِداد */
  .lgw{background:#1A333D !important;
    background-image:radial-gradient(900px 520px at 78% -10%,rgba(45,93,87,.55),transparent 60%),
      radial-gradient(680px 460px at 6% 104%,rgba(221,150,75,.22),transparent 62%) !important;}
  .lglogo{background:#DD964B !important; box-shadow:0 8px 20px rgba(221,150,75,.30) !important;}
  .lglogo .lu{color:#1A333D !important;}
  .lgbtn{background:#2E7069 !important; box-shadow:0 8px 18px rgba(46,112,105,.28) !important;}
  .lgbtn:hover{background:#275F59 !important;}
  .lgw .lgin input[type]:focus{border-color:#2E7069 !important; box-shadow:0 0 0 3px rgba(46,112,105,.12) !important;}
  .lgrow a{color:#2E7069 !important;}
  .lghint{background:#E1EFEC !important; border-color:#C8E0DA !important; color:#275F59 !important;}
  /* حقول وأزرار وبطاقات بمقاسات الهوية */
  input, select, textarea{min-height:44px; border-radius:12px; border-color:#D2CDC4;}
  .fbox input, .fbox select, .fbox textarea{min-height:22px;}
  input:focus, select:focus, textarea:focus{outline:none; border-color:#2E7069;
    box-shadow:0 0 0 3px rgba(46,112,105,.12);}
  .btn{border-radius:12px; min-height:40px;}
  .btn-primary{background:#2E7069 !important; color:#fff !important;}
  .btn-primary:hover{background:#275F59 !important;}
  .content .card, .stat-card, .panel{border-radius:16px;}
  tbody td{padding-block:12px;}
  thead th{background:var(--sand-100) !important;}
  .badge, .status-badge{min-height:26px; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:600;}

  /* ══════════ ضبط أحجام المربعات حسب المدخلات ══════════ */
  .supervisor-info{padding:4px 8px; font-size:11px; gap:10px; margin-top:4px;}
  /* شبكة مضغوطة تحدد عرض كل مربع حسب محتواه */
  .fgrid.tight{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:7px; align-items:stretch;}
  .fgrid.tight .fbox{flex:0 0 auto; padding:5px 8px;}
  .fbox.w-date{width:132px;}      /* 08/09/2026 */
  .fbox.w-days{width:78px;}       /* حتى 100 */
  .fbox.w-time{width:138px;}      /* 12:00 ص */
  .fbox.w-num4{width:96px;}       /* حتى 1000 */
  .fbox.w-num5{width:104px;}      /* حتى 2000 */
  .fbox.w-sel{width:auto; min-width:120px; max-width:190px;}
  .fbox.w-grow{flex:1 1 100%; min-width:320px;}
  .fbox.w-date input, .fbox.w-days input, .fbox.w-time input,
  .fbox.w-num4 input, .fbox.w-num5 input{min-height:20px; font-size:12.5px;}
  .fbox.w-sel select{font-size:12.5px;}
  /* الوقت: النص بعد الأيقونة مباشرة */
  .fbox.w-time .twrap > input[type="time"]{padding-inline-start:0 !important; padding-inline-end:0 !important;}
  .fbox.w-time .tview{padding-inline-start:0; padding-inline-end:26px; justify-content:flex-end; direction:ltr;}
  /* مربع الملاحظات المشروط */
  /* يجب تجاوز قاعدة pointer-events:none المطبّقة على تسميات النموذج */
  .glow-card .form-table tbody td > label.notes-toggle,
  .glow-card .form-table tbody td label.pill-opt{
    pointer-events:auto !important; position:static !important; display:inline-flex !important;
    font-size:13px !important; margin:0 !important; padding:6px 2px !important; cursor:pointer;
    background:transparent !important; white-space:nowrap; color:var(--gold-d) !important; font-weight:700;}
  .notes-toggle{display:inline-flex; align-items:center; gap:8px; cursor:pointer;
    font-size:13px; font-weight:700; color:var(--gold-d); padding:6px 2px; pointer-events:auto;}
  .notes-toggle input{pointer-events:auto !important; width:18px !important; height:18px; accent-color:var(--gold);}
  .notes-toggle input{width:auto; min-height:auto;}
  #notesWrap{display:none; margin-top:8px;}
  #notesWrap.on{display:block; animation:fade-up .28s var(--ease-standard) both;}
  /* لوح أضيق من الجانبين */
  .drawer-panel{inset-inline:2.5% !important;}
  @media (max-width:820px){ .drawer-panel{inset-inline:0 !important;} }

  #orderDrawer{background:linear-gradient(160deg,#FFFFFF 0%,#FBF7F2 48%,#F5EDE3 100%) !important;
    border:3px solid #39FF14 !important; border-radius:0 0 18px 18px;
    box-shadow:0 0 0 4px rgba(57,255,20,.18), 0 26px 64px rgba(11,37,64,.35) !important;}
  .page-neworder .content .gv-head{background:var(--gold-d) !important; color:#fff !important;}
  .page-neworder .content .gv-head h2, .page-neworder .content .gv-head .dh-sub{color:#fff !important;}
  .page-neworder .content .card, .page-neworder .content .fbox{background:rgba(255,255,255,.92);}
  /* الأرقام بالإنجليزية في كل النموذج */
  #orderDrawer, .page-neworder .content input, .page-neworder .content select, .page-neworder .content textarea,
  .fbox input, .fbox select{font-variant-numeric:lining-nums tabular-nums;
    -moz-font-feature-settings:"lnum"; -webkit-font-feature-settings:"lnum"; font-feature-settings:"lnum";}
  .fbox input.num, .fbox input[type="number"], .fbox input[type="time"], .fbox input[type="date"]{
    direction:ltr; text-align:right; font-weight:800;}
  .fbox .dview, .fbox .tview{font-weight:800;}
  .stat-value, .kpi-v, .num-f, tbody td .badge{font-weight:800;}
  /* المربعان الجانبيان بارتفاع متساوٍ */
  .glow-card{display:flex; flex-direction:column;}
  .glow-card > table{flex:1;}
  .grid > .card.glow-card{height:100%;}
  /* ملاحظات جنبًا إلى جنب */
  .notes-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media (max-width:820px){ .notes-row{grid-template-columns:1fr;} }
  /* أزرار الحفظ بأيقونات */
  .save-bar{display:flex; gap:9px; flex-wrap:wrap; align-items:center;}
  .save-bar .btn{display:inline-flex; align-items:center; gap:7px;}

  /* ══════════ نموذج الطلب: مربعات بلا جداول ══════════ */
  .glow-card .form-table thead th{color:#fff !important;}
  .glow-card .form-table thead th .th-bar > span{color:#fff !important;}
  /* التسميات المقصوصة بلا خلفية بيضاء */
  .glow-card .form-table tbody td > label,
  .glow-card .form-table td .field > label{
    background:transparent !important; position:static !important; display:flex !important;
    align-items:center; gap:6px; margin:0 0 5px !important; padding:0 !important;
    font-size:11.5px !important; font-weight:700; color:var(--gold-d) !important; white-space:nowrap;}
  .glow-card .form-table tbody td{position:static !important; padding:0 !important; border:none !important;
    background:transparent !important;}
  /* كل حقل داخل مربع مستقل */
  .glow-card .form-table.compact tbody td{padding:0 !important;}
  .fbox{background:#fff; border:1px solid var(--line); border-radius:9px; padding:6px 9px;
    transition:border-color .25s ease, box-shadow .25s ease;}
  .fbox:focus-within{border-color:var(--gold); box-shadow:0 0 0 3px rgba(27,95,166,.12);}
  .fbox > label{display:flex; align-items:center; gap:5px; margin:0 0 3px; font-size:11px;
    font-weight:700; color:var(--gold-d); white-space:nowrap;}
  .fbox input, .fbox select, .fbox textarea{width:100%; border:none !important; background:transparent !important;
    box-shadow:none !important; padding:0 !important; min-height:22px; font-size:13px; font-weight:700;}
  .fbox .dwrap{width:100%;}
  .fbox .dview{padding:0 !important; justify-content:flex-start;}
  .fgrid{display:grid; gap:7px; margin-bottom:7px;}
  /* القائمتان جنبًا إلى جنب بلا مربعات */
  .pick-row{display:grid; grid-template-columns:1fr 1fr; gap:12px; align-items:start;}
  .pick-row .ms-wrap{border:none; background:transparent; overflow:visible;}
  .pick-row .ms-wrap .ms-head{border:1px solid var(--line); border-radius:10px; background:#fff;}
  .pick-row .ms-wrap.open .ms-head{border-color:var(--gold);}
  .pick-row .ms-body{position:relative;}
  @media (max-width:820px){ .pick-row{grid-template-columns:1fr;} }
  /* الأقسام الثلاثة ظاهرة دائمًا داخل القائمة، وبنودها تنزلق للأسفل عند الاختيار */
  .acc-card.sub{display:block; width:100%; border:none; border-top:1px solid var(--border-light);
    border-radius:0; box-shadow:none; background:#fff;}
  .acc-card.sub:first-child{border-top:none;}
  .acc-card.sub:hover{box-shadow:none;}
  .acc-card.sub .acc-head{width:100%; justify-content:space-between; padding:10px 13px; font-size:12.5px;}
  .acc-card.sub .acc-head:hover{background:var(--card-hover);}
  .acc-card.sub.open .acc-head{background:var(--gold-l); color:var(--gold-d);}
  .acc-card.sub .acc-body{max-width:0; overflow:hidden; opacity:0;
    transition:max-width .32s cubic-bezier(.22,1,.36,1), opacity .26s ease; background:var(--gold-l);}
  .acc-card.sub.open .acc-body{max-width:100%; opacity:1;}
  .acc-card.sub .acc-body{padding:8px 10px;}
  .acc-card.sub.open .acc-body{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px; max-width:100%; opacity:1;}
  .acc-card.sub .acc-item{background:#fff; border:1px solid var(--border-light); border-radius:8px;
    padding:8px 10px; margin:0; white-space:normal; line-height:1.4;}
  .acc-card.sub .acc-item:hover{border-color:var(--gold);}
  .acc-card.sub .acc-item.on{background:#fff;}

  /* ══════════ قائمة منسدلة متعددة الاختيار ══════════ */
  .ms-wrap{border:1px solid var(--line); border-radius:10px; background:#fff; overflow:hidden;
    transition:border-color .25s ease, box-shadow .25s ease;}
  .ms-wrap.open{border-color:var(--gold); box-shadow:0 4px 14px rgba(11,59,107,.10);}
  .ms-head{all:unset; cursor:pointer; display:flex; align-items:center; gap:9px; width:100%;
    box-sizing:border-box; padding:10px 12px; font-size:12.5px; font-weight:700; color:var(--main-text);
    transition:background .25s ease;}
  .ms-head:hover{background:var(--card-hover);}
  .ms-wrap.open .ms-head{background:var(--gold-l); color:var(--gold-d);}
  .ms-ic{display:flex; flex:none; color:var(--gold);}
  .ms-label{flex:1; min-width:0; text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600;}
  .ms-n{flex:none; min-width:22px; text-align:center; border-radius:999px; padding:1px 8px;
    font-size:11px; font-weight:700; background:var(--sand-200); color:var(--muted-text);}
  .ms-n.on{background:var(--gold); color:#fff;}
  .ms-chev{flex:none; color:var(--soft-text); transition:transform .28s cubic-bezier(.22,1,.36,1);}
  .ms-wrap.open .ms-chev{transform:rotate(-90deg);}
  .ms-body{max-height:0; overflow:hidden; transition:max-height .3s cubic-bezier(.22,1,.36,1);}
  .ms-wrap.open .ms-body{max-height:340px; overflow-y:auto;}
  /* عناصر المدربين داخل القائمة */
  .ms-wrap.open #trainerChipList{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:8px; padding:10px;}
  /* أقسام الطلبات داخل القائمة */
  .acc-card.sub{border:none; border-top:1px solid var(--border-light); border-radius:0; box-shadow:none;}
  .acc-card.sub:hover{border-color:var(--border-light); box-shadow:none;}
  .acc-card.sub .acc-head{padding:9px 14px; font-size:12.5px;}
  .acc-card.sub.open .acc-head{background:var(--gold-l);}
  .acc-card.sub .acc-item{padding-inline-start:26px;}

  /* ══════════ بطاقات الطلبات الإدارية القابلة للفتح ══════════ */
  .acc-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:10px; margin-bottom:12px;}
  .acc-card{border:1px solid var(--line); border-radius:12px; background:#fff; overflow:hidden;
    transition:border-color .25s ease, box-shadow .25s ease;}
  .acc-card:hover{border-color:var(--gold); box-shadow:0 4px 14px rgba(107,79,58,.10);}
  .acc-card.open{border-color:var(--gold); box-shadow:0 6px 18px rgba(107,79,58,.12);}
  .acc-head{all:unset; cursor:pointer; display:flex; align-items:center; gap:9px; width:100%;
    box-sizing:border-box; padding:12px 13px; font-size:13px; font-weight:700; color:var(--main-text);
    transition:background .25s ease;}
  .acc-head:hover{background:var(--card-hover);}
  .acc-card.open .acc-head{background:var(--gold-l); color:var(--gold-d);}
  .acc-ic{display:grid; place-items:center; width:30px; height:30px; flex:none; border-radius:9px;
    background:var(--gold-l); color:var(--gold-d);}
  .acc-card.open .acc-ic{background:#fff;}
  .acc-t{flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:right;}
  .acc-n{flex:none; min-width:22px; text-align:center; border-radius:999px; padding:1px 8px;
    font-size:11px; font-weight:700; background:var(--sand-200); color:var(--muted-text);}
  .acc-n.on{background:var(--gold); color:#fff;}
  .acc-chev{flex:none; color:var(--soft-text); transition:transform .28s cubic-bezier(.22,1,.36,1);}
  .acc-card.open .acc-chev{transform:rotate(-90deg);}
  .acc-body{max-height:0; overflow:hidden; transition:max-height .3s cubic-bezier(.22,1,.36,1);}
  .acc-card.open .acc-body{max-height:420px; overflow-y:auto;}
  .acc-item{display:flex; align-items:center; gap:9px; padding:9px 13px; cursor:pointer;
    font-size:12.5px; color:var(--main-text); border-top:1px solid var(--border-light);
    transition:background .2s ease;}
  .acc-item:hover{background:var(--card-hover);}
  .acc-item.on{background:var(--gold-l); color:var(--gold-d); font-weight:700;}
  .acc-item input{width:auto; flex:none; min-height:auto;}
  .acc-item span{flex:1; min-width:0;}

  /* وسوم الطلبات الإدارية المضافة */
  .req-tag{display:inline-flex; align-items:center; gap:7px; background:var(--maroon-50);
    border:1px solid var(--maroon-100); color:var(--maroon-800); border-radius:20px;
    padding:5px 12px; font-size:13px; font-weight:700;}
  .req-tag a{text-decoration:none; font-size:13px; line-height:1; opacity:.75;}
  .req-tag a:hover{opacity:1;}
  /* أيقونات الجداول أصغر ومتناسقة داخل الصف */
  .orders-page table .icon-btn{width:24px; height:24px; font-size:12px; padding:0; line-height:1;
    border-radius:6px; vertical-align:middle;}
  .orders-page table td{white-space:nowrap;}

  .glow-card .form-table .dwrap{position:relative; display:block; width:100%; min-width:150px;}
  .glow-card .form-table input[type="date"]{width:100%; min-width:150px; box-sizing:border-box;
    padding-inline-start:11px; padding-inline-end:34px;}
  /* نص التاريخ متوسط داخل المربع ولا يخرج منه */
  .glow-card .form-table .dview{
    inset:0; display:flex; align-items:center; justify-content:center;
    padding-inline-start:11px; padding-inline-end:34px; text-align:center;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  /* إخفاء سطر توضيح التاريخ في هذه الصفحة (النقطة والشريط يغنيان عنه) */
  .glow-card .date-hint{display:none !important;}
  /* مربعات مرنة: تتقلّص إن لم يكن فيها مدخلات */
  .glow-card .form-table.compact tbody td{width:1%; white-space:nowrap;}
  .glow-card .form-table.compact tbody td:has(input[type="text"]),
  .glow-card .form-table.compact tbody td[colspan]{width:auto;}
  .glow-card .form-table .auto-w{width:auto; min-width:0;}
  .glow-card .form-table .auto-w.num{width:86px;}
  .glow-card .form-table select{width:auto; min-width:130px; max-width:100%;}
  /* تقليص إضافي للمسافات الرأسية */
  .glow-card .form-table.compact tbody tr + tr td{padding-top:7px;}
  .glow-card .helper{display:none;}
  .glow-card .form-table:not(.compact) tbody td textarea{min-height:56px;}

  .glow-card .form-table.compact tbody td{padding:8px 5px 2px; vertical-align:top;}
  .glow-card .form-table tbody td > label{
    position:absolute; top:-8px; right:12px; z-index:2;
    background:#fff; padding:0 6px; margin:0;
    font-size:11px !important; font-weight:700; color:var(--maroon-800);
    line-height:1.1; white-space:nowrap; pointer-events:none;}
  /* كل خلية تصبح مرجعًا للتموضع */
  .glow-card .form-table tbody td{position:relative;}
  /* الحقل نفسه بإطار واضح ليظهر القص */
  .glow-card .form-table input,
  .glow-card .form-table select,
  .glow-card .form-table textarea{
    border:1px solid var(--line-strong); border-radius:10px; min-height:40px; padding:7px 11px;}
  .glow-card .form-table .dwrap{display:block; width:100%;}
  .glow-card .form-table .dview{padding-inline-start:11px;}
  /* تقليل المسافات بين الأسطر */
  .glow-card .form-table.compact tbody tr + tr td{padding-top:11px;}
  .glow-card .grid{gap:8px; margin-bottom:8px;}
  .glow-card .field{margin-bottom:0;}
  /* بطاقتا الملاحظات والطلبات الإدارية بنفس النمط */
  .glow-card .form-table:not(.compact) tbody td{position:relative; padding:14px 10px 8px;}
  .glow-card .form-table:not(.compact) tbody td textarea{min-height:70px; resize:vertical;}
  /* الحقول المرنة داخل الصف الأول */
  .glow-card .form-table td .field{position:relative; padding-top:2px;}
  .glow-card .form-table td .field > label{
    position:absolute; top:-8px; right:12px; background:#fff; padding:0 6px;
    font-size:12px !important; font-weight:700; color:var(--maroon-800); line-height:1.1; white-space:nowrap;}

  .glow-card .form-table thead th,
  .glow-card .form-table thead th .th-bar > span{font-size:15px;}
  .glow-card .form-table tbody td label{font-size:12px;}
  .glow-card input, .glow-card select, .glow-card textarea{font-size:13px; padding:9px 11px;}
  .glow-card .checkbox-chip, .glow-card .presenter-chip{font-size:12.5px;}
  .glow-card .form-table tbody td{font-size:13px;}
  /* تبقى الأدوات الصغيرة بحجمها حتى لا يختل الشريط العلوي للقسم */
  .glow-card .th-actions .plus-btn.mini,
  .glow-card .th-actions .th-search{font-size:12px;}
  .glow-card .helper{font-size:12.5px;}
  .glow-card .date-hint{font-size:12px;}

  /* ══ مدخلات نموذج الفعالية: أسود غامق ══ */
  .glow-card input, .glow-card select, .glow-card textarea{color:#1C323B !important; font-weight:700;}
  .glow-card select option{color:#3E2C22;}
  /* التاريخ بخط Lusail (يعود لبديل مناسب إن لم يكن مثبّتًا) */
  input[type="date"], input[type="month"], .date-cell, .num-f{
    font-family:'IBM Plex Sans Arabic','Tajawal',Arial, sans-serif;}
  .glow-card input[type="date"], .glow-card input[type="month"]{color:#000 !important; font-weight:700;}

  /* ══ الإداريات اليومية والأنشطة القرآنية: مدخلات بحجم 18 ══ */
  .big-inputs input, .big-inputs select, .big-inputs textarea{font-size:13px; color:var(--ink); min-height:40px;}
  .big-inputs label{font-size:12px;}
  .big-inputs table{font-size:13px;}
  .big-inputs table th{font-size:12px;}
  .big-inputs .helper{font-size:13px;}
  .big-inputs .icon-btn.rect, .big-inputs .btn{font-size:12px;}

  /* ══ صفحات النظام: أزرق فاتح، وتتحول للعنابي عند النقر، والنص أسود ══ */
  .card{background:#EAF4FC;}                 /* لوح الصفحة أزرق فاتح */
  .card h2{background:#DCEBF8; color:#000;}  /* عنوان اللوح */
  .card.is-active{background:var(--maroon-50); box-shadow:0 0 0 2px var(--maroon-800) inset;}
  .card.is-active h2{background:var(--maroon-800); color:#fff;}
  .content, .card, .card td, .card th, .card label, .card p, .card div{color:#000;}
  .card input, .card select, .card textarea{background:#fff; color:#000;}
  /* الجداول */
  thead th{background:#DCEBF8 !important; color:#000 !important;}
  tbody td{color:#000;}
  tbody tr:hover{background:#DCEBF8;}
  /* الأوراق الفرعية أزرق فاتح، والنشطة عنابي */
  .sv-item{background:#EAF4FC; border-color:#BBD9F0; color:#000;}
  .sv-item:hover{background:#DCEBF8;}
  .sv-item.active{background:var(--maroon-800); color:#fff; border-color:var(--maroon-800);}
  /* مربعات الإحصائيات */
  .stat-box{background:#EAF4FC;}
  .stat-box .num{color:#000;}
  .stat-box .lbl{color:#333;}
  .stat-box .ic{background:#DCEBF8; border-color:#BBD9F0;}

  /* ══ بطاقة اختيار التقرير: عنوان كبير وأسفله مربعا التاريخ ══ */
  /* عمود الفترة: نصفان متساويان (البداية | النهاية) */
  .prd{display:flex; align-items:stretch; width:100%;}
  .prd-a, .prd-b{flex:1 1 50%; text-align:center; white-space:nowrap; padding:0 4px;}
  .prd-a{border-inline-end:1px solid var(--line);}
  .rep-doc .prd-a{border-inline-end:1px solid ${PRINT_LINE_COLOR};}
  th .prd-a, th .prd-b{font-weight:700;}

  /* ══ أسلوب البطاقات الناعم (مستوحى من التصميم المرجعي) ══ */
  /* ══════════ القائمة الجانبية — كحلي داكن، عنصر نشط بارز نصف دائري ══════════ */
  #app.sidenav-layout{display:flex; min-height:100vh; width:100%; max-width:100%; background:#F8FAFC;}
  #sideNav{width:80px; flex:0 0 80px; background:var(--brand-950); color:#fff; font-family:'Tajawal',sans-serif; position:sticky; top:0; height:100vh;
    display:flex; flex-direction:column; overflow:visible; transition:width .22s ease, flex-basis .22s ease; z-index:40;}
  body.nav-open #sideNav{width:276px; flex-basis:276px;}
  #sideNav .nav-text, #sideNav .sn-name, #sideNav .sn-sub, #sideNav .sn-uname, #sideNav .sn-role{
    opacity:0; max-width:0; overflow:hidden; white-space:nowrap; transition:opacity .18s, max-width .22s;}
  body.nav-open #sideNav .nav-text, body.nav-open #sideNav .sn-name, body.nav-open #sideNav .sn-sub,
  body.nav-open #sideNav .sn-uname, body.nav-open #sideNav .sn-role{opacity:1; max-width:170px;}
  #mainCol{flex:1; min-width:0; display:flex; flex-direction:column; background:#F8FAFC;}

  .sn-brand{text-align:center; padding:16px 8px 12px; border-bottom:1px solid rgba(255,255,255,.08);}
  .sn-brand #logoSlot img{height:38px; width:auto; margin:0 auto 6px; display:block;}
  .sn-brand .logo-placeholder{font-size:26px; color:var(--brand-300);}
  .sn-name{font-size:13px; font-weight:700; color:#fff; margin:0 auto; font-family:var(--font-head);}
  .sn-sub{font-size:10.5px; color:rgba(255,255,255,.5); margin:2px auto 0;}
  .sn-user{text-align:center; padding:12px 8px; border-bottom:1px solid rgba(255,255,255,.08);}
  .sn-uname{font-size:12px; font-weight:700; color:#fff; margin:0 auto;}
  .sn-role{font-size:10.5px; color:var(--brand-300); margin:2px auto 0;}

  .sn-list{flex:1; padding:12px 0; display:flex; flex-direction:column; gap:6px; overflow-y:auto; overflow-x:visible;}
  .sn-item{all:unset; cursor:pointer; position:relative; display:flex; align-items:center; gap:12px; font-size:12.5px; font-family:var(--font-body);
    margin:0 0 0 10px; padding:12px 0 12px 0; padding-inline-start:22px;
    border-radius:30px 0 0 30px; color:rgba(255,255,255,.72);
    transition:background .16s, color .16s, transform .16s;}
  .sn-item:hover{background:rgba(255,255,255,.07); color:#fff;}
  /* العنصر النشط: بارز خارج القائمة بنصف دائرة، عنابي بإطار ذهبي */
  .sn-item.active{background:#0F6248; color:#fff; font-weight:700;
    border:2px solid var(--brand-300); border-inline-end:none; margin-inline-end:-14px; padding-inline-end:14px;
    box-shadow:0 4px 14px rgba(11,111,80,.40);}
  .sn-ic{font-size:19px; line-height:1; width:26px; text-align:center; flex:none;}
