  function partsFromPages(pages){
    // كل 20 صفحة = جزء، مع احتساب حتى الربع والنصف جزء (تقريب لأقرب 0.25)
    return Math.round((pages/20)*4)/4;
  }
  function recalc(){
    const memPages = Number(document.getElementById('qa_memPages').value)||0;
    const revPages = Number(document.getElementById('qa_revPages').value)||0;
    const target = Number(document.getElementById('qa_target').value)||0;
    const memParts = partsFromPages(memPages);
    const revParts = partsFromPages(revPages);
    document.getElementById('qa_memParts').value = String(memParts);
    document.getElementById('qa_revParts').value = String(revParts);
    const achieved = memParts + revParts;
    document.getElementById('qa_achieved').value = String(achieved);
    const pct = target>0 ? Math.round((achieved/target)*1000)/10 : 0;
    document.getElementById('qa_pct').value = String(pct);
  }
  ['qa_memPages','qa_revPages','qa_target'].forEach(id=>document.getElementById(id).addEventListener('input', recalc));
  recalc();

  if(editing) document.getElementById('qa_cancelEdit').onclick=()=>{editingQuranId=null; render();};

  document.getElementById('qa_save').onclick=async ()=>{
    const programName=document.getElementById('qa_program').value;
    const month=document.getElementById('qa_month').value;
    if(!month){ toast('يرجى تحديد الشهر'); return; }
    recalc();
    const data = {
      programName, month,
      dateFrom:document.getElementById('qa_from').value,
      dateTo:document.getElementById('qa_to').value,
      execDays:Number(document.getElementById('qa_days').value)||0,
      method:document.getElementById('qa_method').value,
      teachersCount:Number(document.getElementById('qa_teachers').value)||0,
      studentsCount:Number(document.getElementById('qa_students').value)||0,
      memPages:Number(document.getElementById('qa_memPages').value)||0,
      memParts:Number(document.getElementById('qa_memParts').value)||0,
      revPages:Number(document.getElementById('qa_revPages').value)||0,
      revParts:Number(document.getElementById('qa_revParts').value)||0,
      monthlyTarget:Number(document.getElementById('qa_target').value)||0,
      completionPct:Number(document.getElementById('qa_pct').value)||0,
    };
    if(editing){
      Object.assign(editing, data);
      await saveState(); toast('تم حفظ التعديلات'); editingQuranId=null; render();
      return;
    }
    const dup = state.quranActivities.find(x=>x.programName===programName && x.month===month);
    if(dup){
      const ok = confirm(`يوجد سجل مسبق لبرنامج "${programName}" لشهر ${month}. هل تريد استبدال بياناته؟`);
      if(!ok) return;
      Object.assign(dup, data);
      await saveState(); toast('تم تحديث السجل الموجود'); render();
      return;
    }
    state.quranActivities.push({id:uid(), ...data, createdAt:Date.now()});
    await saveState(); toast('تم حفظ البيانات'); render();
  };
}

function renderQuranReportTab(sub){
  sub.innerHTML = `<div class="card">
    <h2>تقرير الأنشطة القرآنية</h2>
    <div class="fgrid">
      <div class="fbox"><label>${icon('bookOpen',13)} البرنامج</label>
        <select id="qr_program"><option value="">الكل</option><option value="روح">روح</option><option value="الرحيق">الرحيق</option></select></div>
      <div class="fbox"><label>${icon('calendar',13)} نوع التصفية</label>
        <select id="qr_mode">
          <option value="">الكل</option>
          <option value="month">شهر محدد</option>
          <option value="range">من شهر إلى شهر</option>
          <option value="dates">من تاريخ إلى تاريخ</option>
        </select></div>
      <div class="fbox" id="qr_monthBox" style="display:none;"><label>${icon('calendar',13)} الشهر</label>
        <input id="qr_month" type="month" lang="en-GB"></div>
      <div class="fbox" id="qr_fromBox" style="display:none;"><label>${icon('calendar',13)} من شهر</label>
        <input id="qr_from" type="month" lang="en-GB"></div>
      <div class="fbox" id="qr_toBox" style="display:none;"><label>${icon('calendar',13)} إلى شهر</label>
        <input id="qr_to" type="month" lang="en-GB"></div>
      <div class="fbox" id="qr_dFromBox" style="display:none;"><label>${icon('calendar',13)} من تاريخ</label>
        <input id="qr_dFrom" type="date" lang="en-GB"></div>
      <div class="fbox" id="qr_dToBox" style="display:none;"><label>${icon('calendar',13)} إلى تاريخ</label>
        <input id="qr_dTo" type="date" lang="en-GB"></div>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:nowrap;align-items:center;">
      <button class="btn btn-primary" id="qr_go" style="font-size:11.5px;padding:7px 13px;">${icon('barChart',14)} عرض</button>
      <button class="icon-btn" id="qr_print" title="طباعة" aria-label="طباعة" style="width:28px;height:28px;padding:0;">${icon('printer',14)}</button>
      <button class="icon-btn" id="qr_pdf" title="تنزيل PDF" aria-label="تنزيل PDF" style="width:28px;height:28px;padding:0;">${icon('download',14)}</button>
      <button class="icon-btn" id="qr_excel" title="تنزيل Excel" aria-label="تنزيل Excel" style="width:28px;height:28px;padding:0;">${icon('sheet',14)}</button>
    </div>
  </div>`;
  /* الخيارات والنتيجة جنبًا إلى جنب */
  const _wrap = document.createElement('div'); _wrap.className='rep-split';
  const _opts = sub.firstElementChild;
  const _res  = document.createElement('div'); _res.className='card'; _res.id='qr_result';
  sub.innerHTML=''; _wrap.appendChild(_opts); _wrap.appendChild(_res); sub.appendChild(_wrap);

  /* إظهار حقول التصفية حسب النوع المختار فقط */
  const qrMode = document.getElementById('qr_mode');
  function syncQrMode(){
    const v = qrMode.value;
    const show = (id, on)=>{ const el=document.getElementById(id); if(el) el.style.display = on ? '' : 'none'; };
    show('qr_monthBox', v==='month');
    show('qr_fromBox',  v==='range');
    show('qr_toBox',    v==='range');
    show('qr_dFromBox', v==='dates');
    show('qr_dToBox',   v==='dates');
    if(v!=='month')  document.getElementById('qr_month').value='';
    if(v!=='range'){ document.getElementById('qr_from').value=''; document.getElementById('qr_to').value=''; }
    if(v!=='dates'){ document.getElementById('qr_dFrom').value=''; document.getElementById('qr_dTo').value=''; }
  }
  qrMode.addEventListener('change', ()=>{ syncQrMode(); document.getElementById('qr_go').click(); });
  syncQrMode();
  function getList(){
    const program=document.getElementById('qr_program').value;
    const month=document.getElementById('qr_month').value;
    const from=document.getElementById('qr_from').value;
    const to=document.getElementById('qr_to').value;
    const dFrom=document.getElementById('qr_dFrom').value;
    const dTo=document.getElementById('qr_dTo').value;
    return state.quranActivities.filter(x=>{
        if(program && x.programName!==program) return false;
        if(month && x.month!==month) return false;
        if(from && (x.month||'')<from) return false;
        if(to && (x.month||'')>to) return false;
        // تصفية بالتاريخ: يُقبل السجل إذا تقاطعت فترته مع الفترة المطلوبة
        if(dFrom || dTo){
          const s = x.dateFrom || x.dateTo || '';
          const e = x.dateTo || x.dateFrom || '';
          if(!s && !e) return false;
          if(dFrom && e && e < dFrom) return false;
          if(dTo && s && s > dTo) return false;
        }
        return true;
      })
      .sort((a,b)=> a.month.localeCompare(b.month) || a.programName.localeCompare(b.programName));
  }
  function totalsOf(list){
    const t = list.reduce((t,x)=>({
      memPages:t.memPages+x.memPages, memParts:t.memParts+x.memParts,
      revPages:t.revPages+x.revPages, revParts:t.revParts+x.revParts,
      execDays:t.execDays+x.execDays, pctSum:t.pctSum+x.completionPct
    }), {memPages:0,memParts:0,revPages:0,revParts:0,execDays:0,pctSum:0});

    /* المعلمون والطلاب أشخاص يتكررون كل شهر، فجمعهم شهريًا يضاعف نفس الأشخاص.
       نحتسب بدلاً من ذلك أعلى عدد سُجّل لكل برنامج خلال الفترة (يمثّل حجم المجموعة
       الفعلي دون تأثّر بغياب شهر معيّن)، ثم نجمع البرامج المختلفة معًا. */
    const maxByProgram = {};
    list.forEach(x=>{
      const p = x.programName || '';
      if(!maxByProgram[p]) maxByProgram[p] = {teachers:0, students:0};
      maxByProgram[p].teachers = Math.max(maxByProgram[p].teachers, x.teachersCount||0);
      maxByProgram[p].students = Math.max(maxByProgram[p].students, x.studentsCount||0);
    });
    t.teachersCount = Object.values(maxByProgram).reduce((s,v)=>s+v.teachers, 0);
    t.studentsCount = Object.values(maxByProgram).reduce((s,v)=>s+v.students, 0);
    return t;
  }
  function draw(){
    const list = getList();
    const t = totalsOf(list);
    const avgPct = list.length ? (t.pctSum/list.length).toFixed(1) : '0';

/* استنساخ سجل نشاط قرآني بنفس بياناته مع تغيير الشهر فقط */
function cloneQuranRecord(id){
  const src = state.quranActivities.find(x=>x.id===id);
  if(!src){ toast('السجل غير موجود'); return; }
  /* الشهر التالي كقيمة مقترحة */
  let suggest = src.month || '';
  if(/^\d{4}-\d{2}$/.test(suggest)){
    const [y,m] = suggest.split('-').map(Number);
    const d = new Date(y, m, 1);   // m هنا يعني الشهر التالي (0-based)
    suggest = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  }
  openModal(`استنساخ سجل: ${src.programName}`, [
    {name:'month', label:'الشهر الجديد', type:'month', placeholder:'YYYY-MM'},
    {name:'dateFrom', label:'من تاريخ (اختياري)', type:'date'},
    {name:'dateTo', label:'إلى تاريخ (اختياري)', type:'date'},
  ], async v=>{
    const mo = (v.month||'').trim();
    if(!/^\d{4}-\d{2}$/.test(mo)){ toast('أدخل الشهر بصيغة صحيحة'); return false; }
    if(state.quranActivities.some(x=>x.programName===src.programName && x.month===mo)){
      if(!confirm(`يوجد سجل لبرنامج "${src.programName}" في ${monthNameAr(mo)}.\nهل تريد إضافة سجل آخر؟`)) return false;
    }
    const copy = Object.assign({}, src, {
      id: uid(),
      month: mo,
      dateFrom: v.dateFrom || '',
      dateTo: v.dateTo || '',
      createdAt: Date.now()
    });
    state.quranActivities.push(copy);
    await saveState();
    toast(`تم استنساخ السجل إلى ${monthNameAr(mo)}`);
    render();
  });
  const mEl = document.getElementById('mf_month'); if(mEl && suggest) mEl.value = suggest;
}
async function deleteQuranRecord(id){
  if(!confirm('هل تريد حذف هذا السجل؟')) return;
  state.quranActivities = state.quranActivities.filter(x=>x.id!==id);
  await saveState(); renderKeepForm();
}

  function drawPeriodSum(){

        <button class="icon-btn" id="ps_excel" title="تنزيل Excel" aria-label="تنزيل Excel" style="width:28px;height:28px;padding:0;">${icon('sheet',14)}</button>
      </div>
      <div id="ps_result" style="margin-top:14px;"></div>
    </div>`;

    const MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
    function keyOf(iso, g){
      if(!iso) return '—';
      const y = iso.slice(0,4), m = Number(iso.slice(5,7)), d = Number(iso.slice(8,10));
      if(g==='year')    return y;
      if(g==='quarter') return `${y} — الربع ${Math.ceil(m/3)}`;
      if(g==='month')   return `${MONTHS[m-1]} ${y}`;
      if(g==='week'){
        const dt = new Date(iso+'T00:00:00');
        const day = dt.getDay();                 // الأحد = 0 (بداية الأسبوع)
        const s = addDaysISO(iso, -day), e = addDaysISO(s, 6);
        return `${fmtDate(s)} — ${fmtDate(e)}`;
      }
      return fmtDate(iso);
    }
    function sortKey(iso, g){
      if(!iso) return 'zzz';
      if(g==='week'){ const dt=new Date(iso+'T00:00:00'); return addDaysISO(iso, -dt.getDay()); }
      if(g==='month')   return iso.slice(0,7);
      if(g==='quarter') return `${iso.slice(0,4)}-Q${Math.ceil(Number(iso.slice(5,7))/3)}`;
      if(g==='year')    return iso.slice(0,4);
      return iso;
    }
    function gather(){
      const from = document.getElementById('ps_from').value;
      const to   = document.getElementById('ps_to').value;
      const g    = document.getElementById('ps_group').value;
      const list = (state.orders||[]).filter(o=>{
        const s=o.date||''; if(!s) return false;
        const e=orderEnd(o);
        if(from && e<from) return false;
        if(to && s>to) return false;
        return true;
      });
      const map = new Map();
      list.forEach(o=>{
        const k = keyOf(o.date, g), sk = sortKey(o.date, g);
        if(!map.has(k)) map.set(k, {k, sk, n:0, days:0, hours:0, people:0,
          reqs:0, schools:new Set(), trainers:new Set(), done:0, cancelled:0, postponed:0, items:[]});
        const r = map.get(k);
        r.n++; r.items.push(o);
        r.days   += daysCount(o.date, o.dateTo);
        r.hours  += computeHours(o.timeFrom, o.timeTo, o.date, o.dateTo);
        r.people += Number(o.participantsCount)||0;
        r.reqs   += (o.adminRequests||[]).length;
        if(o.schoolId) r.schools.add(o.schoolId);
        (o.trainerIds||[]).forEach(t=>r.trainers.add(t));
        if(o.completionStatus==='تم') r.done++;
        if(o.status==='cancelled') r.cancelled++;
        if(o.status==='postponed') r.postponed++;
      });
      const rows = Array.from(map.values()).sort((a,b)=>a.sk.localeCompare(b.sk));
      rows.forEach(r=>{ r.hours = Math.round(r.hours*10)/10; });
      const tot = rows.reduce((a,r)=>({
        n:a.n+r.n, days:a.days+r.days, hours:a.hours+r.hours, people:a.people+r.people,
        reqs:a.reqs+r.reqs, done:a.done+r.done, cancelled:a.cancelled+r.cancelled, postponed:a.postponed+r.postponed
      }), {n:0,days:0,hours:0,people:0,reqs:0,done:0,cancelled:0,postponed:0});
      tot.hours = Math.round(tot.hours*10)/10;
      tot.schools  = new Set(list.map(o=>o.schoolId).filter(Boolean)).size;
      tot.trainers = new Set(list.flatMap(o=>o.trainerIds||[])).size;
      return {rows, tot, from, to, g, list};
    }
    const HDR = ['الفترة','الفعاليات','الأيام','الساعات','المستهدفون','الطلبات الإدارية','الجهات','المنفذون','منجزة','مؤجلة','ملغاة','أماكن التنفيذ الفعلية'];
    function rowsOf(d){ return d.rows.map(r=>[r.k, r.n, r.days, r.hours, r.people, r.reqs,
      r.schools.size, r.trainers.size, r.done, r.postponed, r.cancelled, venuesSummaryText(r.items)]); }
    function render(){
      const d = gather();
      const el = document.getElementById('ps_result');
      if(!d.rows.length){ el.innerHTML = `<div class="empty-state">لا توجد فعاليات ضمن هذه الفترة</div>`; return; }

             ['users','المستهدفون',d.tot.people],['clipboard','طلبات إدارية',d.tot.reqs],
             ['school','الجهات',d.tot.schools],['users','المنفذون',d.tot.trainers],['checkCircle','منجزة',d.tot.done]]
            .map(([ic,l,v])=>`<div style="background:#fff;border:1px solid var(--border-c);border-radius:12px;padding:11px;text-align:center;">

  /* ══════════════════════════════════════════════════════════════════
     أكثر البرامج طلبًا — حسب المجال والمسار والعناوين
     العناوين تُجمَّع بتشابه دلالي (تطبيع عربي + تجذيع خفيف + Jaccard)
     ══════════════════════════════════════════════════════════════════ */
  function arNorm(s){
    return String(s||'')
      .replace(/[\u064B-\u0652\u0670\u0640]/g,'')          // تشكيل وتطويل
      .replace(/[أإآا]/g,'ا').replace(/[ىي]/g,'ي')
      .replace(/ة/g,'ه').replace(/[ؤئء]/g,'ء')
      .replace(/[^\u0600-\u06FF0-9a-zA-Z ]/g,' ')
      .replace(/\s+/g,' ').trim().toLowerCase();
  }
  function arStem(w){
    w = w.replace(/^(وال|بال|كال|فال|ال|و|ف|ب|ك|ل)/,'');
    w = w.replace(/(اتها|اتهم|تها|هما|كما|ونها|انها|ات|ون|ين|ان|ها|هم|كم|نا|ية|ي|ه|ا)$/,'');
    return w;
  }
  const AR_STOP = new Set(['في','من','علي','عن','الي','مع','و','هذا','هذه','التي','الذي','ما',
    'برنامج','فعاليه','مبادره','دوره','ورشه','يوم','حول','بين','كل']);
  function titleTokens(s){
    return [...new Set(arNorm(s).split(' ').map(arStem).filter(w=>w.length>2 && !AR_STOP.has(w)))];
  }
  function simRatio(a,b){
    const A=new Set(titleTokens(a)), B=new Set(titleTokens(b));
    if(!A.size || !B.size) return 0;
    let inter=0; A.forEach(x=>{ if(B.has(x)) inter++; });
    return inter/(A.size + B.size - inter);
  }
  function drawTopPrograms(){
    const box = document.getElementById('reportContent');
    box.innerHTML = `<div class="card">

          <select id="tp_sim">
            <option value="0.75">دقيق (تشابه عالٍ)</option>
            <option value="0.55" selected>متوازن</option>
            <option value="0.40">واسع (يجمع أكثر)</option>
          </select></div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">
        <button class="btn btn-primary" id="tp_go">${icon('barChart',14)} عرض</button>

        <button class="icon-btn" id="tp_excel" title="تنزيل Excel" aria-label="تنزيل Excel" style="width:28px;height:28px;padding:0;">${icon('sheet',14)}</button>
      </div>
      <div id="tp_result" style="margin-top:14px;"></div>
    </div>`;

    function gather(){
      const from = document.getElementById('tp_from').value;
      const to   = document.getElementById('tp_to').value;
      const TH   = parseFloat(document.getElementById('tp_sim').value);
      const list = (state.orders||[]).filter(o=>{
        if((o.status||'active')==='cancelled') return false;
        const s=o.date||'', e=orderEnd(o);
        if(from && e && e<from) return false;
        if(to && s && s>to) return false;
        return !!s;
      });
      const total = list.length;
      /* حسب المجال */
      const byField = (state.fields||[]).map(f=>({
        name:f.name, n:list.filter(o=>o.fieldId===f.id).length
      })).filter(x=>x.n).sort((a,b)=>b.n-a.n);
      /* حسب المسار */
      const byPath = (state.programTypes||[]).map(p=>({
        name:p.name, n:list.filter(o=>o.programTypeId===p.id).length
      })).filter(x=>x.n).sort((a,b)=>b.n-a.n);
      /* تجميع العناوين المتشابهة */
      const groups = [];
      list.forEach(o=>{
        const t = (o.title||'').trim(); if(!t) return;
        let g = groups.find(x => simRatio(x.rep, t) >= TH);
        if(!g){ g = {rep:t, items:[], variants:new Set()}; groups.push(g); }
        g.items.push(o); g.variants.add(t);
        /* العنوان الممثِّل = الأكثر تكرارًا */
        if(t.length < g.rep.length) g.rep = t;
      });
      groups.forEach(g=>{
        g.n = g.items.length;
        g.variantList = Array.from(g.variants);
        g.schools = new Set(g.items.map(x=>x.schoolId).filter(Boolean)).size;
        g.hours = Math.round(g.items.reduce((s,x)=>s+computeHours(x.timeFrom,x.timeTo,x.date,x.dateTo),0)*10)/10;
        g.people = g.items.reduce((s,x)=>s+(Number(x.participantsCount)||0),0);
        const fd = state.fields.find(f=>f.id===g.items[0].fieldId);
        g.field = fd ? fd.name : '—';
      });
      groups.sort((a,b)=>b.n-a.n);
      return {list, total, byField, byPath, groups, from, to, TH};
    }

            <tbody>${d.byPath.map(x=>barRow(x.name,x.n,maxP,d.total)).join('')}</tbody></table></div>

        <div class="card"><h2>أكثر العناوين طلبًا — بعد دمج المتشابهة</h2>
          <div class="helper" style="margin-bottom:9px;">

                ${g.variantList.length>1?`<div class="helper" style="font-size:10.5px;">${

        </div>`;
      enhanceReportTable(el);
    }
    document.getElementById('tp_go').onclick = render;
    ['tp_from','tp_to','tp_sim'].forEach(id=>document.getElementById(id).addEventListener('change', render));

    const HDR = ['#','العنوان','المجال','الطلبات','الجهات','الساعات','المستهدفون','عدد الصيغ'];
    function rowsOf(d){ return d.groups.map((g,i)=>[i+1,g.rep,g.field,g.n,g.schools,g.hours,g.people,g.variantList.length]); }
    function printIt(){

    const HOST = 'في مقر الجهة الطالبة';
    const SUM_COLS = ['مكان التنفيذ','الفعاليات','الأيام','الساعات','المستهدفون','عدد الجهات','عدد المقدّمين'];

    const detRowTxt = o => {
      const sc = (state.schools||[]).find(x=>x.id===o.schoolId);
      return [ o.serial||'', o.title||'',
        fmtDate(o.date) + (orderEnd(o)!==o.date ? ' — '+fmtDate(orderEnd(o)) : ''),
        fullTimeRange(o.timeFrom,o.timeTo)||'', sc?sc.name:'', trainerNames(o),
        o.participantsCount||'',
        (o.status||'active')==='cancelled' ? 'ملغاة' : (o.completionStatus||'لم تنجز') ];
    };

    function sumTable(groups, tot){
      const body = groups.map(g=>({ cells:sumRow(g), tdAttr:{0:' style="text-align:right;font-weight:700;"'} }));
      body.push({ cells:sumRow(tot), rowAttr:' style="background:#FAF9F7;font-weight:700;"',
        tdAttr:{0:' style="text-align:right;"'} });
      return repTableHtml(SUM_COLS, body, {colWidths:SUM_W});
    }
    const gHead = g => `${escapeHtml(g.venue)} <span class="vn-gn">— ${g.events} ${eventWord(g.events)}`
      + ` · ${g.days} ${dayWord(g.days)} · ${g.people} مستهدف</span>`;

    function bodyHtml(groups, tot){
      const wantSum = document.getElementById('vn_summary').checked;
      const wantDet = document.getElementById('vn_detail').checked;
      /* إن أُلغي الخياران معًا نعرض الملخّص — التقرير الفارغ بلا معنى */
      const sum = wantSum || !wantDet;
      return (sum ? `<div class="sec-t">ملخّص أماكن التنفيذ</div>` + sumTable(groups, tot) : '')
        + (wantDet ? groups.map(g=>`<div class="sec-t vn-sec">${gHead(g)}</div>`
            + repTableHtml(DET_COLS, g.list.map(detRow))).join('') : '');
    }

    const EMPTY = 'لا توجد فعاليات بمكان تنفيذ فعلي ضمن هذه الفترة';
    document.getElementById('vn_go').onclick=()=>{
      const {groups, tot} = gen();
      const b = document.getElementById('vn_result');
      if(!groups.length){ b.innerHTML = `<div class="empty-state">${EMPTY}</div>`; return; }
      b.innerHTML = bodyHtml(groups, tot);
      enhanceReportTable(b);
    };

    function printIt(){
      const {groups, tot, from, to} = gen();
      if(!groups.length){ toast(EMPTY); return; }
      doPrintDoc(buildReportDoc({
        titleAr:'فعاليات مكان التنفيذ الفعلي',
        subtitle:`من ${from?fmtDate(from):'—'} إلى ${to?fmtDate(to):'—'}`
          + (groups.length>1 ? ` · ${groups.length} أماكن تنفيذ` : ''),
        kpis:[
          {v:groups.length, l:'🏛️ أماكن التنفيذ'},
          {v:tot.events,    l:'📋 الفعاليات'},
          {v:tot.days,      l:'🗓️ الأيام'},
          {v:tot.people,    l:'👥 المستهدفون'},
        ],
        extraHtml: bodyHtml(groups, tot)
      }), true, 'A4');
    }
    document.getElementById('vn_print').onclick = printIt;
    document.getElementById('vn_pdf').onclick   = printIt;

    document.getElementById('vn_excel').onclick=()=>{
      const {groups, tot, from, to} = gen();
      if(!groups.length){ toast(EMPTY); return; }
      /* ورقة للملخّص وورقة لكل مكان — أسماء الأوراق في Excel ٣١ حرفًا بحد أقصى */
      const used = new Set();
      const sheetName = v=>{
        let n = String(v).replace(/[\\\/\?\*\[\]:]/g,' ').trim().slice(0,28) || 'مكان';
        let i=2, base=n; while(used.has(n)){ n = base.slice(0,26)+' '+i; i++; }
        used.add(n); return n;
      };
      used.add('ملخّص الأماكن');
      const sheets = [{ name:'ملخّص الأماكن', headers:SUM_COLS,
          rows: groups.map(sumRow).concat([sumRow(tot)]) }]
        .concat(groups.map(g=>({ name:sheetName(g.venue),
          headers:DET_COLS, rows:g.list.map(detRowTxt) })));
      exportToExcelMultiSheet('فعاليات_مكان_التنفيذ.xlsx', sheets,
        `فعاليات مكان التنفيذ الفعلي (من ${from?fmtDate(from):'—'} إلى ${to?fmtDate(to):'—'})`);
    };

    /* «كل الأماكن» والتحديد المفرد يتنافيان */
    const allChk = document.getElementById('vn_all');
    const chks = [...box.querySelectorAll('.vn-chk')];
    const refresh = ()=>document.getElementById('vn_go').click();
    if(allChk) allChk.onchange = ()=>{
      if(allChk.checked) chks.forEach(x=>{ x.checked=false; });
      else if(!picked().length) allChk.checked = true;   /* لا بد من مرجع واحد */
      refresh();
    };
    chks.forEach(x=>{ x.onchange = ()=>{
      if(allChk) allChk.checked = !picked().length;
      refresh();
    }; });
    ['vn_from','vn_to','vn_detail','vn_summary','vn_host','vn_cancel']
      .forEach(id=>{ const el=document.getElementById(id); if(el) el.addEventListener('change', refresh); });
    refresh();
  }
  function drawFieldSummary(){
    const box=document.getElementById('reportContent');
    box.innerHTML = `<div class="card">
      <h2>تقرير مجال المبادرة</h2>
      <div class="rp-dates" style="margin-bottom:12px;">
        <div class="rp-date"><label>من تاريخ</label><input id="fs_from" type="date" lang="en-GB"></div>
        <div class="rp-date"><label>إلى تاريخ</label><input id="fs_to" type="date" lang="en-GB"></div>
      </div>

      </div>
      <div id="fs_result" style="margin-top:14px;"></div>
    </div>`;

    const COLS = ['مجال المبادرة','الأيام','الساعات','الفعاليات','المنفّذون','المستهدفون','الأماكن','أماكن التنفيذ الفعلية'];
    const FS_W = ['42mm','15mm','19mm','20mm','20mm','24mm','18mm','auto'];
    function gen(){
      const from=document.getElementById('fs_from').value, to=document.getElementById('fs_to').value;
      const wDone=document.getElementById('fs_done').checked;
      const wNot=document.getElementById('fs_notDone').checked;
      /* التقاطع مع الفترة حتى تُحتسب الفعاليات متعددة الأيام */
      const base = state.orders.filter(o=>{
        const isDone = o.completionStatus==='تم';
        if(isDone && !wDone) return false;
        if(!isDone && !wNot) return false;
        const s=o.date||'', e=orderEnd(o);
        if(!s && !e) return false;
        if(from && e && e<from) return false;
        if(to && s && s>to) return false;
        return true;
      });
      const rows = (state.fields||[]).map(f=>{
        const list = base.filter(o=>o.fieldId===f.id);
        return {
          name: f.name,
          days: list.reduce((s,o)=>s+daysCount(o.date,o.dateTo),0),
          hours: Math.round(list.reduce((s,o)=>s+computeHours(o.timeFrom,o.timeTo,o.date,o.dateTo),0)*10)/10,
          events: list.length,
          trainers: new Set(list.flatMap(o=>o.trainerIds||[])).size,
          people: list.reduce((s,o)=>s+(Number(o.participantsCount)||0),0),
          places: new Set(list.map(o=>o.schoolId).filter(Boolean)).size,
          venues: venuesSummary(list), venuesTxt: venuesSummaryText(list),
        };
      }).filter(r=>r.events>0).sort((a,b)=>b.events-a.events);
      const tot = {
        name:'الإجمالي',
        days: rows.reduce((s,r)=>s+r.days,0),
        hours: Math.round(rows.reduce((s,r)=>s+r.hours,0)*10)/10,
        events: rows.reduce((s,r)=>s+r.events,0),
        trainers: new Set(base.flatMap(o=>o.trainerIds||[])).size,
        people: rows.reduce((s,r)=>s+r.people,0),
        places: new Set(base.map(o=>o.schoolId).filter(Boolean)).size,
        venues: venuesSummary(base), venuesTxt: venuesSummaryText(base),
      };
      return {rows, tot, from, to};
    }
    const asArr = r => [r.name, r.days, r.hours, r.events, r.trainers, r.people, r.places, r.venuesTxt];
    /* نسخة HTML: آخر عمود شارات صفراء */
    const asHtml = r => [escapeHtml(String(r.name)), r.days, r.hours, r.events, r.trainers, r.people, r.places, r.venues].map(String);
    function tableHtml(rows, tot){
      if(!rows.length) return `<div class="empty-state">لا توجد فعاليات ضمن هذه الفترة</div>`;
      const body = rows.map(r=>({ cells:asHtml(r),
        tdAttr:{0:' style="text-align:right;font-weight:700;"'} }));
      body.push({ cells:asHtml(tot), rowAttr:' style="background:#FAF9F7;font-weight:700;"',
        tdAttr:{0:' style="text-align:right;"'} });
      /* بلا عرض صريح تسحق قاعدة :first-child العامة عمود «مجال المبادرة»
         إلى 34px فتُكسر «الإجمالي» في منتصفها — colgroup يغلب تلك القاعدة */
      return repTableHtml(COLS, body, {colWidths:FS_W});
    }
    document.getElementById('fs_go').onclick=()=>{
      const {rows,tot}=gen();
      const b=document.getElementById('fs_result');
      b.innerHTML = tableHtml(rows,tot); enhanceReportTable(b);
    };
    function printIt(){
      const {rows,tot,from,to}=gen();
      if(!rows.length){ toast('لا توجد بيانات ضمن هذه الفترة'); return; }
      doPrintDoc(buildReportDoc({
        titleAr:'تقرير مجال المبادرة',
        subtitle:`من ${from?fmtDate(from):'—'} إلى ${to?fmtDate(to):'—'}`,
        kpis:[
          {v:tot.events,l:'📋 الفعاليات'}, {v:tot.days,l:'🗓️ الأيام'},
          {v:tot.hours,l:'⏱️ الساعات'}, {v:tot.people,l:'👥 المستهدفون'},
        ],
        headers: COLS, colWidths: FS_W,
        rows: rows.map(r=>asHtml(r))
              .concat([asHtml(tot).map((v,i)=>i===7?v:`<b>${v}</b>`)])
      }), true, 'A4');
    }
    document.getElementById('fs_print').onclick=printIt;
    document.getElementById('fs_pdf').onclick=printIt;
    document.getElementById('fs_excel').onclick=()=>{
      const {rows,tot,from,to}=gen();
      if(!rows.length){ toast('لا توجد بيانات ضمن هذه الفترة'); return; }
      exportToExcel('تقرير_مجال_المبادرة.xlsx', COLS, rows.map(asArr).concat([asArr(tot)]),
        `تقرير مجال المبادرة (من ${from?fmtDate(from):'—'} إلى ${to?fmtDate(to):'—'})`);
    };
    ['fs_from','fs_to'].forEach(id=>document.getElementById(id).addEventListener('change',()=>document.getElementById('fs_go').click()));
    ['fs_done','fs_notDone'].forEach(id=>document.getElementById(id).addEventListener('change',()=>document.getElementById('fs_go').click()));
    document.getElementById('fs_go').click();
  }

  function drawByPath(){
    const box=document.getElementById('reportContent');
    box.innerHTML = `<div class="card"><h2>تقرير حسب مسار / مجال المبادرة</h2>
      <div class="grid">
        <div class="field"><label>من تاريخ</label><input id="bp_from" type="date" lang="en-GB" value="2025-08-11"></div>

    function syncModeVisibility(){
      const both = document.getElementById('bp_byPath').checked && document.getElementById('bp_byField').checked;
      document.getElementById('bp_modeWrap').style.display = both ? 'block' : 'none';
    }
    document.getElementById('bp_byPath').addEventListener('change', syncModeVisibility);
    document.getElementById('bp_byField').addEventListener('change', syncModeVisibility);

    const baseCols = ['#','الفعالية','التاريخ','الوقت','المكان / هاتف المشرف','مقدم الفعالية'];
    function rowOf(o, extraCols){
      const school = state.schools.find(s=>s.id===o.schoolId);
      const supervisor = school ? school.supervisors.find(s=>s.id===o.supervisorId) : null;
      const base = [o.serial, o.title, repPeriodCell(o), fullTimeRange(o.timeFrom,o.timeTo), repPlacePhone(o), repTrainers(o)];
      const extra = (extraCols||[]).map(c=>{
        if(c==='مسار المبادرة'){ const pt=state.programTypes.find(p=>p.id===o.programTypeId); return pt?pt.name:''; }
        if(c==='مجال المبادرة'){ const f=state.fields.find(x=>x.id===o.fieldId); return f?f.name:''; }
        return '';
      });
      return [...base, ...extra];
    }
    function gen(){
      const from=document.getElementById('bp_from').value, to=document.getElementById('bp_to').value;
      const byPath = document.getElementById('bp_byPath').checked;
      const byField = document.getElementById('bp_byField').checked;
      const mode = document.querySelector('input[name="bp_mode"]:checked')?.value || 'separate';
      const baseList = state.orders.filter(o=>o.completionStatus==='تم' && (!from||o.date>=from) && (!to||o.date<=to));

      if(byPath && byField && mode==='combined'){
        return { mode:'combined', columns:[...baseCols,'مسار المبادرة','مجال المبادرة'], list: baseList.sort((a,b)=>(a.date||'').localeCompare(b.date||'')) };
      }
      // منفصل: نجمّع حسب المسار و/أو المجال كأقسام مستقلة
      let groups = [];
      if(byPath){
        groups = groups.concat(state.programTypes.map(pt=>({
          label:'مسار: '+pt.name,
          list: baseList.filter(o=>o.programTypeId===pt.id).sort((a,b)=>(a.date||'').localeCompare(b.date||''))
        })));
      }
      if(byField){
        groups = groups.concat(state.fields.map(f=>({
          label:'مجال: '+f.name,
          list: baseList.filter(o=>o.fieldId===f.id).sort((a,b)=>(a.date||'').localeCompare(b.date||''))
        })));
      }
      groups = groups.filter(g=>g.list.length>0).sort((a,b)=>b.list.length-a.list.length);
      return { mode:'separate', columns:baseCols, groups };
    }
    document.getElementById('bp_go').onclick=()=>{
      const data = gen();

      if(data.mode==='combined'){
        box.innerHTML = data.list.length ? `<table style="text-align:center;"><thead><tr>${data.columns.map(c=>`<th>${cellHtml(c)}</th>`).join('')}</tr></thead><tbody>
          ${data.list.map(o=>`<tr>${rowOf(o,['مسار المبادرة','مجال المبادرة']).map(v=>`<td>${cellHtml(v)}</td>`).join('')}</tr>`).join('')}
        </tbody></table>` : `<div class="empty-state">لا توجد فعاليات منجزة ضمن هذه الفترة</div>`;
      } else {
        box.innerHTML = data.groups.length ? data.groups.map(g=>`
          <h3 style="font-family:var(--font-head);color:var(--maroon-800);margin:14px 0 8px;">${escapeHtml(g.label)} <span class="badge">${g.list.length} ${eventWord(g.list.length)}</span></h3>
          <table style="text-align:center;"><thead><tr>${data.columns.map(c=>`<th>${cellHtml(c)}</th>`).join('')}</tr></thead><tbody>
            ${g.list.map(o=>`<tr>${rowOf(o).map(v=>`<td>${cellHtml(v)}</td>`).join('')}</tr>`).join('')}
          </tbody></table>`).join('') : `<div class="empty-state">لا توجد فعاليات منجزة ضمن هذه الفترة</div>`;
      }
      enhanceReportTable(box);
    };
    document.getElementById('bp_excel').onclick=()=>{
      const data = gen();
      const from=document.getElementById('bp_from').value, to=document.getElementById('bp_to').value;
      if(data.mode==='combined'){
        if(!data.list.length){ toast('لا توجد بيانات لتصديرها'); return; }
        exportToExcel('تقرير_حسب_المسار_والمجال.xlsx', data.columns, data.list.map(o=>rowOf(o,['مسار المبادرة','مجال المبادرة'])), `تقرير حسب المسار والمجال (من ${from?fmtDate(from):'—'} إلى ${to?fmtDate(to):'—'})`);
      } else {
        if(!data.groups.length){ toast('لا توجد بيانات لتصديرها'); return; }
        const sheets = data.groups.map(g=>({name:g.label.slice(0,30), headers:data.columns, rows:g.list.map(o=>rowOf(o))}));
        exportToExcelMultiSheet('تقرير_حسب_مسار_المبادرة.xlsx', sheets, `تقرير حسب مسار/مجال المبادرة (من ${from?fmtDate(from):'—'} إلى ${to?fmtDate(to):'—'})`);
      }
    };
    function printIt(){
      const data = gen();
      const from=document.getElementById('bp_from').value, to=document.getElementById('bp_to').value;
      const dateBox = `<div style="text-align:center;margin-bottom:5mm;font-size:11pt;font-weight:700;">
        من <span style="display:inline-block;border:1.5px solid ${PRINT_LINE_COLOR};border-radius:6px;padding:1.5mm 6mm;margin:0 3mm;font-weight:700;">${from?fmtDate(from):'—'}</span>
        إلى <span style="display:inline-block;border:1.5px solid ${PRINT_LINE_COLOR};border-radius:6px;padding:1.5mm 6mm;margin:0 3mm;font-weight:700;">${to?fmtDate(to):'—'}</span>
      </div>`;
      let bodyHtml, totalEvents;

        totalEvents = data.list.length;
        bodyHtml = `<table style="text-align:center;"><thead><tr>${data.columns.map(c=>`<th>${cellHtml(c)}</th>`).join('')}</tr></thead><tbody>
          ${data.list.map(o=>`<tr>${rowOf(o,['مسار المبادرة','مجال المبادرة']).map(v=>`<td>${cellHtml(v)}</td>`).join('')}</tr>`).join('')}
        </tbody></table>`;
      } else {
        totalEvents = data.groups.reduce((s,g)=>s+g.list.length,0);
        bodyHtml = data.groups.map(g=>`
          <div class="sec-t">${escapeHtml(g.label)} (${g.list.length} ${eventWord(g.list.length)})</div>
          <table style="text-align:center;"><thead><tr>${data.columns.map(c=>`<th>${cellHtml(c)}</th>`).join('')}</tr></thead><tbody>
            ${g.list.map(o=>`<tr>${rowOf(o).map(v=>`<td>${cellHtml(v)}</td>`).join('')}</tr>`).join('')}
          </tbody></table>`).join('');
      }
      doPrintDoc(buildReportDoc({
        titleAr:'تقرير حسب مسار / مجال المبادرة',
        kpis:[{v:totalEvents,l:'عدد الفعاليات المنجزة'}],
        extraHtml: dateBox + bodyHtml
      }), true, 'A4');
    }
    document.getElementById('bp_print').onclick=printIt;
    document.getElementById('bp_pdf').onclick=printIt;
  }

      const extra = [];

/* ============ Simple SVG bar chart ============ */
function svgBarChart(items){
  const max = Math.max(1, ...items.map(i=>i.value));
  const barH=22, gap=10, maxW=320;
  const height = items.length*(barH+gap);
  const bars = items.map((it,i)=>{
    const w = Math.max(2, Math.round((it.value/max)*maxW));
    const y = i*(barH+gap);
    return `<rect x="0" y="${y}" width="${w}" height="${barH}" rx="4" fill="#087F8C"></rect>
      <text x="${maxW+10}" y="${y+barH*0.72}" font-size="12" fill="#2a1116">${escapeHtml(it.name)} (${it.value})</text>`;
  }).join('');
  return `<div class="chart-wrap"><svg viewBox="0 0 ${maxW+180} ${height+10}" style="width:100%;max-width:560px;height:auto;">${bars}</svg></div>`;
}
const DONUT_COLORS = ['#087F8C','#C8A548','#13314F','#159669','#2F6FA8','#E99B27','#6FBFC8','#7C8B9A'];
function svgDonutChart(items){
  const total = items.reduce((s,i)=>s+i.value,0) || 1;
  const cx=90, cy=90, r=70, sw=32;
  let angle=-90;
  const circumference = 2*Math.PI*r;
  const arcs = items.map((it,i)=>{
    const frac = it.value/total;
    const dash = frac*circumference;
    const el = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${DONUT_COLORS[i%DONUT_COLORS.length]}" stroke-width="${sw}"
      stroke-dasharray="${dash} ${circumference-dash}" stroke-dashoffset="${-angle/360*circumference}" transform="rotate(-90 ${cx} ${cy})"></circle>`;
    angle += frac*360;
    return el;
  }).join('');
  const legend = items.map((it,i)=>`<div style="display:flex;align-items:center;gap:6px;font-size:12.5px;margin-bottom:4px;">
    <span style="width:12px;height:12px;border-radius:3px;background:${DONUT_COLORS[i%DONUT_COLORS.length]};display:inline-block;"></span>
    ${escapeHtml(it.name)} — ${it.value} (${total?Math.round(it.value/total*100):0}%)</div>`).join('');
  return `<div class="chart-wrap" style="display:flex;gap:20px;flex-wrap:wrap;align-items:center;">
    <svg width="180" height="180" viewBox="0 0 180 180">${arcs}<text x="90" y="96" text-anchor="middle" font-size="18" font-weight="800" fill="#2a1116">${total}</text></svg>
    <div>${legend}</div>
  </div>`;
}

        return `<tr style="${overdue?'background:#fdecec;':''}">
        <td>${escapeHtml(t.title)}</td><td>${t.start||'—'}</td><td>${t.due||'—'}${overdue?' ⚠️':''}</td>
        <td>${trainer?escapeHtml(trainer.name):'—'}</td><td>${prioBadge}</td>
        <td><select onchange="updateTaskStatus('${t.id}', this.value)"><option value="لم تبدأ" ${t.status==='لم تبدأ'?'selected':''}>لم تبدأ</option><option value="قيد التنفيذ" ${t.status==='قيد التنفيذ'?'selected':''}>قيد التنفيذ</option><option value="مكتملة" ${t.status==='مكتملة'?'selected':''}>مكتملة</option></select></td>
        <td style="max-width:180px;">${escapeHtml(t.notes||'')}</td>
        <td><button class="icon-btn danger" onclick="deleteTask('${t.id}')">🗑️</button></td></tr>`;
      }).join('')}
    </tbody></table>`;
  }
  document.getElementById('tk_add').onclick=async ()=>{
    const title=document.getElementById('tk_title').value.trim();
    if(!title){ toast('أدخل اسم المهمة'); return; }
    const trainerId = document.getElementById('tk_trainer').value;
    const due = document.getElementById('tk_due').value;
    state.tasks.push({
      id:uid(), title, start:document.getElementById('tk_start').value, due,
      trainerId, priority:document.getElementById('tk_priority').value,
      status:document.getElementById('tk_status').value, notes:document.getElementById('tk_notes').value, done:false
    });
    if(trainerId){
      state.notifications.push({id:uid(), trainerId, message:`مهمة جديدة مسندة إليك: "${title}"${due?(' — الاستحقاق: '+due):''}`, read:false, createdAt:Date.now()});
    }
    await saveState(); toast('تمت إضافة المهمة'); render();
  };
  drawList();
}
async function updateTaskStatus(id, status){ const t=state.tasks.find(x=>x.id===id); if(t){ t.status=status; t.done=(status==='مكتملة'); await saveState(); renderKeepForm(); } }
async function toggleTask(id){ const t=state.tasks.find(x=>x.id===id); if(t){ t.done=!t.done; t.status=t.done?'مكتملة':'لم تبدأ'; await saveState(); renderKeepForm(); } }
async function deleteTask(id){ state.tasks = state.tasks.filter(x=>x.id!==id); await saveState(); renderKeepForm(); }

      <div style="font-size:9.5pt;margin-bottom:2mm;">عدد الأيام: ${stats.daysTotal} — عدد الساعات: ${stats.hoursTotal} — عدد المدارس: ${stats.schoolsTotal}${stats.byPath.length?' — '+stats.byPath.map(p=>`${escapeHtml(p.name)}: ${p.count}`).join('، '):''}</div>
      ${repTableHtml(['#','الفعالية','التاريخ','الوقت','الأيام','الساعات','المكان / هاتف المشرف'],
        list.map(o=>[String(o.serial||'—'), escapeHtml(o.title||''), repPeriodCell(o),
          escapeHtml(fullTimeRange(o.timeFrom,o.timeTo)||'—'),
          String(daysCount(o.date,o.dateTo)), String(computeHours(o.timeFrom,o.timeTo,o.date,o.dateTo)),
          repPlacePhone(o)]))}`).join('');
    doPrintDoc(buildReportDoc({
      titleAr:'توزيع الفعاليات على مقدمي المبادرة', subtitle:`من ${fmtDate(start)} إلى ${fmtDate(end)}`,
      extraHtml
    }), true, 'A4');
  }
  document.getElementById('dist_print').onclick=printIt;
  document.getElementById('dist_pdf').onclick=printIt;
  document.getElementById('dist_go').onclick=draw;
  draw();
}

/* ══ تقويم إتاحة مقدمي الفعاليات — مستقل عن تسجيل دخول المقدّم ══ */
function renderAvailabilityCalendar(box){
    /* تقويم ربع سنوي: 3 أشهر لكل ربع، ولكل مقدّم صف بأيام الشهر
       أخضر = متاح | أحمر = مرتبط بفعالية في ذلك اليوم */
    const now = new Date();
    if(!window.__tpQ) window.__tpQ = {year: now.getFullYear(), q: Math.floor(now.getMonth()/3)+1};
    const Q = window.__tpQ;
    const startMonth = (Q.q-1)*3;
    const months = [0,1,2].map(i=>({y:Q.year, m:startMonth+i}));
    const MN = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
    const QN = {1:'الربع الأول (يناير–مارس)',2:'الربع الثاني (أبريل–يونيو)',3:'الربع الثالث (يوليو–سبتمبر)',4:'الربع الرابع (أكتوبر–ديسمبر)'};
    const iso = (y,m,d)=>`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    /* فعاليات المقدّم في ذلك اليوم (نشطة فقط) */
    function eventsOn(tid, dISO){
      return (state.orders||[]).filter(o=>{
        if((o.status||'active')==='cancelled') return false;
        if(!(o.trainerIds||[]).includes(tid)) return false;
        const s=o.date||'', e=orderEnd(o);
        return s && dISO>=s && dISO<=e;
      });
    }
    function busyOn(tid, dISO){ return eventsOn(tid, dISO).length > 0; }
    /* تضارب = أكثر من فعالية للمقدّم نفسه في اليوم نفسه */
    const calClash = {};           // tid -> { dISO: [orders] }
    let calClashDays = 0;
    const monthBlocks = months.map(({y,m})=>{
      const days = new Date(y, m+1, 0).getDate();
      const rows = state.trainers.map(t=>{
        const cells = Array.from({length:days},(_,i)=>{
          const d=i+1, dISO=iso(y,m,d), wd=new Date(y,m,d).getDay(), off=(wd===5||wd===6);
          const evs = eventsOn(t.id, dISO);
          const busy = evs.length > 0;
          /* تضارب: فعاليتان أو أكثر في اليوم نفسه */
          if(evs.length > 1){
            calClash[t.id] = calClash[t.id] || {};
            if(!calClash[t.id][dISO]){ calClash[t.id][dISO] = evs; calClashDays++; }
            const tip = escapeHtml(t.name) + ' — ' + fmtDate(dISO) + ' — ⚠ تضارب: '
              + evs.length + ' فعاليات\n'
              + evs.map(o=>'• #'+(o.serial||'—')+' '+(o.title||'')+' ('+(o.timeFrom||'—')+'–'+(o.timeTo||'—')+')').join('\n');
            return `<td class="cal-c clash" data-calclash="${t.id}|${dISO}" title="${escapeHtml(tip)}">${d}</td>`;
          }
          const cls = off ? 'off' : (busy?'busy':'free');
          const lbl = off ? 'إجازة' : (busy?'غير متاح':'متاح');
          const tip = escapeHtml(t.name) + ' — ' + fmtDate(dISO) + ' — ' + lbl
            + (busy ? '\n• #'+(evs[0].serial||'—')+' '+(evs[0].title||'') : '');
          return `<td class="cal-c ${cls}" title="${escapeHtml(tip)}">${d}</td>`;
        }).join('');
        /* أيام الإجازة لا تُحتسب ضمن الأيام المشغولة */
        const busyCount = Array.from({length:days},(_,i)=>{
          const wd=new Date(y,m,i+1).getDay();
          return (wd!==5 && wd!==6) && busyOn(t.id, iso(y,m,i+1));
        }).filter(Boolean).length;
        const myClash = Object.keys(calClash[t.id]||{}).filter(k=>k.slice(0,7)===`${y}-${String(m+1).padStart(2,'0')}`).length;
        return `<tr${myClash?' class="cal-row-clash"':''}><th class="cal-nm">${escapeHtml(t.name)}`
          + (myClash ? `<span class="cal-cl" title="${myClash} يوم فيه تضارب">⚠ ${myClash}</span>` : '')
          + `<span class="cal-ct">${busyCount}</span></th>${cells}</tr>`;
      }).join('');
      /* رمز اليوم: ح ن ث ر خ ج س — الجمعة والسبت إجازة */
      const DW = ['ح','ن','ث','ر','خ','ج','س'];   // الأحد=0 ... السبت=6
      const isOff = wd => wd===5 || wd===6;        // الجمعة والسبت
      const head = Array.from({length:days},(_,i)=>{
        const wd = new Date(y, m, i+1).getDay();
        return `<th class="cal-d${isOff(wd)?' off':''}"><b>${DW[wd]}</b><i>${i+1}</i></th>`;
      }).join('');
      return `<div class="card"><h2 class="tp-h">${MN[m]} ${y}</h2>
        <div class="tbl-scroll"><table class="cal-tb"><thead><tr><th class="cal-nm">مقدم الفعالية</th>${head}</tr></thead>
        <tbody>${rows || `<tr><td colspan="${days+1}" class="empty-state">لا يوجد مقدمو فعاليات</td></tr>`}</tbody></table></div>
      </div>`;
    }).join('');

    box.innerHTML = `<div class="card">
      <h2 class="tp-h">تقويم إتاحة مقدمي الفعاليات</h2>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px;">
        <div class="field" style="margin:0;"><label>السنة</label>
          <select id="tpq_year" style="width:auto;min-width:100px;">
            ${[Q.year-1,Q.year,Q.year+1].map(y=>`<option value="${y}" ${y===Q.year?'selected':''}>${y}</option>`).join('')}
          </select></div>
        <div class="field" style="margin:0;"><label>الربع</label>
          <select id="tpq_q" style="width:auto;min-width:190px;">
            ${[1,2,3,4].map(q=>`<option value="${q}" ${q===Q.q?'selected':''}>${QN[q]}</option>`).join('')}
          </select></div>
        <span style="display:inline-flex;align-items:center;gap:14px;margin-inline-start:auto;font-size:12.5px;">
          <span style="display:inline-flex;align-items:center;gap:6px;"><i style="width:14px;height:14px;border-radius:4px;background:#DFF3EB;border:1px solid #8DD8BD;display:inline-block;"></i> متاح</span>
          <span style="display:inline-flex;align-items:center;gap:6px;"><i style="width:14px;height:14px;border-radius:4px;background:#FEE4E2;border:1px solid #FDA29B;display:inline-block;"></i> غير متاح</span>
          <span style="display:inline-flex;align-items:center;gap:6px;"><i style="width:14px;height:14px;border-radius:4px;background:#DFF3F8;border:1px solid #9FD3E4;display:inline-block;"></i> إجازة (الجمعة والسبت)</span>
        <span style="display:inline-flex;align-items:center;gap:6px;"><i style="width:14px;height:14px;border-radius:4px;background:#C0334D;border:1px solid #9E2840;display:inline-block;"></i> تضارب</span>
        </span>
      </div>
      ${calClashDays ? `<div class="clash-bar">${icon('alert',15)}
        <span><b>${calClashDays}</b> حالة تضارب في هذا الربع — مقدّم مرتبط بأكثر من فعالية في اليوم نفسه.
        الخلايا الحمراء الداكنة في الجدول أدناه؛ اضغط أيّها لعرض الفعاليات المتضاربة.</span>
        <button class="btn btn-sm btn-outline" id="cal_clashJump" style="margin-inline-start:auto;">عرض القائمة</button>
      </div>` : `<div class="ok-bar">${icon('checkCircle',15)} <span>لا يوجد أي تضارب في هذا الربع.</span></div>`}
      <div class="helper">الرقم بجوار الاسم = عدد الأيام المشغولة في ذلك الشهر · ⚠ = عدد أيام التضارب.</div>
    </div>${monthBlocks}${calClashTable()}`;

    /* جدول تفاصيل التضارب — نفس بطاقة الإتاحة، مرتّب حسب المقدّم ثم التاريخ */
    function calClashTable(){
      if(!calClashDays) return '';
      const rows = [];
      (state.trainers||[]).slice().sort((a,b)=>a.name.localeCompare(b.name,'ar')).forEach(t=>{
        const days = calClash[t.id] || {};
        Object.keys(days).sort().forEach(d=>{
          rows.push({ t, d, evs: days[d] });
        });
      });
      return `<div class="card" id="cal_clashCard" style="border:2px solid #C0334D;">
        <h2 class="tp-h" style="background:#C0334D !important;">${icon('alert',15)} تنبيه تضارب الفعاليات — ${rows.length} حالة</h2>
        <div class="tbl-scroll"><table class="clash-tbl"><thead><tr>
          <th style="width:19%;">مقدم الفعالية</th><th style="width:13%;">التاريخ</th>
          <th style="width:7%;">العدد</th><th>الفعاليات المتضاربة</th>
        </tr></thead><tbody>
        ${rows.map(r=>`<tr>
          <td style="font-weight:700;">${escapeHtml(r.t.name)}</td>
          <td style="white-space:nowrap;">${fmtDate(r.d)}</td>
          <td style="text-align:center;"><span class="badge bad">${r.evs.length}</span></td>
          <td>${r.evs.map(o=>`<button class="clash-ev" onclick="openOrderDrawer('${o.id}')">
              <b>#${o.serial||'—'}</b> ${escapeHtml(o.title||'بلا عنوان')}
              <span>${escapeHtml((o.timeFrom||'—')+' – '+(o.timeTo||'—'))}</span>
            </button>`).join('')}</td>
        </tr>`).join('')}
        </tbody></table></div>
        <div class="helper" style="margin-top:8px;">اضغط أي فعالية لفتحها ومعالجة التضارب.</div>
      </div>`;
    }

    document.getElementById('tpq_year').onchange=e=>{ window.__tpQ.year=Number(e.target.value); render(); };
    document.getElementById('tpq_q').onchange=e=>{ window.__tpQ.q=Number(e.target.value); render(); };
    const jump = document.getElementById('cal_clashJump');
    if(jump) jump.onclick=()=>{ const el=document.getElementById('cal_clashCard');
      if(el) el.scrollIntoView({behavior:'smooth', block:'start'}); };
    /* النقر على خلية تضارب داخل الجدول */
    box.querySelectorAll('[data-calclash]').forEach(td=>{
      td.style.cursor='pointer';
      td.onclick=()=>{
        const [tid,d] = td.dataset.calclash.split('|');
        const evs = (calClash[tid]||{})[d] || [];
        const t = (state.trainers||[]).find(x=>x.id===tid);
        if(evs.length===1){ openOrderDrawer(evs[0].id); return; }
        const msg = '⚠ تضارب فعاليات\n\n' + (t?t.name:'') + ' — ' + fmtDate(d) + '\n\n'
          + evs.map((o,i)=>(i+1)+') #'+(o.serial||'—')+' — '+(o.title||'بلا عنوان')
              + '\n     من ' + (o.timeFrom||'—') + ' إلى ' + (o.timeTo||'—')).join('\n\n')
          + '\n\nاضغط «موافق» لفتح الفعالية الأولى.';
        if(confirm(msg)) openOrderDrawer(evs[0].id);
      };
    });
}

/* ---- reminders & motivational popups for the logged-in trainer ---- */
function daysDiff(from, to){ if(!from||!to) return null; return Math.round((new Date(to+'T00:00:00') - new Date(from+'T00:00:00'))/86400000); }
function isoWeekKey(d){ const dt=new Date(d); const onejan=new Date(dt.getFullYear(),0,1); const week=Math.ceil((((dt-onejan)/86400000)+onejan.getDay()+1)/7); return dt.getFullYear()+'-W'+week; }
async function checkAndShowTrainerPopups(trainer, myOrders){
  if(!trainer) return;
  const today = todayStr();
  const now = new Date();
  let changed=false;
  const flags = state.reminderFlags;

  for(const o of myOrders){
    if(daysDiff(today,o.date)===1){
      const key='dayBefore_'+o.id;
      if(!flags[key]){
        flags[key]=true; changed=true;
        openAnnouncement('🔔 تذكير بفعالية غدًا', `لديك فعالية غدًا "${o.title}" في ${o.date} الساعة ${o.timeFrom||''}. الرجاء التجهيز لها.`);
        break;
      }
    }
  }
  // same-day: 2 hours after the event's end time, if not yet evaluated
  for(const o of myOrders){
    if(o.date===today && o.timeTo && !o.completionStatus){
      const end = parseDT(o.date, o.timeTo);
      if(end && (now - end) >= 2*60*60*1000){
        const key='2hAfter_'+o.id;
        if(!flags[key]){
          flags[key]=true; changed=true;
          openAnnouncement('📝 قيّم الفعالية', `مرّ أكثر من ساعتين على انتهاء فعالية "${o.title}". الرجاء تسجيل الإنجاز والتقييم الآن.`);
          break;
        }
      }
    }
  }
  for(const o of myOrders){
    if(o.date && o.date<today && !o.completionStatus){
      const key='postEvent_'+o.id;
      if(!flags[key]){
        flags[key]=true; changed=true;
        openAnnouncement('📝 حان وقت التقييم', `فعالية "${o.title}" بتاريخ ${o.date} انتهت. الرجاء تسجيل الإنجاز والتقييم الآن.`);
        break;
      }
    }
  }
  // newly assigned tasks
  const myTasksForPopup = state.tasks.filter(t=>t.trainerId===trainer.id);
  for(const t of myTasksForPopup){
    const key='taskAssigned_'+t.id;
    if(!flags[key]){
      flags[key]=true; changed=true;
      openAnnouncement('📋 مهمة جديدة', `تم إسناد مهمة جديدة إليك: "${t.title}"${t.due?(' — الاستحقاق: '+t.due):''}.`);
      break;
    }
  }
  if(now.getDay()===4){
    const wk = isoWeekKey(now);
    const key='motivation_'+trainer.id+'_'+wk;
    if(!flags[key]){
      flags[key]=true; changed=true;
      openAnnouncement('💐 رسالة تحفيزية', 'نشكر لك جهودك المقدمة خلال الاسبوع السابق ونأمل الإطلاع على فعاليات خلال الأسبوع القادم مع التجهيز لها.');
    }
  }
  if(changed) await saveState();
}
function openAnnouncement(title, message){
  const overlay=document.getElementById('modalOverlay'); const box=document.getElementById('modalBox');
  box.innerHTML = `<h3>${escapeHtml(title)}</h3><p style="font-size:15px;line-height:1.8;white-space:pre-line;">${escapeHtml(message)}</p>
    <div class="modal-actions"><button class="btn btn-primary" id="ann_ok">حسنًا</button></div>`;
  overlay.classList.add('open');
  document.getElementById('ann_ok').onclick=()=>overlay.classList.remove('open');
}

  };

async function restoreBackup(file){
  if(!file) return;
  if(!confirm('سيتم استبدال جميع البيانات الحالية بمحتوى ملف النسخة الاحتياطية. هل تريد المتابعة؟')) return;
  try{
    const text = await file.text();
    const parsed = JSON.parse(text);
    if(!parsed || typeof parsed!=='object' || !Array.isArray(parsed.orders)){ toast('ملف النسخة الاحتياطية غير صالح'); return; }
    state = parsed;
    await saveState(); toast('تم استعادة النسخة الاحتياطية'); render();
  }catch(e){ toast('تعذّرت قراءة الملف'); console.error(e); }
}
async function importOrdersExcel(file){
  if(!file) return;
  try{
    const markDone = document.getElementById('dm_importAsDone') && document.getElementById('dm_importAsDone').checked;
    const rows = await readExcelFile(file);
    let added=0, skipped=0;
    function normTitle(s){ return (s||'').toString().trim().replace(/\s+/g,' '); }
    rows.slice(1).forEach(r=>{
      const title=(r[0]||'').toString().trim(); if(!title) return;
      let date=r[1]; if(date instanceof Date){ date = dateToISO(date); } else { date=(date||'').toString().trim(); }
      const timeFrom=(r[2]||'').toString().trim(), timeTo=(r[3]||'').toString().trim();
      const schoolName=(r[4]||'').toString().trim(); const participantsCount=(r[5]||'').toString().trim();
      // أعمدة اختيارية إضافية: G = مسار البرنامج (اسم), H = المدربون "الاسم:الهاتف، الاسم:الهاتف"
      // I = اسم المشرف, J = رقم جوال المشرف
      const ptypeName=(r[6]||'').toString().trim();
      const trainersRaw=(r[7]||'').toString().trim();
      const supName=(r[8]||'').toString().trim();
      const supPhone=(r[9]||'').toString().trim();
      // أعمدة الدمج مع كشف المدارس: K = المرحلة الدراسية, L = بريد المدرسة, M = بريد المشرف
      const schLevel=(r[10]||'').toString().trim();
      const schEmail=(r[11]||'').toString().trim();
      const supEmail=(r[12]||'').toString().trim();

      let sch = state.schools.find(s=>s.name===schoolName);
      // فحص التكرار: نفس عنوان المبادرة + نفس التاريخ + نفس المدرسة (سواء موجودة مسبقًا أو ستُنشأ الآن)
      const isDup = state.orders.some(o => normTitle(o.title)===normTitle(title) && o.date===date && sch && o.schoolId===sch.id);
      if(isDup){ skipped++; return; }

      if(!sch && schoolName){ sch={id:uid(), name:schoolName, level: schLevel||'غير ذلك', email: schEmail, supervisors:[]}; state.schools.push(sch); }
      else if(sch){
        if(schLevel && (!sch.level || sch.level==='غير ذلك')) sch.level = schLevel;
        if(schEmail && !sch.email) sch.email = schEmail;
      }

      let programTypeId = state.programTypes[0]?state.programTypes[0].id:'';
      if(ptypeName){
        let pt = state.programTypes.find(p=>p.name===ptypeName);
        if(!pt){ pt={id:uid(), name:ptypeName}; state.programTypes.push(pt); }
        programTypeId = pt.id;
      }

      const trainerIds = [];
      if(trainersRaw){
        trainersRaw.split(/[،,]/).map(s=>s.trim()).filter(Boolean).forEach(entry=>{
          const [nm, ph] = entry.split(':').map(s=>s?s.trim():'');
          const name = nm||entry;
          let tr = state.trainers.find(t=> (ph && t.phone===ph) || t.name===name);
          if(!tr){ tr={id:uid(), name, phone:ph||''}; state.trainers.push(tr); }
          trainerIds.push(tr.id);
        });
      }

      // المشرف: يُطابق برقم الجوال أو الاسم داخل نفس الجهة، ويُنشأ إن لم يوجد
      let supervisorId = '';
      if(sch && (supName || supPhone)){
        let sv = sch.supervisors.find(x => (supPhone && x.phone===supPhone) || (supName && x.name===supName));
        if(!sv){ sv = {id:uid(), name: supName||'مشرف (بدون اسم)', phone: supPhone, email: supEmail}; sch.supervisors.push(sv); }
        else {
          if(supPhone && !sv.phone) sv.phone = supPhone;
          if(supEmail && !sv.email) sv.email = supEmail;
        }
        supervisorId = sv.id;
      }

      const maxSerialThisYear = nextOrderSerial() - 1;
      state.orders.push({
        id:uid(), serial: maxSerialThisYear+1, createdAt:Date.now(), title, fieldId: state.fields[0]?state.fields[0].id:'',
        participantsCount, date, timeFrom, timeTo, programTypeId,
        schoolId: sch?sch.id:'', supervisorId, trainerIds, requesterNote:'', adminNote:'مستورد من إكسل',
        adminRequests:[], completionStatus: markDone?'تم':'', notDoneReason:'', supervisorRating:0, schoolRating:0, studentsRating:0, recommendSchool:'', evaluatedBy:'', status:'active'
      });
      added++;
    });
    await saveState(); toast(`تم استيراد ${added} فعالية${skipped?` — تم تجاهل ${skipped} فعالية مكررة (نفس العنوان والتاريخ والمدرسة)`:''}`); render();
  }catch(e){ toast('تعذّرت قراءة الملف، تأكد من صيغته'); console.error(e); }
}
function simpleListTable(list, key){
  if(!list.length) return `<div class="empty-state">لا توجد عناصر</div>`;
  /* أسطر ضيقة والأيقونات أقصى اليسار */
  return `<div class="set-list">${list.map(i=>`
    <div class="set-list-row">
      <span>${escapeHtml(i.name)}${i.phone?` <b style="color:var(--muted-text);font-weight:400;direction:ltr;">${escapeHtml(i.phone)}</b>`:''}${i.category?` <em style="color:var(--soft-text);font-style:normal;font-size:11px;">(${escapeHtml(i.category)})</em>`:''}</span>
      <button class="icon-btn" title="تعديل" aria-label="تعديل" onclick="editListItem('${key}','${i.id}')">${icon('edit',12)}</button>
      <button class="icon-btn danger" title="حذف" aria-label="حذف" onclick="deleteFromList('${key}','${i.id}')">${icon('trash',12)}</button>
    </div>`).join('')}</div>`;
}
function editListItem(key, id){
  const item = state[key].find(x=>x.id===id); if(!item) return;
  openModal('تعديل: '+item.name, [{name:'name', label:'الاسم', required:true}], async v=>{
    item.name = v.name; await saveState(); toast('تم الحفظ'); render();
  });
  setTimeout(()=>{ const f=document.getElementById('mf_name'); if(f) f.value=item.name; },0);
}

/* ---- Excel import (SheetJS) ---- */
/* مكتبة SheetJS تأتي من شبكة توصيل خارجية. إن تعذّر تحميلها (انقطاع
   الإنترنت أو حجب الشبكة) كانت أزرار Excel تموت صامتة بلا أي إشعار:
   ReferenceError في الكواليس والمستخدم يظنّ الزرّ معطوبًا. */
function xlsxReady(){
  if(typeof XLSX !== 'undefined' && XLSX && XLSX.utils) return true;
  toast('تعذّر تحميل مكتبة Excel — تحقّق من الاتصال بالإنترنت ثم أعد المحاولة');
  return false;
}
function readExcelFile(file){
  if(!xlsxReady()) return Promise.reject(new Error('XLSX unavailable'));
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const wb = XLSX.read(e.target.result, {type:'array'});
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:''});
        resolve(rows);
      }catch(err){ reject(err); }
    };
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}
async function importTrainersExcel(file){
  if(!file) return;
  try{
    const rows = await readExcelFile(file);
    let added=0;
    rows.slice(1).forEach(r=>{
      const name=(r[0]||'').toString().trim(); const phone=(r[1]||'').toString().trim();
      if(name){ state.trainers.push({id:uid(), name, phone}); added++; }
    });
    await saveState(); toast(`تم استيراد ${added} مقدم فعالية`); render();
  }catch(e){ toast('تعذّرت قراءة الملف، تأكد من صيغته'); console.error(e); }
}
async function importSchoolsExcel(file){
  if(!file) return;
  try{
    const rows = await readExcelFile(file);
    let added=0, supAdded=0, emailFilled=0;
    rows.slice(1).forEach(r=>{
      const name=(r[0]||'').toString().trim(); const level=(r[1]||'غير ذلك').toString().trim();
      const schoolEmail=(r[2]||'').toString().trim();
      const svName=(r[3]||'').toString().trim(); const svPhone=(r[4]||'').toString().trim(); const svEmail=(r[5]||'').toString().trim();
      if(!name) return;
      let sch = state.schools.find(s=>s.name===name);
      if(!sch){ sch={id:uid(), name, level, email:schoolEmail, supervisors:[]}; state.schools.push(sch); added++; }
      else if(schoolEmail && !sch.email){ sch.email = schoolEmail; emailFilled++; }
      if(svName || svPhone || svEmail){
        const already = sch.supervisors.some(sv=> (svPhone && sv.phone===svPhone) || (svName && sv.name===svName && !svPhone) );
        if(!already){ sch.supervisors.push({id:uid(), name:svName||'مشرف (بدون اسم)', phone:svPhone, email:svEmail}); supAdded++; }
      }
    });
    await saveState(); toast(`تم استيراد ${added} مدرسة جديدة، ${supAdded} مشرف، وتحديث بريد ${emailFilled} مدرسة`); render();
  }catch(e){ toast('تعذّرت قراءة الملف، تأكد من صيغته'); console.error(e); }
}
/* يزيل محارف العزل الاتجاهي (LRI/PDI) قبل التصدير لملفات Excel */
function stripBidi(v){
  return (v===null||v===undefined) ? v : String(v).replace(/[\u2066-\u2069\u200E\u200F]/g,'');
}
/* يحوّل خلية HTML إلى نص نظيف قبل كتابتها في Excel */
function xlText(v){
  if(typeof v!=='string' || v.indexOf('<')===-1) return v;
  return v.replace(/<br\s*\/?>/gi,' ')
    .replace(/مكان التنفيذ:/g,'— مكان التنفيذ:')
    .replace(/<[^>]+>/g,' ')
    .replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>')
    .replace(/&quot;/g,'"').replace(/&#39;/g,"'")
    .replace(/\s+/g,' ').trim();
}
function exportToExcel(filename, headers, rows, titleAr){
  if(!xlsxReady()) return;
  const now = new Date();
  const dateStr = fmtDate(todayStr());
  const timeStr = now.toLocaleTimeString('ar-QA-u-nu-latn', {hour:'2-digit', minute:'2-digit'});
  const aoa = [];
  if(titleAr){ aoa.push([titleAr]); aoa.push([stripBidi(`تاريخ التصدير: ${dateStr}    وقت التصدير: ${timeStr}`)]); aoa.push([]); }
  aoa.push(headers.map(stripBidi));
  rows.forEach(r=>aoa.push(r.map(v=>stripBidi(xlText(v)))));
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = headers.map(()=>({wch:18}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'بيانات');
  XLSX.writeFile(wb, filename);
}
function exportToExcelMultiSheet(filename, sheets, titleAr){
  // sheets: [{name, headers, rows}]
  if(!xlsxReady()) return;
  const now = new Date();
  const dateStr = fmtDate(todayStr()), timeStr = now.toLocaleTimeString('ar-QA-u-nu-latn', {hour:'2-digit', minute:'2-digit'});
  const wb = XLSX.utils.book_new();
  sheets.forEach(s=>{
    const aoa = [];
    if(titleAr){ aoa.push([titleAr]); aoa.push([stripBidi(`تاريخ التصدير: ${dateStr}    وقت التصدير: ${timeStr}`)]); aoa.push([]); }
    aoa.push(s.headers.map(stripBidi));
    s.rows.forEach(r=>aoa.push(r.map(v=>stripBidi(xlText(v)))));
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = s.headers.map(()=>({wch:18}));
    XLSX.utils.book_append_sheet(wb, ws, (s.name||'بيانات').slice(0,31));
  });
  XLSX.writeFile(wb, filename);
}

/* حذف المدارس المكررة بالاسم — تُدمج فعالياتها في السجل الأول ولا تُفقد */
/* حذف ما هو محدد في جدول المدارس — مدارس أو مشرفين */
async function bulkDeleteSchoolRows(){
  const checks = Array.from(document.querySelectorAll('#schoolsTable .schRow:checked'));
  if(!checks.length){ toast('حدد سطرًا واحدًا على الأقل'); return; }
  const svTargets = checks.filter(c=>c.dataset.sv).map(c=>({s:c.dataset.school, sv:c.dataset.sv}));
  const schoolOnly = checks.filter(c=>!c.dataset.sv).map(c=>c.dataset.school);
  /* المدرسة تُحذف فقط إذا حُدّد كل مشرفيها أو لم يكن لها مشرفون */
  const fullSchools = new Set(schoolOnly);
  const bySchool = {};
  svTargets.forEach(t=>{ (bySchool[t.s]=bySchool[t.s]||[]).push(t.sv); });
  Object.entries(bySchool).forEach(([sid, list])=>{
    const sc = state.schools.find(x=>x.id===sid);
    if(sc && (sc.supervisors||[]).length === list.length) fullSchools.add(sid);
  });
  const used = Array.from(fullSchools).filter(id=>state.orders.some(o=>o.schoolId===id));
  let msg = `سيتم حذف ${fullSchools.size} مدرسة و${svTargets.length} مشرف.`;
  if(used.length) msg += `\n\n⚠️ ${used.length} من المدارس المحددة مرتبطة بفعاليات مسجّلة.`;
  if(!confirm(msg+'\n\nمتابعة؟')) return;
  Object.entries(bySchool).forEach(([sid, list])=>{
    const sc = state.schools.find(x=>x.id===sid);
    if(sc && !fullSchools.has(sid)) sc.supervisors = (sc.supervisors||[]).filter(v=>!list.includes(v.id));
  });
  state.schools = state.schools.filter(s=>!fullSchools.has(s.id));
  await saveState(); toast('تم الحذف'); render();
}
/* حذف المكرر: مدارس، مشرفون، أرقام، بريد */
/* دمج المدارس التي تحمل الاسم نفسه مع مشرفيها — بلا تكرار */
/* ══════════ دمج المدارس ══════════ */
const _mzNz = s => String(s||'').replace(/[\u064B-\u0652\u0640]/g,'')
  .replace(/[أإآا]/g,'ا').replace(/[ىي]/g,'ي').replace(/ة/g,'ه')
  .replace(/[\-–—_.,،()]/g,' ').replace(/\s+/g,' ').trim().toLowerCase();
const _mzDigits = s => String(s||'').replace(/\D/g,'');
/* مفتاح المطابقة: الاسم بعد إزالة البادئات العامة (مدرسة / المدرسة / مدارس)
   «مدرسة خالد بن أحمد» = «خالد بن أحمد»، أما «خالد بن أحمد الابتدائية» فتبقى مختلفة */
function schoolKey(name){
  let k = _mzNz(name);
  k = k.replace(/^(المدرسه|مدرسه|مدارس|م)\s+/, '');
  return k.trim();
}
/* يدمج سجلات مدارس في سجل واحد: الفعاليات والمشرفون والبريد */
function mergeSchoolsInto(keep, dups, finalName){
  const st = {schools:0, sups:0, orders:0};
  keep.supervisors = keep.supervisors || [];
  const same = (a,b)=>
    (_mzNz(a.name) && _mzNz(a.name)===_mzNz(b.name)) ||
    (_mzDigits(a.phone) && _mzDigits(a.phone)===_mzDigits(b.phone)) ||
    (_mzNz(a.email) && _mzNz(a.email)===_mzNz(b.email));
  dups.filter(d=>d.id!==keep.id).forEach(dup=>{
    (dup.supervisors||[]).forEach(sv=>{
      const twin = keep.supervisors.find(k=>same(k,sv));
      if(twin){
        /* نكمل الناقص من بيانات المشرف المكرر ثم نحوّل فعالياته */
        if(!twin.phone && sv.phone) twin.phone = sv.phone;
        if(!twin.email && sv.email) twin.email = sv.email;
        (state.orders||[]).forEach(o=>{ if(o.supervisorId===sv.id) o.supervisorId = twin.id; });
        st.sups++;
      } else keep.supervisors.push(sv);
    });
    (state.orders||[]).forEach(o=>{ if(o.schoolId===dup.id){ o.schoolId = keep.id; st.orders++; } });
    if(!keep.level || keep.level==='غير ذلك'){ if(dup.level && dup.level!=='غير ذلك') keep.level = dup.level; }
    if(!keep.email && dup.email) keep.email = dup.email;
    state.schools = state.schools.filter(x=>x.id!==dup.id);
    st.schools++;
  });
  if(finalName && finalName.trim()) keep.name = finalName.trim();
  return st;
}
/* الاسم المقترح للمجموعة: الأكثر اكتمالًا (الأطول) */
function bestSchoolName(g){
  return g.map(s=>s.name||'').sort((a,b)=>b.length-a.length)[0] || '';
}
/* دمج تلقائي للمدارس المتطابقة بالاسم */
async function mergeSameSchools(){
  const groups = new Map();
  (state.schools||[]).forEach(s=>{
    const k = schoolKey(s.name); if(!k) return;
    if(!groups.has(k)) groups.set(k, []);
    groups.get(k).push(s);
  });
  const dupGroups = Array.from(groups.values()).filter(g=>g.length>1);
  if(!dupGroups.length){ toast('لا توجد مدارس متطابقة بالاسم'); return; }
  const preview = dupGroups.map(g=>{
    const svN = g.reduce((s,x)=>s+((x.supervisors||[]).length), 0);
    const evN = g.reduce((s,x)=>s+(state.orders||[]).filter(o=>o.schoolId===x.id).length, 0);
    return `• ${g.map(x=>x.name).join('  +  ')}\n   ← تُدمج باسم: ${bestSchoolName(g)}\n   ${svN} مشرفًا · ${evN} فعالية`;
  }).join('\n\n');
  if(!confirm(`سيتم دمج ${dupGroups.length} مجموعة مدارس متطابقة:\n\n${preview}\n\n`
    + `تُنقل الفعاليات والمشرفون والبريد إلى سجل واحد، ويُحذف المشرفون المكررون.\n\nمتابعة؟`)) return;
  const tot = {schools:0, sups:0, orders:0};
  dupGroups.forEach(g=>{
    const keep = g.slice().sort((a,b)=>((b.supervisors||[]).length - (a.supervisors||[]).length))[0];
    const r = mergeSchoolsInto(keep, g, bestSchoolName(g));
    tot.schools+=r.schools; tot.sups+=r.sups; tot.orders+=r.orders;
  });
  await saveState();
  toast(`دُمجت ${tot.schools} مدرسة · ${tot.sups} مشرفًا مكررًا · نُقلت ${tot.orders} فعالية`);
  render();
}
/* دمج المدارس المحددة يدويًا تحت اسم يختاره المستخدم */
function mergeSelectedSchools(){
  const ids = [...new Set(Array.from(document.querySelectorAll('#schoolsTable .schRow:checked')).map(c=>c.dataset.school))];
  const picked = ids.map(id=>state.schools.find(s=>s.id===id)).filter(Boolean);
  if(picked.length < 2){ toast('حدد مدرستين أو أكثر لدمجها'); return; }
  const def = bestSchoolName(picked);
  openModal(`دمج ${picked.length} مدارس تحت اسم واحد`, [
    {name:'pick', label:'اختر الاسم النهائي', type:'select',
     options: picked.map(s=>({value:s.id, label:s.name})).concat([{value:'__new', label:'— اسم آخر (أكتبه أدناه) —'}])},
    {name:'newName', label:'الاسم الجديد (عند اختيار «اسم آخر»)'},
  ], async v=>{
    let finalName = '';
    if(v.pick==='__new'){
      finalName = (v.newName||'').trim();
      if(!finalName){ toast('اكتب الاسم الجديد'); return false; }
    } else {
      const s = picked.find(x=>x.id===v.pick); finalName = s ? s.name : def;
    }
    /* السجل المُبقى: الذي اخترت اسمه، وإلا الأكثر مشرفين */
    const keep = picked.find(x=>x.id===v.pick)
      || picked.slice().sort((a,b)=>((b.supervisors||[]).length - (a.supervisors||[]).length))[0];
    const svN = picked.reduce((s,x)=>s+((x.supervisors||[]).length), 0);
    const evN = picked.reduce((s,x)=>s+(state.orders||[]).filter(o=>o.schoolId===x.id).length, 0);
    if(!confirm(`سيتم دمج:\n\n${picked.map(s=>'• '+s.name).join('\n')}\n\nتحت اسم: ${finalName}\n\n`
      + `${svN} مشرفًا · ${evN} فعالية — تُحذف المشرفون المكررون ويُحتفظ بالبريد.\n\nمتابعة؟`)) return false;
    const r = mergeSchoolsInto(keep, picked, finalName);
    await saveState();
    toast(`دُمجت ${r.schools+1} مدارس باسم «${finalName}» · ${r.sups} مشرفًا مكررًا · نُقلت ${r.orders} فعالية`);
    render();
  });
  setTimeout(()=>{
    const p = document.getElementById('mf_pick');
    const best = picked.find(s=>s.name===def);
    if(p && best) p.value = best.id;
  },0);
}
async function dedupeAll(){
  const norm = s => (s||'').replace(/\s+/g,' ').trim().toLowerCase();
  const digits = s => (s||'').replace(/\D/g,'');
  let schoolsRemoved=0, svRemoved=0, moved=0;
  /* 1) المدارس المكررة بالاسم */
  const seen = new Map();
  [...state.schools].forEach(s=>{
    const k = norm(s.name);
    if(seen.has(k)){
      const keep = seen.get(k);
      (s.supervisors||[]).forEach(sv=>{
        if(!(keep.supervisors||[]).some(k2=>norm(k2.name)===norm(sv.name))){
          keep.supervisors = keep.supervisors||[]; keep.supervisors.push(sv);
        }
      });
      state.orders.forEach(o=>{ if(o.schoolId===s.id){ o.schoolId=keep.id; moved++; } });
      state.schools = state.schools.filter(x=>x.id!==s.id);
      schoolsRemoved++;
    } else seen.set(k, s);
  });
  /* 2) المشرفون المكررون داخل كل مدرسة (بالاسم أو الجوال أو البريد) */
  state.schools.forEach(s=>{
    const keepList=[], names=new Set(), phones=new Set(), mails=new Set();
    (s.supervisors||[]).forEach(sv=>{
      const n=norm(sv.name), p=digits(sv.phone), m=norm(sv.email);
      const dup = (n && names.has(n)) || (p && phones.has(p)) || (m && mails.has(m));
      if(dup){ svRemoved++; return; }
      if(n) names.add(n); if(p) phones.add(p); if(m) mails.add(m);
      keepList.push(sv);
    });
    s.supervisors = keepList;
  });
  if(!schoolsRemoved && !svRemoved){ toast('لا يوجد تكرار'); return; }
  if(!confirm(`سيتم حذف ${schoolsRemoved} مدرسة مكررة و${svRemoved} مشرف مكرر`+
    (moved?`\nونقل ${moved} فعالية إلى السجل الأصلي.`:'')+`\n\nمتابعة؟`)){ render(); return; }
  await saveState();
  toast(`تم حذف ${schoolsRemoved} مدرسة و${svRemoved} مشرف مكرر`);
  render();
}

function backupInfo(){
  try{
    const last = localStorage.getItem('backup_last');
    const prev = localStorage.getItem('backup_prev');
    const at   = localStorage.getItem('backup_at');
    const sum = s => { try{ const o=JSON.parse(s); return `${(o.orders||[]).length} فعالية · ${(o.schools||[]).length} جهة · ${(o.trainers||[]).length} مقدّم`; }catch(e){ return 'غير صالحة'; } };
    return { last, prev, at, lastSum: last?sum(last):null, prevSum: prev?sum(prev):null };
  }catch(e){ return {}; }
}

/* استرجاع من ملف JSON */
function restoreFromFile(file){
  if(!file) return;
  const rd = new FileReader();
  rd.onload = async ()=>{

/* ══════════════════════════════════════════════════════════════════
   استرجاع السجلات المفقودة بالدمج (لا يمسح شيئًا)
   ──────────────────────────────────────────────────────────────────
   للحالة التي تُدخل فيها بيانات على جهاز ثم لا تظهر لأن جهازًا آخر
   كتب نسخة أقدم فوقها. النسخة الاحتياطية المحلية في ذلك الجهاز
   ما زالت تحملها، فنُضيف منها ما هو مفقود فقط.
   ══════════════════════════════════════════════════════════════════ */
const RECOVER_COLLECTIONS = ['orders','schools','trainers','users','fields','programTypes',
  'placeTypes','venues','adminRequestsList','trainerRequests','quranActivities','tasks'];
const RECOVER_LABEL = { orders:'فعالية', schools:'جهة/مدرسة', trainers:'مقدّم مبادرة',
  users:'مستخدم', fields:'مجال', programTypes:'مسار', placeTypes:'نوع مكان', venues:'مكان تنفيذ',
  adminRequestsList:'طلب إداري', trainerRequests:'طلب مقدّم', quranActivities:'نشاط قرآني', tasks:'مهمة' };

/* يحسب ما هو موجود في المصدر وغائب عن الحالة الحالية */
function recoverDiff(source){
  const out = { total:0, byColl:{}, records:{} };
  if(!source || typeof source !== 'object') return out;
  RECOVER_COLLECTIONS.forEach(k=>{
    const src = Array.isArray(source[k]) ? source[k] : [];
    if(!src.length) return;
    const have = new Set((Array.isArray(state[k])?state[k]:[]).map(x=>x && x.id).filter(Boolean));
    const miss = src.filter(x=>x && x.id && !have.has(x.id));
    if(miss.length){ out.byColl[k] = miss.length; out.records[k] = miss; out.total += miss.length; }
  });
  /* مشرفون مفقودون داخل مدارس موجودة */
  const svMiss = [];
  (Array.isArray(source.schools)?source.schools:[]).forEach(ss=>{
    const cur = (state.schools||[]).find(x=>x.id===ss.id);
    if(!cur) return;   // المدرسة نفسها مفقودة → تُستعاد كاملة أعلاه
    const have = new Set((cur.supervisors||[]).map(v=>v && v.id).filter(Boolean));
    (ss.supervisors||[]).forEach(v=>{ if(v && v.id && !have.has(v.id)) svMiss.push({schoolId:ss.id, sv:v}); });
  });
  if(svMiss.length){ out.supervisors = svMiss; out.byColl.__sv = svMiss.length; out.total += svMiss.length; }
  return out;
}

function recoverSummary(d){
  if(!d.total) return 'لا يوجد أي سجل مفقود — كل ما في النسخة موجود بالنظام.';
  const lines = Object.keys(d.byColl).map(k=>{
    const lbl = k==='__sv' ? 'مشرف' : (RECOVER_LABEL[k]||k);
    return '• ' + d.byColl[k] + ' ' + lbl;
  });
  return lines.join('\n');
}

/* يطبّق الاسترجاع فعليًا */
async function recoverApply(d){
  if(!d.total) return 0;
  Object.keys(d.records||{}).forEach(k=>{
    if(!Array.isArray(state[k])) state[k] = [];
    d.records[k].forEach(r=>state[k].push(r));
  });
  (d.supervisors||[]).forEach(({schoolId, sv})=>{
    const sc = (state.schools||[]).find(x=>x.id===schoolId);
    if(sc){ sc.supervisors = sc.supervisors || []; sc.supervisors.push(sv); }
  });
  /* أعلى رقم تسلسلي حتى لا تتكرر أرقام التكليف */
  const maxSerial = (state.orders||[]).reduce((m,o)=>Math.max(m, Number(o.serial)||0), 0);
  if(maxSerial >= Number(state.nextSerial||0)) state.nextSerial = maxSerial + 1;
  __readFailed = false;
  await flushSave();
  return d.total;
}

/* من النسخة المحلية في هذا المتصفح */
async function recoverFromLocal(which){

  const raw = which==='prev' ? info.prev : info.last;
  if(!raw){ toast('لا توجد نسخة محفوظة في هذا المتصفح'); return; }
  let src = null;

    + recoverSummary(d) + '\n\nمتابعة؟')) return;

}

/* من ملف نسخة احتياطية */
function recoverFromFile(file){
  if(!file) return;

    const d = recoverDiff(src);
    if(!d.total){ alert('هذا الملف لا يحتوي أي سجل مفقود — كل ما فيه موجود بالنظام.'); return; }
    if(!confirm('سيتم استرجاع السجلات المفقودة التالية من الملف\n(لن يُحذف أو يُستبدل أي شيء موجود):\n\n'
      + recoverSummary(d) + '\n\nمتابعة؟')) return;
    const n = await recoverApply(d);
    toast('تم استرجاع ' + n + ' سجلًا مفقودًا');

  };

}

async function dedupeSchools(){
  const norm = s => (s||'').replace(/\s+/g,' ').trim();
  const seen = new Map(), dupes = [];
  (state.schools||[]).forEach(s=>{
    const k = norm(s.name);
    if(seen.has(k)) dupes.push({dup:s, keep:seen.get(k)});
    else seen.set(k, s);
  });
  if(!dupes.length){ toast('لا توجد مدارس مكررة'); return; }
  const list = dupes.map(d=>`• ${d.dup.name}`).join('\n');
  if(!confirm(`وُجدت ${dupes.length} مدرسة مكررة:\n\n${list}\n\nسيتم دمج فعالياتها ومشرفيها في السجل الأصلي ثم حذف المكرر. متابعة؟`)) return;
  let moved = 0;
  dupes.forEach(({dup, keep})=>{
    /* نقل المشرفين غير الموجودين */
    (dup.supervisors||[]).forEach(sv=>{
      const exists = (keep.supervisors||[]).some(k=>norm(k.name)===norm(sv.name));
      if(!exists){ keep.supervisors = keep.supervisors||[]; keep.supervisors.push(sv); }
    });
    /* تحويل الفعاليات للسجل الأصلي */
    (state.orders||[]).forEach(o=>{ if(o.schoolId===dup.id){ o.schoolId = keep.id; moved++; } });
    state.schools = state.schools.filter(s=>s.id!==dup.id);
  });
  await saveState();
  toast(`تم حذف ${dupes.length} مدرسة مكررة ونقل ${moved} فعالية`);
  render();
}
